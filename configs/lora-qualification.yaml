# Direct-code variant; no reasoning targets; same prompt/system for paired no-thinking evaluation.
model: ../work/models-derived/ccore-bf16
data: ../work/sprint-prep/direct-code-proposal/data-v1/repairs
train: false
test: false
fine_tune_type: lora
optimizer: adamw
seed: 42
num_layers: 1
batch_size: 1
grad_accumulation_steps: 1
iters: 10
learning_rate: 1.0e-05
max_seq_length: 4096
grad_checkpoint: false
mask_prompt: true
steps_per_report: 1
steps_per_eval: 5
val_batches: 2
save_every: 5
adapter_path: ../work/sprint-prep/qualification-adapter
lora_parameters:
  rank: 8
  scale: 20.0
  dropout: 0.0
trust_remote_code: false
report_to: null
frozen_prefix_inference: true
response_only_training: true
