# Fresh CCORE reasoning-preserving pilot; helpers excluded from main training.
model: ../work/models-derived/ccore-bf16
data: ../work/sprint-prep/thinking-clean-proposal/data-v1/repairs
train: false
test: false
fine_tune_type: lora
optimizer: adamw
seed: 42
num_layers: 1
batch_size: 1
grad_accumulation_steps: 1
iters: 10
learning_rate: 3.0e-06
max_seq_length: 4096
grad_checkpoint: false
mask_prompt: true
steps_per_report: 1
steps_per_eval: 5
val_batches: 2
save_every: 5
adapter_path: ../work/sprint-prep/qualification-adapter
lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.0
trust_remote_code: false
report_to: null
frozen_prefix_inference: true
response_only_training: false
adapter_setup_audit: ../work/sprint-prep/rank16-from200-proposal/adapter-setup-audit.json
complete_target_mask: exclusive_end_v1
enable_thinking: true
