<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magical Rune Ring</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #060912;
    }

    #info {
      position: fixed;
      top: 22px;
      left: 24px;
      z-index: 10;
      padding: 16px 18px;
      border: 1px solid rgba(164, 135, 255, 0.22);
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(16, 18, 36, 0.82), rgba(8, 10, 22, 0.72));
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
      pointer-events: none;
    }

    #info h1 {
      margin: 0 0 5px;
      color: #bda7ff;
      font-size: 18px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #info p {
      margin: 0;
      color: #9c9bb7;
      font-size: 12px;
      letter-spacing: 0.03em;
    }

    #export {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 10;
      border: 0;
      border-radius: 10px;
      padding: 13px 20px;
      color: #16102d;
      background: linear-gradient(135deg, #c2a9ff, #9265ff);
      box-shadow: 0 8px 24px rgba(110, 78, 255, 0.35);
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: transform 0.16s ease, filter 0.16s ease;
    }

    #export:hover {
      transform: translateY(-2px);
      filter: brightness(1.12);
    }

    #export:active {
      transform: translateY(0);
    }

    #status {
      position: fixed;
      right: 24px;
      bottom: 78px;
      z-index: 10;
      max-width: 340px;
      color: #a9a6c2;
      font-size: 12px;
      text-align: right;
    }

    @media (max-width: 600px) {
      #info {
        top: 14px;
        left: 14px;
      }

      #export {
        right: 14px;
        bottom: 14px;
      }

      #status {
        right: 14px;
        bottom: 68px;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div id="info">
    <h1>Magical Rune Ring</h1>
    <p>Drag to orbit · Scroll to zoom · Right-drag to pan</p>
  </div>

  <div id="status">Static low-poly asset ready</div>
  <button id="export" type="button">Export GLB</button>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060912);
    scene.fog = new THREE.FogExp2(0x060912, 0.035);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(7.2, 6.1, 8.4);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.65, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 5;
    controls.maxDistance = 18;
    controls.maxPolarAngle = Math.PI * 0.48;

    scene.add(new THREE.HemisphereLight(0x99b7ff, 0x181324, 1.7));

    const ambient = new THREE.AmbientLight(0x747b9d, 0.65);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xb8d8ff, 3.2);
    keyLight.position.set(5, 9, 6);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 30;
    scene.add(keyLight);

    const violetLight = new THREE.PointLight(0x8a4dff, 20, 9, 2);
    violetLight.position.set(-2.5, 2.2, 1.5);
    scene.add(violetLight);

    const cyanLight = new THREE.PointLight(0x49eaff, 13, 8, 2);
    cyanLight.position.set(2.8, 1.8, -2.2);
    scene.add(cyanLight);

    const asset = new THREE.Group();
    asset.name = "Magical Rune Ring";
    scene.add(asset);

    const materials = {
      earth: new THREE.MeshStandardMaterial({
        color: 0x273247,
        roughness: 0.95,
        flatShading: true
      }),
      moss: new THREE.MeshStandardMaterial({
        color: 0x39496a,
        roughness: 0.9,
        flatShading: true
      }),
      stone: new THREE.MeshStandardMaterial({
        color: 0x42475a,
        roughness: 0.8,
        flatShading: true
      }),
      rune: new THREE.MeshStandardMaterial({
        color: 0xb58cff,
        emissive: 0x7d35ff,
        emissiveIntensity: 2.8,
        roughness: 0.25,
        metalness: 0.15
      }),
      runeBlue: new THREE.MeshStandardMaterial({
        color: 0x82ecff,
        emissive: 0x22bde8,
        emissiveIntensity: 2.4,
        roughness: 0.25,
        metalness: 0.1
      }),
      crystal: new THREE.MeshStandardMaterial({
        color: 0x8d68ff,
        emissive: 0x6b25df,
        emissiveIntensity: 1.9,
        roughness: 0.18,
        metalness: 0.12,
        flatShading: true
      }),
      crystalBlue: new THREE.MeshStandardMaterial({
        color: 0x55ddff,
        emissive: 0x1189d4,
        emissiveIntensity: 1.8,
        roughness: 0.18,
        metalness: 0.1,
        flatShading: true
      }),
      wisp: new THREE.MeshBasicMaterial({
        color: 0xa68cff,
        transparent: true,
        opacity: 0.72,
        depthWrite: false,
        toneMapped: false
      }),
      mushroom: new THREE.MeshStandardMaterial({
        color: 0x8f61d2,
        emissive: 0x35144d,
        emissiveIntensity: 0.7,
        roughness: 0.45,
        flatShading: true
      })
    };

    function addMesh(
      geometry,
      material,
      position = [0, 0, 0],
      rotation = [0, 0, 0],
      scale = [1, 1, 1],
      parent = asset
    ) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(...position);
      mesh.rotation.set(...rotation);
      mesh.scale.set(...scale);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    // Low-poly mossy platform.
    addMesh(
      new THREE.CylinderGeometry(4.35, 4.6, 0.5, 12),
      materials.earth,
      [0, 0.25, 0]
    );

    addMesh(
      new THREE.CylinderGeometry(4.22, 4.22, 0.16, 12),
      materials.moss,
      [0, 0.57, 0]
    );

    // A few angular stones around the platform.
    const rockGeometry = new THREE.DodecahedronGeometry(0.28, 0);
    for (let i = 0; i < 13; i++) {
      const angle = (i / 13) * Math.PI * 2 + i * 0.19;
      const radius = 3.62 + (i % 3) * 0.12;
      const scale = 0.65 + (i % 4) * 0.15;

      addMesh(
        rockGeometry,
        materials.stone,
        [
          Math.cos(angle) * radius,
          0.68 + (i % 2) * 0.05,
          Math.sin(angle) * radius
        ],
        [i * 0.21, angle, i * 0.13],
        [scale, scale * 0.62, scale]
      );
    }

    // Main broken magical halo.
    const halo = addMesh(
      new THREE.TorusGeometry(3.38, 0.13, 6, 64),
      materials.rune,
      [0, 0.73, 0],
      [Math.PI / 2, 0, 0]
    );
    halo.castShadow = false;

    // Thin inner halo.
    const innerHalo = addMesh(
      new THREE.TorusGeometry(2.62, 0.045, 5, 64),
      materials.runeBlue,
      [0, 0.735, 0],
      [Math.PI / 2, 0, 0]
    );
    innerHalo.castShadow = false;

    // Broken rune-ring arcs.
    const arcMaterial = new THREE.MeshBasicMaterial({
      color: 0x9b78ff,
      transparent: true,
      opacity: 0.68,
      depthWrite: false,
      toneMapped: false
    });

    for (let i = 0; i < 3; i++) {
      const arcGroup = new THREE.Group();
      arcGroup.rotation.x = Math.PI / 2;
      arcGroup.rotation.y = i * (Math.PI * 2 / 3) + 0.2;
      asset.add(arcGroup);

      const arc = addMesh(
        new THREE.TorusGeometry(3.57, 0.022, 4, 48, Math.PI * 1.25),
        arcMaterial,
        [0, 0.76, 0],
        [0, 0, 0.72 * i],
        [1, 1, 1],
        arcGroup
      );
      arc.castShadow = false;
      arc.receiveShadow = false;
    }

    // Twelve procedural geometric runes.
    const runeStrokes = [
      [
        [-0.45, 0, -0.18],
        [-0.15, 0, 0.18],
        [0.15, 0, 0.18],
        [0.45, 0, -0.18],
        [-0.45, 0, -0.18],
        [0.45, 0, -0.18]
      ],
      [
        [-0.45, 0, -0.18],
        [0.45, 0, -0.18],
        [-0.45, 0, 0.18],
        [0.45, 0, 0.18],
        [-0.35, 0, 0],
        [0.35, 0, 0]
      ],
      [
        [-0.45, 0, 0],
        [0, 0, 0.45],
        [0, 0, 0.45],
        [0.45, 0, 0],
        [-0.45, 0, 0],
        [0.45, 0, 0]
      ],
      [
        [-0.45, 0, 0],
        [0, 0, 0.45],
        [0, 0, 0.45],
        [0.45, 0, 0],
        [-0.35, 0, 0.28],
        [0.35, 0, 0.28]
      ],
      [
        [-0.45, 0, 0.18],
        [-0.45, 0, -0.18],
        [0.45, 0, 0.18],
        [0.45, 0, -0.18],
        [0, 0, 0.18],
        [0, 0, -0.18]
      ],
      [
        [-0.45, 0, 0.3],
        [0.45, 0, 0.3],
        [0, 0, 0.3],
        [0, 0, -0.3],
        [-0.35, 0, 0],
        [0.35, 0, 0]
      ],
      [
        [-0.45, 0, 0.18],
        [0, 0, -0.45],
        [0.45, 0, 0.18],
        [-0.35, 0, -0.35],
        [0.35, 0, -0.35]
      ],
      [
        [-0.45, 0, 0],
        [0.45, 0, 0],
        [-0.45, 0, 0],
        [0.45, 0, 0]
      ],
      [
        [-0.4, 0, -0.3],
        [-0.4, 0, 0.3],
        [0.4, 0, -0.3],
        [0.4, 0, 0.3],
        [0, 0, 0]
      ],
      [
        [-0.4, 0, -0.3],
        [-0.4, 0, 0.3],
        [0, 0, 0],
        [0.4, 0, 0],
        [0, 0, 0]
      ],
      [
        [-0.45, 0, -0.18],
        [0.45, 0, -0.18],
        [0, 0, 0.45],
        [0, 0, 0.45],
        [0, 0, 0]
      ],
      [
        [-0.45, 0, 0.18],
        [0.45, 0, 0.18],
        [-0.45, 0, -0.18],
        [0.45, 0, -0.18],
        [0, 0, 0.18],
        [0, 0, -0.18]
      ]
    ];

    for (let i = 0; i < 12; i++) {
      const angle = (i / 12) * Math.PI * 2;
      const rune = new THREE.Group();
      rune.name = `Rune ${i + 1}`;
      rune.position.set(
        Math.cos(angle) * 3.38,
        0.755,
        Math.sin(angle) * 3.38
      );
      rune.rotation.y = -angle;
      asset.add(rune);

      const strokeMaterial = i % 2 === 0 ? materials.rune : materials.runeBlue;

      runeStrokes[i].forEach((stroke) => {
        const next = runeStrokes[(i + 1) % runeStrokes.length];

        for (let s = 0; s < stroke.length; s++) {
          const start = stroke[s];
          const end = stroke[s + 1];

          const dx = end[0] - start[0];
          const dz = end[1] - start[1];
          const length = Math.hypot(dx, dz);

          const segment = new THREE.Mesh(
            new THREE.BoxGeometry(length, 0.026, 0.038),
            strokeMaterial
          );

          segment.position.set(
            (start[0] + end[0]) * 0.5,
            0,
            (start[1] + end[1]) * 0.5
          );

          segment.quaternion.setFromUnitVectors(
            new THREE.Vector3(1, 0, 0),
            new THREE.Vector3(dx, 0, dz).normalize()
          );

          rune.add(segment);
        }
      });
    }

    // Glowing magical crystals around the ring.
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2 + 0.16;
      const radius = 3.13 + (i % 2) * 0.18;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;

      addMesh(
        new THREE.CylinderGeometry(0.12, 0.22, 0.48, 5),
        i % 2 === 0 ? materials.crystal : materials.crystalBlue,
        [x, 0.8, z],
        [0, angle, 0]
      );

      addMesh(
        new THREE.ConeGeometry(0.24, 0.95, 5),
        i % 2 === 0 ? materials.crystal : materials.crystalBlue,
        [x, 1.25, z],
        [0, angle, 0]
      );
    }

    // Small magical mushrooms.
    function addMushroom(x, z, scale = 1) {
      const mushroom = new THREE.Group();
      mushroom.position.set(x, 0.64, z);
      mushroom.scale.setScalar(scale);
      asset.add(mushroom);

      addMesh(
        new THREE.CylinderGeometry(0.065, 0.085, 0.34, 6),
        materials.mushroom,
        [0, 0.17, 0],
        [0, 0, 0],
        [1, 1, 1],
        mushroom
      );

      addMesh(
        new THREE.SphereGeometry(0.25, 8, 4, 0, Math.PI * 2, 0, Math.PI / 2),
        materials.mushroom,
        [0, 0.33, 0],
        [0, 0, 0],
        [1, 0.78, 1],
        mushroom
      );
    }

    addMushroom(-2.65, -1.45, 0.85);
    addMushroom(2.72, 1.52, 0.72);
    addMushroom(-1.1, -2.65, 0.6);
    addMushroom(2.12, -2.45, 0.56);

    // Central arcane core.
    addMesh(
      new THREE.CylinderGeometry(0.34, 0.46, 0.2, 8),
      materials.runeBlue,
      [0, 0.78, 0]
    );

    addMesh(
      new THREE.IcosahedronGeometry(0.28, 0),
      materials.crystal,
      [0, 1.03, 0]
    );

    addMesh(
      new THREE.TorusGeometry(0.52, 0.025, 5, 32),
      materials.runeBlue,
      [0, 1.03, 0],
      [Math.PI / 2, 0, 0]
    );

    // Floating geometric shards.
    const shardGeometry = new THREE.OctahedronGeometry(0.16, 0);
    for (let i = 0; i < 10; i++) {
      const angle = (i / 10) * Math.PI * 2 + 0.28;
      const radius = 3.65 + (i % 2) * 0.28;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;
      const y = 0.95 + (i % 3) * 0.22;
      const scale = 0.55 + (i % 3) * 0.16;

      addMesh(
        shardGeometry,
        i % 2 === 0 ? materials.rune : materials.crystalBlue,
        [x, y, z],
        [angle * 0.4, angle, angle * 0.7],
        [scale * 0.55, scale * 1.7, scale * 0.55]
      );
    }

    // Small magical motes around the ring.
    const moteMaterial = new THREE.MeshBasicMaterial({
      color: 0x9d8cff,
      toneMapped: false
    });

    for (let i = 0; i < 24; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 2.3 + Math.random() * 1.45;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;
      const y = 0.9 + Math.random() * 1.4;

      const mote = new THREE.Mesh(
        new THREE.TetrahedronGeometry(0.025 + Math.random() * 0.025),
        moteMaterial
      );
      mote.position.set(x, y, z);
      mote.rotation.set(Math.random(), Math.random(), Math.random());
      asset.add(mote);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    const exportButton = document.getElementById("export");
    const status = document.getElementById("status");

    exportButton.addEventListener("click", () => {
      exportButton.disabled = true;
      status.textContent = "Preparing GLB...";

      asset.updateMatrixWorld(true);

      const exporter = new GLTFExporter();
      exporter.parse(
        asset,
        (result) => {
          const blob = new Blob([result], {
            type: "model/gltf-binary"
          });

          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "magical-rune-ring.glb";
          document.body.appendChild(link);
          link.click();
          link.remove();

          setTimeout(() => URL.revokeObjectURL(url), 1500);

          exportButton.disabled = false;
          status.textContent = "GLB exported successfully";
        },
        (error) => {
          console.error(error);
          exportButton.disabled = false;
          status.textContent = "Export failed — see console";
        },
        {
          binary: true
        }
      );
    });
  </script>
</body>
</html>
