<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yellow Drilling Rig</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111827;
    }

    #viewport {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .panel {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      width: min(360px, calc(100vw - 40px));
      padding: 18px 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.84);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(12px);
      color: #eef2f7;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      letter-spacing: 0.02em;
    }

    p {
      margin: 0 0 16px;
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.45;
    }

    button {
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 9px;
      background: #f2b51b;
      color: #17130a;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    button:hover {
      background: #ffd15c;
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
      transform: none;
    }

    #status {
      min-height: 18px;
      margin-top: 10px;
      color: #94a3b8;
      font-size: 12px;
    }

    .hint {
      position: fixed;
      right: 18px;
      bottom: 16px;
      z-index: 10;
      color: rgba(226, 232, 240, 0.7);
      font-size: 12px;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .panel {
        top: 12px;
        left: 12px;
        width: calc(100vw - 24px);
      }

      .hint {
        display: none;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div id="viewport"></div>

  <div class="panel">
    <h1>Yellow Drilling Rig</h1>
    <p>
      Compact low-poly crawler drill rig with a tracked chassis, enclosed cab,
      hydraulic mast, and vertical drill assembly.
    </p>

    <button id="exportButton" type="button">Export GLB</button>
    <div id="status">Ready to export.</div>
  </div>

  <div class="hint">Drag to orbit · Scroll to zoom</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

    // -------------------------------------------------------------------------
    // Renderer, scene, and camera
    // -------------------------------------------------------------------------

    const viewport = document.getElementById("viewport");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111827);
    scene.fog = new THREE.Fog(0x111827, 13, 30);

    const camera = new THREE.PerspectiveCamera(
      42,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(6.5, 4.7, 7.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    viewport.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0.25, 1.85, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.minDistance = 4;
    controls.maxDistance = 16;
    controls.maxPolarAngle = Math.PI * 0.49;

    // -------------------------------------------------------------------------
    // Lighting and presentation stage
    // -------------------------------------------------------------------------

    scene.add(new THREE.HemisphereLight(0xbdd7ff, 0x24211a, 2.1));

    const keyLight = new THREE.DirectionalLight(0xfff1d8, 3.2);
    keyLight.position.set(5, 9, 7);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -8;
    keyLight.shadow.camera.right = 8;
    keyLight.shadow.camera.top = 8;
    keyLight.shadow.camera.bottom = -8;
    keyLight.shadow.bias = -0.0004;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x86b7ff, 1.8);
    rimLight.position.set(-6, 5, -5);
    scene.add(rimLight);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({
        color: 0x1e293b,
        roughness: 0.9,
        metalness: 0.08
      })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.015;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(16, 32, 0x64748c, 0x334155);
    grid.position.y = 0.002;
    grid.material.transparent = true;
    grid.material.opacity = 0.28;
    scene.add(grid);

    // -------------------------------------------------------------------------
    // Exportable asset group
    // -------------------------------------------------------------------------

    const rig = new THREE.Group();
    rig.name = "Yellow_Drilling_Rig";
    scene.add(rig);

    const materials = {
      yellow: new THREE.MeshStandardMaterial({
        color: 0xf2b51b,
        roughness: 0.48,
        metalness: 0.18,
        flatShading: true
      }),
      yellowDark: new THREE.MeshStandardMaterial({
        color: 0xd99008,
        roughness: 0.56,
        metalness: 0.18,
        flatShading: true
      }),
      steel: new THREE.MeshStandardMaterial({
        color: 0x8793a3,
        roughness: 0.36,
        metalness: 0.7,
        flatShading: true
      }),
      darkSteel: new THREE.MeshStandardMaterial({
        color: 0x29323e,
        roughness: 0.52,
        metalness: 0.58,
        flatShading: true
      }),
      rubber: new THREE.MeshStandardMaterial({
        color: 0x11171d,
        roughness: 0.9,
        metalness: 0.05,
        flatShading: true
      }),
      glass: new THREE.MeshStandardMaterial({
        color: 0x244d5d,
        roughness: 0.18,
        metalness: 0.35,
        flatShading: true
      }),
      light: new THREE.MeshStandardMaterial({
        color: 0xfff2c5,
        emissive: 0xffc84d,
        emissiveIntensity: 1.3,
        roughness: 0.25
      }),
      hazard: new THREE.MeshStandardMaterial({
        color: 0x171b20,
        roughness: 0.7,
        metalness: 0.1
      })
    };

    function addBox(name, size, position, material, parent = rig) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(size[0], size[1], size[2]),
        material
      );
      mesh.name = name;
      mesh.position.set(position[0], position[1], position[2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addCylinderBetween(
      name,
      start,
      end,
      radius,
      material,
      parent = rig,
      radialSegments = 10
    ) {
      const a = new THREE.Vector3(...start);
      const b = new THREE.Vector3(...end);
      const direction = new THREE.Vector3().subVectors(b, a);
      const length = direction.length();

      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(
          radius,
          radius,
          length,
          radialSegments,
          1,
          false
        ),
        material
      );

      mesh.name = name;
      mesh.position.copy(a).add(b).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    // -------------------------------------------------------------------------
    // Crawler tracks
    // -------------------------------------------------------------------------

    const trackGeometry = new THREE.CapsuleGeometry(0.48, 1.85, 4, 8);

    for (const side of [-1, 1]) {
      const track = new THREE.Mesh(trackGeometry, materials.rubber);
      track.name = side < 0 ? "Left_Crawler" : "Right_Crawler";
      track.rotation.z = Math.PI / 2;
      track.position.set(0, 0.55, side * 1.03);
      track.castShadow = true;
      track.receiveShadow = true;
      rig.add(track);

      // Yellow track guard.
      addBox(
        side < 0 ? "Left_Crawler_Guard" : "Right_Crawler_Guard",
        [2.55, 0.22, 0.12],
        [0, 0.89, side * 1.02],
        materials.yellowDark
      );

      // Small road wheels.
      for (const x of [-1.12, 0, 1.12]) {
        const wheel = new THREE.Mesh(
          new THREE.CylinderGeometry(0.18, 0.18, 0.13, 10),
          materials.steel
        );
        wheel.name = "Crawler_Wheel";
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(x, 0.55, side * 1.03);
        wheel.castShadow = true;
        rig.add(wheel);
      }
    }

    // -------------------------------------------------------------------------
    // Main chassis and body
    // -------------------------------------------------------------------------

    addBox(
      "Main_Chassis",
      [3.2, 0.34, 1.55],
      [0, 0.9, 0],
      materials.darkSteel
    );

    addBox(
      "Yellow_Side_Body",
      [2.95, 0.68, 0.14],
      [0.05, 1.35, 0.78],
      materials.yellow
    );

    addBox(
      "Yellow_Side_Body_Other",
      [2.95, 0.68, 0.14],
      [0.05, 1.35, -0.78],
      materials.yellow
    );

    addBox(
      "Front_Bumper",
      [0.18, 0.26, 1.72],
      [1.66, 0.91, 0],
      materials.yellowDark
    );

    addBox(
      "Rear_Bumper",
      [0.18, 0.26, 1.72],
      [-1.67, 0.91, 0],
      materials.darkSteel
    );

    // Low-profile side accent strips.
    for (const side of [-1, 1]) {
      addBox(
        side < 0 ? "Left_Side_Accent" : "Right_Side_Accent",
        [0.48, 0.1, 0.025],
        [-0.48, 1.35, side * 0.865],
        materials.yellowDark
      );
    }

    // -------------------------------------------------------------------------
    // Crawler body / engine housing
    // -------------------------------------------------------------------------

    addBox(
      "Engine_Housing",
      [0.82, 0.65, 0.94],
      [-1.02, 1.48, 0.4],
      materials.yellow
    );

    addBox(
      "Engine_Hood_Top",
      [0.55, 0.12, 0.65],
      [-1.02, 1.85, 0.4],
      materials.yellowDark
    );

    // Exhaust stack.
    addCylinderBetween(
      "Exhaust_Stack",
      [-1.38, 1.83, 0.1],
      [-1.38, 2.65, 0.1],
      0.075,
      materials.darkSteel
    );

    addCylinderBetween(
      "Exhaust_Cap",
      [-1.38, 2.62, 0.1],
      [-1.38, 2.76, 0.1],
      0.11,
      materials.darkSteel
    );

    // -------------------------------------------------------------------------
    // Cab / cockpit
    // -------------------------------------------------------------------------

    const cab = new THREE.Group();
    cab.name = "Cockpit";
    rig.add(cab);

    addBox(
      "Cab_Body",
      [1.5, 1.35, 0.95],
      [-0.35, 2.15, 0.42],
      materials.yellow,
      cab
    );

    addBox(
      "Front_Windshield",
      [0.055, 0.72, 0.64],
      [0.405, 2.32, 0.42],
      materials.glass,
      cab
    );

    addBox(
      "Left_Windshield",
      [0.88, 0.65, 0.055],
      [-0.35, 2.4, 0.905],
      materials.glass,
      cab
    );

    addBox(
      "Door_Handle",
      [0.24, 0.055, 0.045],
      [-0.63, 1.92, 0.91],
      materials.darkSteel,
      cab
    );

    addBox(
      "Cab_Roof",
      [1.58, 0.12, 1.02],
      [-0.35, 2.86, 0.42],
      materials.yellowDark,
      cab
    );

    // Work lights on the roof.
    for (const z of [-0.05, 0.45]) {
      addBox(
        "Roof_Work_Light",
        [0.2, 0.12, 0.18],
        [-0.38, 3.0, z],
        materials.light,
        cab
      );
    }

    // -------------------------------------------------------------------------
    // Front drilling boom and hydraulic assembly
    // -------------------------------------------------------------------------

    addBox(
      "Boom_Base",
      [0.62, 0.22, 0.78],
      [1.55, 1.55, 0],
      materials.yellowDark
    );

    addCylinderBetween(
      "Main_Drill_Boom",
      [1.55, 1.55, 0],
      [2.7, 1.65, 0],
      0.18,
      materials.yellow,
      rig,
      8
    );

    // Boom end cap.
    addBox(
      "Boom_End_Cap",
      [0.22, 0.34, 0.48],
      [2.72, 1.65, 0],
      materials.yellowDark
    );

    // Hydraulic cylinder and exposed piston.
    addCylinderBetween(
      "Hydraulic_Cylinder",
      [1.55, 1.38, -0.4],
      [2.25, 1.67, -0.4],
      0.105,
      materials.darkSteel,
      rig,
      10
    );

    addCylinderBetween(
      "Hydraulic_Piston",
      [2.08, 1.51, -0.4],
      [2.68, 1.67, -0.4],
      0.052,
      materials.steel,
      rig,
      10
    );

    addCylinderBetween(
      "Hydraulic_Rod_End",
      [2.68, 1.67, -0.4],
      [2.76, 1.65, -0.4],
      0.085,
      materials.steel,
      rig,
      10
    );

    // Mast support braces.
    for (const side of [-1, 1]) {
      addCylinderBetween(
        side < 0 ? "Mast_Brace_Left" : "Mast_Brace_Right",
        [1.55, 1.55, side * 0.38],
        [1.55, 2.72, side * 0.25],
        0.095,
        materials.darkSteel,
        rig,
        8
      );
    }

    // -------------------------------------------------------------------------
    // Vertical drill mast and drill assembly
    // -------------------------------------------------------------------------

    addBox(
      "Drill_Mast_Base",
      [0.68, 0.22, 0.78],
      [1.55, 1.65, 0],
      materials.yellowDark
    );

    addBox(
      "Vertical_Drill_Mast",
      [0.38, 2.72, 0.38],
      [1.55, 3.01, 0],
      materials.yellow,
      rig
    );

    addBox(
      "Mast_Dark_Inset",
      [0.15, 2.35, 0.39],
      [1.55, 3.0, -0.205],
      materials.yellowDark,
      rig
    );

    addCylinderBetween(
      "Mast_Top_Cap",
      [1.55, 4.37, 0],
      [1.55, 4.5, 0],
      0.27,
      materials.yellowDark,
      rig,
      8
    );

    addCylinderBetween(
      "Mast_Top_Cap",
      [1.55, 4.37, 0],
      [1.55, 4.5, 0],
      0.27,
      materials.yellowDark,
      rig,
      8
    );

    // Mast attachment collar.
    addCylinderBetween(
      "Drill_Mast_Collar",
      [1.55, 4.02, 0],
      [1.55, 3.96, 0],
      0.14,
      materials.darkSteel,
      rig,
      10
    );

    // Drill rod.
    addCylinderBetween(
      "Drill_Rod",
      [1.55, 1.55, 0],
      [1.55, 4.0, 0],
      0.055,
      materials.steel,
      rig,
      10
    );

    // Drill bit.
    const drillBit = new THREE.Mesh(
      new THREE.ConeGeometry(0.18, 0.42, 6),
      materials.steel
    );
    drillBit.name = "Drill_Bit";
    drillBit.position.set(1.55, 1.37, 0);
    drillBit.castShadow = true;
    rig.add(drillBit);

    addCylinderBetween(
      "Drill_Bit_Center",
      [1.55, 1.13, 0],
      [1.55, 1.55, 0],
      0.065,
      materials.steel,
      rig,
      6
    );

    // Mast work lights.
    for (const z of [-0.26, 0.26]) {
      addBox(
        "Mast_Work_Light",
        [0.12, 0.11, 0.16],
        [1.55, 4.48, z],
        materials.light
      );
    }

    // -------------------------------------------------------------------------
    // Stabilizer legs
    // -------------------------------------------------------------------------

    for (const side of [-1, 1]) {
      addCylinderBetween(
        side < 0 ? "Stabilizer_Leg_Left" : "Stabilizer_Leg_Right",
        [2.32, 0.72, side * 0.52],
        [2.65, 0.18, side * 0.66],
        0.105,
        materials.darkSteel,
        rig,
        8
      );

      addBox(
        side < 0 ? "Stabilizer_Foot_Left" : "Stabilizer_Foot_Right",
        [0.48, 0.12, 0.42],
        [2.65, 0.08, side * 0.66],
        materials.yellowDark
      );
    }

    // -------------------------------------------------------------------------
    // Final asset organization
    // -------------------------------------------------------------------------

    rig.traverse((object) => {
      if (object.isMesh) {
        object.castShadow = true;
        object.receiveShadow = true;
        object.frustumCulled = true;
      }
    });

    // -------------------------------------------------------------------------
    // GLB export
    // -------------------------------------------------------------------------

    const exportButton = document.getElementById("exportButton");
    const status = document.getElementById("status");

    exportButton.addEventListener("click", () => {
      exportButton.disabled = true;
      status.textContent = "Preparing GLB...";

      const exporter = new GLTFExporter();

      exporter.parse(
        rig,
        (result) => {
          const blob = new Blob([result], {
            type: "model/gltf-binary"
          });

          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "yellow_drilling_rig.glb";
          document.body.appendChild(link);
          link.click();
          link.remove();

          setTimeout(() => URL.revokeObjectURL(url), 2000);

          exportButton.disabled = false;
          status.textContent = "Exported yellow_drilling_rig.glb";
        },
        (error) => {
          console.error(error);
          exportButton.disabled = false;
          status.textContent = "Export failed. Check the browser console.";
        },
        {
          binary: true,
          onlyVisible: true,
          truncateDrawRange: true
        }
      );
    });

    // -------------------------------------------------------------------------
    // Animation loop and resize handling
    // -------------------------------------------------------------------------

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
