<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wooden Chicken Coop</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #10151b;
    }

    #viewport {
      position: absolute;
      inset: 0;
    }

    #viewport canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .panel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      width: min(360px, calc(100vw - 40px));
      padding: 18px 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      background: rgba(18, 24, 31, 0.82);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 20px;
      letter-spacing: 0.02em;
      color: #f4ead5;
    }

    p {
      margin: 0 0 16px;
      color: #aeb9c4;
      font-size: 13px;
      line-height: 1.5;
    }

    .button-row {
      display: flex;
      gap: 10px;
    }

    button {
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      background: #d88b3a;
      color: #fffaf0;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease, opacity 120ms ease;
    }

    button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
      transform: none;
    }

    button.secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #e8edf2;
    }

    #status {
      min-height: 18px;
      margin-top: 12px;
      color: #8e9aa7;
      font-size: 12px;
    }

    .hint {
      position: absolute;
      right: 20px;
      bottom: 18px;
      z-index: 10;
      padding: 8px 11px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      background: rgba(10, 14, 19, 0.55);
      color: #91a0ad;
      font-size: 12px;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .panel {
        top: 12px;
        left: 12px;
        width: calc(100vw - 24px);
      }

      .hint {
        right: 12px;
        bottom: 12px;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div id="viewport"></div>

  <section class="panel">
    <h1>Wooden Chicken Coop</h1>
    <p>
      A sturdy, low-poly timber coop with a red gable roof, open front,
      interior bars, and a stylized chicken.
    </p>

    <div class="button-row">
      <button id="exportButton" type="button">Export GLB</button>
      <button id="resetButton" class="secondary" type="button">Reset View</button>
    </div>

    <div id="status" aria-live="polite"></div>
  </section>

  <div class="hint">Drag to orbit · Scroll to zoom</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

    const viewport = document.getElementById("viewport");
    const exportButton = document.getElementById("exportButton");
    const resetButton = document.getElementById("resetButton");
    const status = document.getElementById("status");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x10151b);
    scene.fog = new THREE.Fog(0x10151b, 12, 25);

    const camera = new THREE.PerspectiveCamera(
      42,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    const defaultCameraPosition = new THREE.Vector3(6.3, 4.8, 7.2);
    const defaultTarget = new THREE.Vector3(0, 2.05, 0);

    camera.position.copy(defaultCameraPosition);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    viewport.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(defaultTarget);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.minDistance = 4.5;
    controls.maxDistance = 14;
    controls.maxPolarAngle = Math.PI * 0.49;

    const hemisphereLight = new THREE.HemisphereLight(
      0xb9d6ff,
      0x5b3823,
      2.15
    );
    scene.add(hemisphereLight);

    const keyLight = new THREE.DirectionalLight(0xffead0, 4.2);
    keyLight.position.set(5, 8, 6);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -6;
    keyLight.shadow.camera.right = 6;
    keyLight.shadow.camera.top = 7;
    keyLight.shadow.camera.bottom = -3;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 20;
    keyLight.shadow.bias = -0.0004;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x9bc9ff, 1.45);
    fillLight.position.set(-5, 4, -4);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xff7e45, 1.0);
    rimLight.position.set(-2, 5, 6);
    scene.add(rimLight);

    // Presentation-only ground. It is not included in the exported GLB.
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(15, 64),
      new THREE.MeshStandardMaterial({
        color: 0x202a32,
        roughness: 0.96,
        metalness: 0,
      })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.015;
    ground.receiveShadow = true;
    scene.add(ground);

    const asset = new THREE.Group();
    asset.name = "WoodenChickenCoop";
    scene.add(asset);

    const materials = {
      wood: new THREE.MeshStandardMaterial({
        color: 0xb9793d,
        roughness: 0.82,
        metalness: 0,
      }),
      woodDark: new THREE.MeshStandardMaterial({
        color: 0x704124,
        roughness: 0.9,
        metalness: 0,
      }),
      woodLight: new THREE.MeshStandardMaterial({
        color: 0xd19a56,
        roughness: 0.8,
        metalness: 0,
      }),
      interior: new THREE.MeshStandardMaterial({
        color: 0x3c2417,
        roughness: 1,
        metalness: 0,
      }),
      red: new THREE.MeshStandardMaterial({
        color: 0xb6382f,
        roughness: 0.7,
        metalness: 0,
      }),
      redLight: new THREE.MeshStandardMaterial({
        color: 0xd24b38,
        roughness: 0.68,
        metalness: 0,
      }),
      redDark: new THREE.MeshStandardMaterial({
        color: 0x762a26,
        roughness: 0.78,
        metalness: 0,
      }),
      chickenWhite: new THREE.MeshStandardMaterial({
        color: 0xf0dfbd,
        roughness: 0.88,
        metalness: 0,
      }),
      chickenCream: new THREE.MeshStandardMaterial({
        color: 0xffe5b5,
        roughness: 0.84,
        metalness: 0,
      }),
      chickenRed: new THREE.MeshStandardMaterial({
        color: 0xb73631,
        roughness: 0.75,
        metalness: 0,
      }),
      beak: new THREE.MeshStandardMaterial({
        color: 0xe6a529,
        roughness: 0.65,
        metalness: 0,
      }),
      eye: new THREE.MeshStandardMaterial({
        color: 0x121316,
        roughness: 0.35,
        metalness: 0.05,
      }),
    };

    function mesh(geometry, material, name, parent = asset) {
      const object = new THREE.Mesh(geometry, material);
      object.name = name;
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }

    function box(width, height, depth, material, position, name, parent = asset) {
      const object = mesh(
        new THREE.BoxGeometry(width, height, depth),
        material,
        name,
        parent
      );
      object.position.copy(position);
      return object;
    }

    // Floor platform.
    box(4.1, 0.22, 3.0, materials.woodDark, new THREE.Vector3(0, 0.11, 0), "FloorPlatform");

    // Individual floor boards.
    for (let i = 0; i < 5; i++) {
      const x = -1.44 + i * 0.72;
      box(
        0.67,
        0.10,
        2.82,
        i % 2 === 0 ? materials.wood : materials.woodLight,
        new THREE.Vector3(x, 0.27, 0),
        `FloorBoard_${i + 1}`
      );
    }

    // Four structural posts.
    const postPositions = [
      [-1.85, -1.3],
      [1.85, -1.3],
      [-1.85, 1.3],
      [1.85, 1.3],
    ];

    postPositions.forEach(([x, z], index) => {
      box(
        0.30,
        3.0,
        0.30,
        materials.wood,
        new THREE.Vector3(x, 1.75, z),
        `Post_${index + 1}`
      );

      // Slightly darker foot caps.
      box(
        0.34,
        0.16,
        0.34,
        materials.woodDark,
        new THREE.Vector3(x, 0.37, z),
        `PostFoot_${index + 1}`
      );
    });

    // Top beams.
    box(4.15, 0.22, 0.24, materials.woodDark, new THREE.Vector3(0, 3.25, -1.3), "RearTopBeam");
    box(4.15, 0.22, 0.24, materials.woodDark, new THREE.Vector3(0, 3.25, 1.3), "FrontTopBeam");
    box(0.24, 0.22, 2.65, materials.woodDark, new THREE.Vector3(-1.85, 3.25, 0), "LeftTopBeam");
    box(0.24, 0.22, 2.65, materials.woodDark, new THREE.Vector3(1.85, 3.25, 0), "RightTopBeam");

    // Interior side walls.
    box(0.13, 2.68, 2.65, materials.interior, new THREE.Vector3(-1.85, 1.65, 0), "LeftInteriorWall");
    box(0.13, 2.68, 2.65, materials.interior, new THREE.Vector3(1.85, 1.65, 0), "RightInteriorWall");

    // Interior back wall.
    box(3.78, 2.68, 0.13, materials.interior, new THREE.Vector3(0, 1.65, -1.3), "RearInteriorWall");

    // Dark floor insert.
    box(3.78, 0.10, 2.62, materials.interior, new THREE.Vector3(0, 0.34, 0), "InteriorFloor");

    // Interior dividers and upper front rail.
    [-1.55, -0.8, 0, 0.8, 1.55].forEach((x, index) => {
      box(
        0.10,
        2.62,
        0.10,
        materials.woodDark,
        new THREE.Vector3(x, 1.68, 1.3),
        `FrontDivider_${index + 1}`
      );
    });

    box(3.9, 0.10, 0.10, materials.woodDark, new THREE.Vector3(0, 2.72, 1.3), "FrontUpperRail");
    box(3.9, 0.10, 0.10, materials.woodDark, new THREE.Vector3(0, 0.72, 1.3), "FrontLowerRail");
    box(3.9, 0.10, 0.10, materials.woodDark, new THREE.Vector3(0, 1.72, 1.3), "FrontMiddleRail");

    // Side upper rails.
    box(0.10, 0.10, 2.58, materials.woodDark, new THREE.Vector3(-1.85, 2.72, 0), "LeftUpperRail");
    box(0.10, 0.10, 2.58, materials.woodDark, new THREE.Vector3(1.85, 2.72, 0), "RightUpperRail");

    // Triangular gable ends.
    function createGable(x, sideName) {
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
          [
            x, 3.25, -1.3,
            x, 3.25, 1.3,
            x, 4.02, 0,
          ],
          3
        )
      );
      geometry.setIndex([0, 1, 2]);
      geometry.computeVertexNormals();

      const material = materials.wood.clone();
      material.side = THREE.DoubleSide;

      return mesh(geometry, material, `${sideName}Gable`);
    }

    createGable(-2.1, "Left");
    createGable(2.1, "Right");

    // Red gable roof panels.
    const roofAngle = Math.atan2(0.77, 2.65);
    const roofLength = Math.hypot(2.65, 0.77) * 1.01;

    const roofFront = box(
      4.35,
      0.13,
      roofLength,
      materials.red,
      new THREE.Vector3(0, 3.635, 0),
      "RedRoofFront"
    );
    roofFront.rotation.x = roofAngle;

    const roofRear = box(
      4.35,
      0.13,
      roofLength,
      materials.red,
      new THREE.Vector3(0, 3.635, 0),
      "RedRoofRear"
    );
    roofRear.rotation.x = -roofAngle;

    // Individual roof boards for a readable low-poly detail.
    for (let i = 0; i < 7; i++) {
      const x = -1.8 + i * 0.6;

      const frontBoard = box(
        0.55,
        0.145,
        roofLength,
        i % 2 === 0 ? materials.redLight : materials.red,
        new THREE.Vector3(x, 3.705, 0),
        `RoofFrontBoard_${i + 1}`
      );
      frontBoard.rotation.x = roofAngle;

      const rearBoard = box(
        0.55,
        0.145,
        roofLength,
        i % 2 === 0 ? materials.redLight : materials.red,
        new THREE.Vector3(x, 3.705, 0),
        `RoofRearBoard_${i + 1}`
      );
      rearBoard.rotation.x = -roofAngle;
    }

    // Dark red roof edge trim.
    box(4.45, 0.18, 0.14, materials.redDark, new THREE.Vector3(0, 3.27, 2.7), "FrontRoofFascia");
    box(4.45, 0.18, 0.14, materials.redDark, new THREE.Vector3(0, 3.27, -2.7), "RearRoofFascia");

    // Ridge cap.
    box(4.45, 0.18, 0.18, materials.redDark, new THREE.Vector3(0, 4.08, 0), "RoofRidgeCap");

    // Small roof support rafters.
    [-1.35, -0.45, 0.45, 1.35].forEach((x, index) => {
      const rafter = box(
        0.12,
        0.12,
        2.75,
        materials.woodDark,
        new THREE.Vector3(x, 3.45, 0),
        `RoofRafter_${index + 1}`
      );
      rafter.rotation.x = roofAngle;
      rafter.scale.z = 1.04;
    });

    // Low-poly chicken.
    const chicken = new THREE.Group();
    chicken.name = "Chicken";
    chicken.position.set(0.22, 0, -0.18);
    chicken.rotation.y = -0.08;
    asset.add(chicken);

    // Body.
    const body = mesh(
      new THREE.IcosahedronGeometry(0.48, 1),
      materials.chickenWhite,
      "ChickenBody",
      chicken
    );
    body.scale.set(0.95, 0.78, 1.08);
    body.position.set(0, 1.13, 0);

    // Breast.
    const breast = mesh(
      new THREE.IcosahedronGeometry(0.30, 1),
      materials.chickenCream,
      "ChickenBreast",
      chicken
    );
    breast.position.set(0, 1.15, 0.28);
    breast.scale.set(0.75, 0.95, 0.65);

    // Neck and head.
    const neck = mesh(
      new THREE.CylinderGeometry(0.18, 0.25, 0.38, 7),
      materials.chickenWhite,
      "ChickenNeck",
      chicken
    );
    neck.position.set(0, 1.56, 0.04);
    neck.rotation.z = -0.18;

    const head = mesh(
      new THREE.IcosahedronGeometry(0.29, 1),
      materials.chickenWhite,
      "ChickenHead",
      chicken
    );
    head.position.set(0, 1.83, 0.02);
    head.scale.set(1, 0.93, 0.92);

    // Red comb.
    const comb = new THREE.Group();
    comb.name = "ChickenComb";
    chicken.add(comb);

    [
      [-0.16, 2.04, -0.01, 0.13],
      [0, 2.10, -0.02, 0.15],
      [0.16, 2.04, -0.01, 0.13],
    ].forEach(([x, y, z, width], index) => {
      const w = mesh(
        new THREE.CylinderGeometry(width * 0.55, width, 0.13, 6),
        materials.chickenRed,
        `CombPart_${index + 1}`,
        comb
      );
      w.position.set(x, y, z);
      w.rotation.z = 0.16 * (index - 1);
    });

    // Beak.
    const beak = mesh(
      new THREE.ConeGeometry(0.115, 0.34, 5),
      materials.beak,
      "ChickenBeak",
      chicken
    );
    beak.position.set(0, 1.81, 0.34);
    beak.rotation.x = Math.PI / 2;

    // Eyes.
    [-0.22, 0.22].forEach((x, index) => {
      const eye = mesh(
        new THREE.SphereGeometry(0.043, 8, 6),
        materials.eye,
        `ChickenEye_${index + 1}`,
        chicken
      );
      eye.position.set(x, 1.90, 0.235);
    });

    // Legs.
    [-0.16, 0.16].forEach((x, index) => {
      const leg = mesh(
        new THREE.CylinderGeometry(0.035, 0.05, 0.40, 6),
        materials.beak,
        `ChickenLeg_${index + 1}`,
        chicken
      );
      leg.position.set(x, 0.63, 0);

      const foot = mesh(
        new THREE.BoxGeometry(0.16, 0.055, 0.19),
        materials.beak,
        `ChickenFoot_${index + 1}`,
        chicken
      );
      foot.position.set(x, 0.43, 0.12);
    });

    // Tail feathers.
    const tail = mesh(
      new THREE.ConeGeometry(0.18, 0.62, 5),
      materials.chickenWhite,
      "ChickenTail",
      chicken
    );
    tail.position.set(0, 1.18, -0.55);
    tail.rotation.x = Math.PI / 2;
    tail.rotation.z = Math.PI;
    tail.scale.set(1.2, 1, 0.7);

    // A small chicken shadow catcher beneath the model.
    const chickenShadow = new THREE.Mesh(
      new THREE.CircleGeometry(0.7, 32),
      new THREE.MeshBasicMaterial({
        color: 0x0b1016,
        transparent: true,
        opacity: 0.2,
        depthWrite: false,
      })
    );
    chickenShadow.name = "ChickenShadow";
    chickenShadow.rotation.x = -Math.PI / 2;
    chickenShadow.position.set(0.22, 0.34, -0.18);
    asset.add(chickenShadow);

    // Lighting and contact shadow.
    const contactShadow = new THREE.Mesh(
      new THREE.CircleGeometry(2.25, 48),
      new THREE.MeshBasicMaterial({
        color: 0x000000,
        transparent: true,
        opacity: 0.14,
        depthWrite: false,
      })
    );
    contactShadow.name = "ContactShadow";
    contactShadow.rotation.x = -Math.PI / 2;
    contactShadow.position.set(0, 0.002, 0);
    contactShadow.scale.set(1, 0.72, 1);
    scene.add(contactShadow);

    asset.traverse((object) => {
      if (object.isMesh) {
        object.castShadow = true;
        object.receiveShadow = true;
      }
    });

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    }

    window.addEventListener("resize", resize);

    resetButton.addEventListener("click", () => {
      camera.position.copy(defaultCameraPosition);
      controls.target.copy(defaultTarget);
      controls.update();
    });

    exportButton.addEventListener("click", () => {
      exportButton.disabled = true;
      status.textContent = "Preparing GLB…";

      asset.updateMatrixWorld(true);

      const exporter = new GLTFExporter();
      exporter.parse(
        asset,
        (result) => {
          const blob = new Blob([result], {
            type: "model/gltf-binary",
          });

          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "wooden_chicken_coop.glb";
          document.body.appendChild(link);
          link.click();
          link.remove();

          setTimeout(() => URL.revokeObjectURL(url), 1000);

          exportButton.disabled = false;
          status.textContent = "Exported wooden_chicken_coop.glb";
        },
        (error) => {
          console.error(error);
          exportButton.disabled = false;
          status.textContent = "Export failed. See the browser console.";
        },
        {
          binary: true,
          onlyVisible: true,
          truncateDrawRange: true,
        }
      );
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
