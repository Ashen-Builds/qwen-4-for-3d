<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Corroded Water Pressure Gate</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #071014;
      color: #d9f0ee;
    }

    #viewport {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
    }

    #hud {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 10;
      max-width: min(390px, calc(100vw - 36px));
      padding: 16px 18px;
      border: 1px solid rgba(135, 207, 202, 0.22);
      border-radius: 14px;
      background: rgba(6, 17, 20, 0.78);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(14px);
      pointer-events: none;
    }

    #hud h1 {
      margin: 0 0 5px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #a9e7df;
    }

    #hud p {
      margin: 0 0 13px;
      color: #94b8b2;
      font-size: 12px;
      line-height: 1.45;
    }

    #exportButton {
      pointer-events: auto;
      border: 0;
      border-radius: 9px;
      padding: 11px 16px;
      background: linear-gradient(135deg, #318f8b, #19696c);
      color: #ecfeee;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease;
    }

    #exportButton:hover {
      filter: brightness(1.13);
      transform: translateY(-1px);
    }

    #exportButton:active {
      transform: translateY(0);
    }

    #exportButton:disabled {
      cursor: wait;
      filter: grayscale(0.5);
      transform: none;
    }

    #status {
      margin-top: 10px;
      color: #83a9a3;
      font-size: 11px;
    }

    @media (max-width: 600px) {
      #hud {
        top: 10px;
        left: 10px;
        right: 10px;
        max-width: none;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div id="viewport"></div>

  <div id="hud">
    <h1>Corroded Water Pressure Gate</h1>
    <p>
      Low-poly industrial pressure gate with reinforced frame, locking wheel,
      reservoir, valves, gauge, algae growth, and surface-rust metal.
    </p>
    <button id="exportButton">Export GLB</button>
    <div id="status">Drag to orbit · Scroll to zoom</div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

    // -------------------------------------------------------------------------
    // Renderer, camera, and lighting
    // -------------------------------------------------------------------------

    const viewport = document.getElementById("viewport");
    const status = document.getElementById("status");
    const exportButton = document.getElementById("exportButton");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x071014);
    scene.fog = new THREE.Fog(0x071014, 17, 36);

    const camera = new THREE.PerspectiveCamera(
      42,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(7.6, 5.7, 9.2);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      powerPreference: "high-performance"
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    viewport.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.25, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.minDistance = 5;
    controls.maxDistance = 22;
    controls.maxPolarAngle = Math.PI * 0.49;

    scene.add(new THREE.HemisphereLight(0x8bb9bd, 0x25201a, 1.8));

    const keyLight = new THREE.DirectionalLight(0xffe1b0, 3.1);
    keyLight.position.set(6, 9, 8);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -8;
    keyLight.shadow.camera.right = 8;
    keyLight.shadow.camera.top = 9;
    keyLight.shadow.camera.bottom = -3;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 30;
    keyLight.shadow.bias = -0.0004;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x3fc7d0, 2.1);
    rimLight.position.set(-7, 5, -5);
    scene.add(rimLight);

    const cyanLight = new THREE.PointLight(0x2e9da2, 11, 11, 2);
    cyanLight.position.set(3.3, 2.2, 1.8);
    scene.add(cyanLight);

    // -------------------------------------------------------------------------
    // Exportable asset root. The floor is kept outside the exported group.
    // -------------------------------------------------------------------------

    const asset = new THREE.Group();
    asset.name = "CorrodedWaterPressureGate";
    asset.userData = {
      assetType: "Static low-poly water pressure gate",
      features: [
        "reinforced circular pressure door",
        "locking wheel",
        "hinged frame",
        "reservoir",
        "pressure pipes and valves",
        "gauges",
        "algae and surface corrosion"
      ]
    };
    scene.add(asset);

    // -------------------------------------------------------------------------
    // Materials
    // -------------------------------------------------------------------------

    const materials = {
      stone: new THREE.MeshStandardMaterial({
        color: 0x465052,
        roughness: 1,
        metalness: 0,
        flatShading: true
      }),
      stoneDark: new THREE.MeshStandardMaterial({
        color: 0x303a3c,
        roughness: 1,
        metalness: 0,
        flatShading: true
      }),
      frame: new THREE.MeshStandardMaterial({
        color: 0x354042,
        roughness: 0.84,
        metalness: 0.58,
        flatShading: true
      }),
      frameDark: new THREE.MeshStandardMaterial({
        color: 0x20282a,
        roughness: 0.92,
        metalness: 0.45,
        flatShading: true
      }),
      pipe: new THREE.MeshStandardMaterial({
        color: 0x4d5958,
        roughness: 0.76,
        metalness: 0.62,
        flatShading: true
      }),
      brass: new THREE.MeshStandardMaterial({
        color: 0x9b753b,
        roughness: 0.68,
        metalness: 0.68,
        flatShading: true
      }),
      rust: new THREE.MeshStandardMaterial({
        color: 0x863f21,
        roughness: 1,
        metalness: 0.08,
        flatShading: true
      }),
      rustLight: new THREE.MeshStandardMaterial({
        color: 0xb15c2a,
        roughness: 0.95,
        metalness: 0.05,
        flatShading: true
      }),
      algae: new THREE.MeshStandardMaterial({
        color: 0x355d39,
        roughness: 1,
        metalness: 0,
        flatShading: true
      }),
      algaeLight: new THREE.MeshStandardMaterial({
        color: 0x58783d,
        roughness: 1,
        metalness: 0,
        flatShading: true
      }),
      water: new THREE.MeshStandardMaterial({
        color: 0x267b83,
        roughness: 0.16,
        metalness: 0.04,
        transparent: true,
        opacity: 0.43,
        depthWrite: false,
        side: THREE.DoubleSide
      }),
      waterBright: new THREE.MeshStandardMaterial({
        color: 0x62b9b2,
        roughness: 0.12,
        metalness: 0,
        transparent: true,
        opacity: 0.72,
        depthWrite: false
      }),
      warning: new THREE.MeshStandardMaterial({
        color: 0xd1a12c,
        roughness: 0.9,
        metalness: 0.1,
        flatShading: true
      }),
      gaugeFace: new THREE.MeshStandardMaterial({
        color: 0xd7d1b5,
        roughness: 0.78,
        metalness: 0,
        side: THREE.DoubleSide
      }),
      black: new THREE.MeshStandardMaterial({
        color: 0x101718,
        roughness: 0.9,
        metalness: 0.2,
        flatShading: true
      })
    };

    // -------------------------------------------------------------------------
    // Geometry helpers
    // -------------------------------------------------------------------------

    let randomSeed = 41873;

    function random() {
      randomSeed = (randomSeed * 1664525 + 1013904223) >>> 0;
      return randomSeed / 4294967296;
    }

    function addMesh(
      geometry,
      material,
      position = [0, 0, 0],
      rotation = [0, 0, 0],
      scale = [1, 1, 1],
      parent = asset
    ) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(...position);
      mesh.rotation.set(...rotation);
      mesh.scale.set(...scale);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addCylinder(
      radius,
      height,
      material,
      position,
      rotation = [0, 0, 0],
      segments = 12,
      parent = asset
    ) {
      return addMesh(
        new THREE.CylinderGeometry(radius, radius, height, segments),
        material,
        position,
        rotation,
        [1, 1, 1],
        parent
      );
    }

    function addBox(
      width,
      height,
      depth,
      material,
      position,
      rotation = [0, 0, 0],
      parent = asset
    ) {
      return addMesh(
        new THREE.BoxGeometry(width, height, depth),
        material,
        position,
        rotation,
        [1, 1, 1],
        parent
      );
    }

    function addTorus(
      radius,
      tube,
      material,
      position,
      rotation = [0, 0, 0],
      parent = asset
    ) {
      return addMesh(
        new THREE.TorusGeometry(radius, tube, 6, 28),
        material,
        position,
        rotation,
        [1, 1, 1],
        parent
      );
    }

    function addCylinderBetween(start, end, radius, material, segments = 10) {
      const a = new THREE.Vector3(...start);
      const b = new THREE.Vector3(...end);
      const direction = b.clone().sub(a);
      const midpoint = a.clone().add(b).multiplyScalar(0.5);

      const mesh = addCylinder(
        radius,
        direction.length(),
        material,
        midpoint.toArray(),
        [0, 0, 0],
        segments
      );

      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );

      return mesh;
    }

    // -------------------------------------------------------------------------
    // Foundation and shallow water basin
    // -------------------------------------------------------------------------

    addCylinder(
      4.9,
      0.38,
      materials.stoneDark,
      [0, -0.19, 0],
      [0, 0, 0],
      10
    );

    addCylinder(
      4.72,
      0.12,
      materials.stone,
      [0, 0.035, 0],
      [0, 0, 0],
      10
    );

    // Irregular perimeter stones.
    for (let i = 0; i < 12; i++) {
      const angle = (i / 12) * Math.PI * 2;
      const radius = 4.28 + random() * 0.16;
      addBox(
        1.0 + random() * 0.45,
        0.16,
        0.68 + random() * 0.2,
        i % 3 === 0 ? materials.stoneDark : materials.stone,
        [
          Math.cos(angle) * radius,
          0.13,
          Math.sin(angle) * radius
        ],
        [0, -angle + random() * 0.12, 0]
      );
    }

    const pool = addMesh(
      new THREE.CircleGeometry(3.3, 32),
      materials.water,
      [0, 0.105, 0],
      [-Math.PI / 2, 0, 0]
    );
    pool.castShadow = false;

    for (const radius of [1.25, 1.8, 2.45, 2.95]) {
      const ripple = addTorus(
        radius,
        0.012,
        materials.waterBright,
        [0, 0.112, 0],
        [Math.PI / 2, 0, 0]
      );
      ripple.castShadow = false;
    }

    // -------------------------------------------------------------------------
    // Pressure gate: circular body, structural ring, spokes, wheel, and hardware
    // -------------------------------------------------------------------------

    const gateY = 2.65;

    // Heavy circular housing.
    addCylinder(
      1.78,
      0.38,
      materials.frameDark,
      [0, gateY, 0],
      [Math.PI / 2, 0, 0],
      24
    );

    // Main outer frame.
    addTorus(
      1.82,
      0.16,
      materials.frame,
      [0, gateY, 0],
      [0, 0, 0]
    );

    // Reinforced inner gasket.
    addTorus(
      1.56,
      0.055,
      materials.rubber || materials.black,
      [0, gateY, 0.235]
    );

    // Four main radial braces.
    for (let i = 0; i < 4; i++) {
      const angle = i * Math.PI * 0.5;
      addBox(
        1.48,
        0.17,
        0.14,
        materials.frame,
        [
          Math.cos(angle) * 0.78,
          gateY + Math.sin(angle) * 0.78,
          0.255
        ],
        [0, 0, angle]
      );

      // Secondary diagonal brace.
      addBox(
        0.8,
        0.11,
        0.09,
        materials.frameDark,
        [
          Math.cos(angle + Math.PI * 0.25) * 0.77,
          gateY + Math.sin(angle + Math.PI * 0.25) * 0.77,
          0.275
        ],
        [0, 0, angle + Math.PI * 0.25]
      );
    }

    // Outer locking lugs.
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      const radius = 1.83;

      addBox(
        0.26,
        0.12,
        0.12,
        i % 2 === 0 ? materials.rust : materials.frameDark,
        [
          Math.cos(angle) * radius,
          gateY + Math.sin(angle) * radius,
          0.225
        ],
        [0, 0, angle]
      );

      addCylinder(
        0.075,
        0.085,
        materials.brass,
        [
          Math.cos(angle) * radius,
          gateY + Math.sin(angle) * radius,
          0.285
        ],
        [Math.PI / 2, 0, 0],
        8
      );
    }

    // Hinges on the left and right sides.
    for (const side of [-1, 1]) {
      addCylinder(
        0.16,
        0.46,
        materials.frameDark,
        [side * 1.83, gateY, -0.02],
        [0, 0, 0],
        10
      );

      addBox(
        0.34,
        0.48,
        0.12,
        materials.frame,
        [side * 1.72, gateY, 0.18]
      );

      addBox(
        0.12,
        0.48,
        0.06,
        materials.rustLight,
        [side * 1.59, gateY, 0.275]
      );

      addCylinder(
        0.085,
        0.49,
        materials.brass,
        [side * 1.59, gateY, 0.31],
        [Math.PI / 2, 0, 0],
        8
      );
    }

    // Center hub and locking wheel.
    addCylinder(
      0.31,
      0.22,
      materials.frameDark,
      [0, gateY, 0.3],
      [Math.PI / 2, 0, 0],
      16
    );

    addTorus(
      0.43,
      0.065,
      materials.rust,
      [0, gateY, 0.43]
    );

    for (let i = 0; i < 6; i++) {
      const angle = (i / 6) * Math.PI * 2;
      addBox(
        0.77,
        0.065,
        0.065,
        materials.rustLight,
        [
          Math.cos(angle) * 0.21,
          gateY + Math.sin(angle) * 0.21,
          0.43
        ],
        [0, 0, angle]
      );
    }

    addCylinder(
      0.13,
      0.11,
      materials.brass,
      [0, gateY, 0.49],
      [Math.PI / 2, 0, 0],
      10
    );

    addCylinder(
      0.075,
      0.12,
      materials.rustLight,
      [0, gateY, 0.56],
      [Math.PI / 2, 0, 0],
      8
    );

    // Hinges on the rear rim.
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2 + Math.PI / 8;
      addTorus(
        1.84,
        0.045,
        i % 2 === 0 ? materials.brass : materials.rust,
        [
          Math.cos(angle) * 1.84,
          gateY + Math.sin(angle) * 1.84,
          -0.12
        ],
        [0, 0, 0]
      );
    }

    // -------------------------------------------------------------------------
    // Sign
    // -------------------------------------------------------------------------

    addBox(
      1.65,
      0.48,
      0.14,
      materials.frameDark,
      [0, 4.93, -0.04]
    );

    function makeSignTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 128;

      const context = canvas.getContext("2d");

      context.fillStyle = "#172124";
      context.fillRect(0, 0, canvas.width, canvas.height);

      context.strokeStyle = "#c29b3e";
      context.lineWidth = 9;
      context.strokeRect(7, 7, canvas.width - 14, canvas.height - 14);

      context.fillStyle = "#e3dfb9";
      context.textAlign = "center";
      context.textBaseline = "middle";
      context.font = "bold 44px sans-serif";
      context.fillText("PRESSURE GATE", 256, 48);

      context.fillStyle = "#a9c4bd";
      context.font = "bold 22px sans-serif";
      context.fillText("MAX  100 kPa   •   RATING 420 kPa", 256, 88);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    const signMaterial = new THREE.MeshBasicMaterial({
      map: makeSignTexture(),
      toneMapped: false
    });

    addMesh(
      new THREE.PlaneGeometry(1.48, 0.35),
      signMaterial,
      [0, 4.93, 0.035]
    );

    // -------------------------------------------------------------------------
    // Pipe system
    // -------------------------------------------------------------------------

    for (const side of [-1, 1]) {
      const x = side * 2.65;

      addCylinder(
        0.13,
        4.25,
        materials.pipe,
        [x, 2.55, -0.3],
        [0, 0, 0],
        10
      );

      // Flanges.
      for (const y of [0.72, 2.08, 4.38]) {
        addTorus(
          0.17,
          0.035,
          materials.rust,
          [x, y, -0.3],
          [Math.PI / 2, 0, 0]
        );
      }

      // Pipe collars.
      for (const y of [1.45, 3.55]) {
        addCylinder(
          0.165,
          0.09,
          materials.rustLight,
          [x, y, -0.3],
          [0, 0, 0],
          10
        );
      }

      // Bracket boxes.
      for (const y of [1.1, 3.9]) {
        addBox(
          0.34,
          0.11,
          0.42,
          materials.frameDark,
          [side * 2.46, y, -0.18]
        );
      }
    }

    addCylinderBetween(
      [-2.65, 4.65, -0.3],
      [2.65, 4.65, -0.3],
      0.13,
      materials.pipe,
      10
    );

    // Top pipe flanges.
    for (const x of [-2.65, 2.65]) {
      addTorus(
        0.17,
        0.035,
        materials.rust,
        [x, 4.65, -0.3],
        [0, Math.PI / 2, 0]
      );
    }

    // Rounded pipe joints.
    for (const side of [-1, 1]) {
      addMesh(
        new THREE.IcosahedronGeometry(0.145, 1),
        materials.pipe,
        [side * 2.65, 4.65, -0.3]
      );
    }

    // Reservoir-to-top pipe.
    addCylinderBetween(
      [2.65, 4.65, -0.3],
      [3.35, 4.65, -0.3],
      0.11,
      materials.pipe,
      10
    );

    // -------------------------------------------------------------------------
    // Reservoir
    // -------------------------------------------------------------------------

    addCylinder(
      0.55,
      3.35,
      materials.water,
      [3.35, 2.15, -0.72],
      [0, 0, 0],
      16
    );

    addCylinder(
      0.59,
      0.18,
      materials.frameDark,
      [3.35, 0.46, -0.72],
      [0, 0, 0],
      16
    );

    addCylinder(
      0.59,
      0.18,
      materials.frameDark,
      [3.35, 3.94, -0.72],
      [0, 0, 0],
      16
    );

    // Reservoir support cradles.
    for (const y of [0.8, 3.5]) {
      addBox(
        1.32,
        0.13,
        0.35,
        materials.stoneDark,
        [3.35, y, -0.9]
      );

      addBox(
        0.38,
        0.42,
        0.42,
        materials.frameDark,
        [2.68, y, -0.9]
      );

      addBox(
        0.38,
        0.42,
        0.42,
        materials.frameDark,
        [4.02, y, -0.9]
      );
    }

    // Reservoir bands.
    for (const y of [0.85, 1.75, 2.75, 3.65]) {
      addTorus(
        0.565,
        0.035,
        materials.rust,
        [3.35, y, -0.72],
        [Math.PI / 2, 0, 0]
      );
    }

    // Upper tank cap and outlet.
    addCylinder(
      0.31,
      0.22,
      materials.brass,
      [3.35, 4.13, -0.72],
      [0, 0, 0],
      10
    );

    addCylinder(
      0.12,
      0.35,
      materials.brass,
      [3.35, 4.37, -0.72],
      [0, 0, 0],
      10
    );

    // -------------------------------------------------------------------------
    // Valve wheel and pressure gauge
    // -------------------------------------------------------------------------

    const valveX = 2.65;
    const valveY = 3.5;

    addCylinder(
      0.08,
      0.42,
      materials.brass,
      [valveX, valveY, 0.04],
      [Math.PI / 2, 0, 0],
      10
    );

    addTorus(
      0.28,
      0.055,
      materials.rust,
      [valveX, valveY, 0.31]
    );

    for (let i = 0; i < 6; i++) {
      const angle = (i / 6) * Math.PI * 2;
      addBox(
        0.5,
        0.055,
        0.055,
        materials.rustLight,
        [
          valveX + Math.cos(angle) * 0.14,
          valveY + Math.sin(angle) * 0.14,
          0.31
        ],
        [0, 0, angle]
      );
    }

    addMesh(
      new THREE.IcosahedronGeometry(0.09, 1),
      materials.rust,
      [valveX, valveY, 0.38]
    );

    // Pressure gauge on the left pipe.
    addCylinder(
      0.23,
      0.09,
      materials.brass,
      [-2.65, 3.45, 0.18],
      [Math.PI / 2, 0, 0],
      16
    );

    addMesh(
      new THREE.CircleGeometry(0.19, 20),
      materials.gaugeFace,
      [-2.65, 3.45, 0.232]
    );

    for (let i = 0; i < 9; i++) {
      const angle = Math.PI * 0.78 + (i / 8) * Math.PI * 1.44;
      const tick = addBox(
        0.035,
        0.085,
        0.018,
        materials.black,
        [
          -2.65 + Math.cos(angle) * 0.15,
          3.45 + Math.sin(angle) * 0.15,
          0.245
        ]
      );
      tick.rotation.z = -angle;
    }

    const needle = addBox(
      0.035,
      0.12,
      0.02,
      materials.rust,
      [-2.65, 3.49, 0.255]
    );
    needle.rotation.z = -0.62;

    addCylinder(
      0.025,
      0.025,
      materials.black,
      [-2.65, 3.45, 0.265],
      [Math.PI / 2, 0, 0],
      8
    );

    // -------------------------------------------------------------------------
    // Static water jets
    // -------------------------------------------------------------------------

    const jetPositions = [
      [3.35, 3.7, -0.18],
      [3.35, 3.7, -0.08],
      [3.12, 3.58, -0.12]
    ];

    for (const source of jetPositions) {
      const end = [
        source[0] + (random() - 0.5) * 0.12,
        source[1] - 0.55,
        source[2] + 0.03
      ];

      const jet = addCylinderBetween(
        source,
        end,
        0.028,
        materials.waterBright,
        6
      );
      jet.castShadow = false;
      jet.receiveShadow = false;
    }

    // -------------------------------------------------------------------------
    // Corrosion, algae, and surface wear
    // -------------------------------------------------------------------------

    // Rust patches on the front outer frame.
    for (let i = 0; i < 24; i++) {
      const angle = random() * Math.PI * 2;
      const radius = 1.82 + (random() - 0.5) * 0.07;
      const width = 0.12 + random() * 0.26;
      const height = 0.035 + random() * 0.055;

      addBox(
        width,
        height,
        0.025,
        random() > 0.5 ? materials.rust : materials.rustLight,
        [
          Math.cos(angle) * radius,
          gateY + Math.sin(angle) * radius,
          0.175 + random() * 0.015
        ],
        [0, 0, angle]
      );
    }

    // Moss clumps on the lower frame.
    for (let i = 0; i < 18; i++) {
      const angle = Math.PI * 0.23 + random() * (Math.PI * 0.54);
      const radius = 1.68 + random() * 0.17;
      const size = 0.09 + random() * 0.16;

      addMesh(
        new THREE.DodecahedronGeometry(size, 0),
        random() > 0.5 ? materials.algae : materials.algaeLight,
        [
          Math.cos(angle) * radius,
          gateY + Math.sin(angle) * radius,
          0.19 + random() * 0.05
        ],
        [random() * Math.PI, random() * Math.PI, random() * Math.PI],
        [1.25, 0.65, 0.28]
      );
    }

    // Rust and algae on the reservoir.
    for (let i = 0; i < 15; i++) {
      const angle = random() * Math.PI * 2;
      const radius = 0.49 + random() * 0.035;
      const y = 0.75 + random() * 2.65;

      addMesh(
        new THREE.DodecahedronGeometry(0.09 + random() * 0.1, 0),
        random() > 0.5 ? materials.algae : materials.rustLight,
        [
          3.35 + Math.cos(angle) * radius,
          y,
          -0.72 + Math.sin(angle) * radius
        ],
        [random() * Math.PI, random() * Math.PI, random() * Math.PI],
        [1.2, 0.55, 0.3]
      );
    }

    // Moss around the foundation edge.
    for (let i = 0; i < 20; i++) {
      const angle = random() * Math.PI * 2;
      const radius = 4.05 + random() * 0.5;

      addMesh(
        new THREE.DodecahedronGeometry(0.13 + random() * 0.1, 0),
        random() > 0.5 ? materials.algae : materials.algaeLight,
        [
          Math.cos(angle) * radius,
          0.15,
          Math.sin(angle) * radius
        ],
        [random() * Math.PI, random() * Math.PI, random() * Math.PI],
        [1.5, 0.35, 0.9]
      );
    }

    // Small warning lights mounted above the sign.
    for (const x of [-0.52, 0.52]) {
      addCylinder(
        0.08,
        0.12,
        materials.frameDark,
        [x, 5.22, -0.02],
        [0, 0, 0],
        8
      );

      addCylinder(
        0.075,
        0.055,
        x < 0 ? materials.algaeLight : materials.rustLight,
        [x, 5.31, -0.02],
        [0, 0, 0],
        8
      );
    }

    // -------------------------------------------------------------------------
    // Additional structural details
    // -------------------------------------------------------------------------

    // Diagonal braces from the lower frame to the top pipe area.
    for (const side of [-1, 1]) {
      addBox(
        1.0,
        0.12,
        0.12,
        materials.frameDark,
        [side * 2.05, 4.05, -0.18],
        [0, 0, side * -0.72]
      );
    }

    // Foundation anchor plates.
    for (const side of [-1, 1]) {
      addBox(
        0.65,
        0.08,
        0.55,
        materials.frameDark,
        [side * 2.42, 0.14, -0.25]
      );

      for (const z of [-0.4, -0.1]) {
        addCylinder(
          0.065,
          0.12,
          materials.brass,
          [side * 2.42, 0.21, z],
          [0, 0, 0],
          6
        );
      }
    }

    // -------------------------------------------------------------------------
    // Environment-only ground; excluded from GLB export
    // -------------------------------------------------------------------------

    const environmentFloor = new THREE.Mesh(
      new THREE.CircleGeometry(18, 48),
      new THREE.MeshStandardMaterial({
        color: 0x111a1b,
        roughness: 0.95,
        metalness: 0
      })
    );
    environmentFloor.rotation.x = -Math.PI / 2;
    environmentFloor.position.y = -0.39;
    environmentFloor.receiveShadow = true;
    scene.add(environmentFloor);

    // -------------------------------------------------------------------------
    // Export GLB
    // -------------------------------------------------------------------------

    exportButton.addEventListener("click", () => {
      exportButton.disabled = true;
      status.textContent = "Preparing GLB…";

      asset.updateMatrixWorld(true);

      const exporter = new GLTFExporter();

      exporter.parse(
        asset,
        (result) => {
          let blob;

          if (result instanceof ArrayBuffer) {
            blob = new Blob([result], {
              type: "model/gltf-binary"
            });
          } else {
            blob = new Blob([result], {
              type: "model/gltf+json"
            });
          }

          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "corroded-water-pressure-gate.glb";
          document.body.appendChild(link);
          link.click();
          link.remove();

          setTimeout(() => URL.revokeObjectURL(url), 2000);

          status.textContent = "GLB exported successfully.";
          exportButton.disabled = false;
        },
        (error) => {
          console.error(error);
          status.textContent = "Export failed. See the browser console.";
          exportButton.disabled = false;
        },
        {
          binary: true,
          onlyVisible: true,
          truncateDrawRange: true,
          maxTextureSize: 2048
        }
      );
    });

    // -------------------------------------------------------------------------
    // Render loop
    // -------------------------------------------------------------------------

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
