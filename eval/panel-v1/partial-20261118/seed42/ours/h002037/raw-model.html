<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Low-Poly Bus Shelter</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #dce5e3;
    }

    #viewport {
      position: fixed;
      inset: 0;
    }

    #viewport canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .panel {
      position: fixed;
      top: 20px;
      left: 20px;
      width: min(360px, calc(100vw - 40px));
      padding: 18px;
      color: #eef7f4;
      background: rgba(18, 48, 44, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(20, 40, 35, 0.22);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .subtitle {
      margin: 0 0 16px;
      color: #b9cdca;
      font-size: 13px;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    button {
      min-height: 40px;
      padding: 0 15px;
      border: 0;
      border-radius: 10px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease, background 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    button:active {
      transform: translateY(0);
    }

    #export {
      color: #143f38;
      background: #e6bd65;
    }

    #reset {
      color: #edf8f5;
      background: rgba(255, 255, 255, 0.1);
    }

    #status {
      min-height: 17px;
      margin-top: 12px;
      color: #b9cdca;
      font-size: 12px;
    }

    .hint {
      position: fixed;
      right: 18px;
      bottom: 16px;
      padding: 8px 11px;
      color: #46605a;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 8px;
      font-size: 12px;
      pointer-events: none;
    }

    @media (max-width: 560px) {
      .panel {
        top: 12px;
        left: 12px;
        width: calc(100vw - 24px);
        padding: 14px;
      }

      .hint {
        display: none;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div id="viewport"></div>

  <section class="panel">
    <h1>Low-Poly Bus Shelter</h1>
    <p class="subtitle">
      A portable-style shelter with a bench, glass panels, solar roof,
      accessible seating, and stop signs.
    </p>

    <div class="actions">
      <button id="export" type="button">Export GLB</button>
      <button id="reset" type="button">Reset View</button>
    </div>

    <div id="status" aria-live="polite"></div>
  </section>

  <div class="hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

    const viewport = document.getElementById("viewport");
    const exportButton = document.getElementById("export");
    const resetButton = document.getElementById("reset");
    const status = document.getElementById("status");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdce5e3);
    scene.fog = new THREE.Fog(0xdce5e3, 12, 26);

    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    const initialCameraPosition = new THREE.Vector3(7.4, 5.2, 8.2);
    const initialTarget = new THREE.Vector3(0, 1.65, 0.15);

    camera.position.copy(initialCameraPosition);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      preserveDrawingBuffer: true
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    viewport.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(initialTarget);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.minDistance = 5;
    controls.maxDistance = 15;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.update();

    const hemisphere = new THREE.HemisphereLight(0xeaf8ff, 0x8b755d, 2.25);
    scene.add(hemisphere);

    const sun = new THREE.DirectionalLight(0xfff2d6, 3.4);
    sun.position.set(5.5, 9, 6.5);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -8;
    sun.shadow.camera.right = 8;
    sun.shadow.camera.top = 8;
    sun.shadow.camera.bottom = -8;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 24;
    sun.shadow.bias = -0.0005;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0xa8d8e4, 1.1);
    fill.position.set(-5, 4, -4);
    scene.add(fill);

    // Only this group is exported.
    const asset = new THREE.Group();
    asset.name = "LowPolyBusShelter";
    scene.add(asset);

    const environment = new THREE.Group();
    environment.name = "Presentation";
    scene.add(environment);

    const materials = {
      concrete: new THREE.MeshStandardMaterial({
        color: 0xc8c5ba,
        roughness: 0.92
      }),
      floor: new THREE.MeshStandardMaterial({
        color: 0x98aaa4,
        roughness: 0.88
      }),
      teal: new THREE.MeshStandardMaterial({
        color: 0x177b72,
        roughness: 0.58,
        metalness: 0.08
      }),
      tealDark: new THREE.MeshStandardMaterial({
        color: 0x115c57,
        roughness: 0.66
      }),
      cream: new THREE.MeshStandardMaterial({
        color: 0xf2e8cf,
        roughness: 0.82
      }),
      dark: new THREE.MeshStandardMaterial({
        color: 0x263837,
        roughness: 0.52,
        metalness: 0.28
      }),
      metal: new THREE.MeshStandardMaterial({
        color: 0xaeb9b5,
        roughness: 0.34,
        metalness: 0.72
      }),
      wood: new THREE.MeshStandardMaterial({
        color: 0xa66d3e,
        roughness: 0.8
      }),
      woodLight: new THREE.MeshStandardMaterial({
        color: 0xc78a50,
        roughness: 0.78
      }),
      glass: new THREE.MeshPhysicalMaterial({
        color: 0x9dcbd0,
        roughness: 0.08,
        metalness: 0,
        transparent: true,
        opacity: 0.3,
        depthWrite: false
      }),
      yellow: new THREE.MeshStandardMaterial({
        color: 0xe9bd55,
        roughness: 0.58
      }),
      blue: new THREE.MeshStandardMaterial({
        color: 0x24679b,
        roughness: 0.5
      }),
      solar: new THREE.MeshStandardMaterial({
        color: 0x183b59,
        roughness: 0.28,
        metalness: 0.42
      }),
      solarGrid: new THREE.MeshStandardMaterial({
        color: 0x4a7891,
        roughness: 0.3,
        metalness: 0.38
      }),
      vent: new THREE.MeshStandardMaterial({
        color: 0x485755,
        roughness: 0.68,
        metalness: 0.25
      }),
      lamp: new THREE.MeshStandardMaterial({
        color: 0xffd88a,
        emissive: 0xffad54,
        emissiveIntensity: 1.8,
        roughness: 0.3
      }),
      planter: new THREE.MeshStandardMaterial({
        color: 0x8b755d,
        roughness: 0.92
      }),
      soil: new THREE.MeshStandardMaterial({
        color: 0x49382d,
        roughness: 1
      }),
      leaf: new THREE.MeshStandardMaterial({
        color: 0x527a45,
        roughness: 0.92
      }),
      leafLight: new THREE.MeshStandardMaterial({
        color: 0x789454,
        roughness: 0.92
      })
    };

    function addBox(parent, name, size, position, material, rotation = null) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(size[0], size[1], size[2]),
        material
      );

      mesh.name = name;
      mesh.position.set(position[0], position[1], position[2]);

      if (rotation) {
        mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
      }

      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addCylinder(
      parent,
      name,
      radiusTop,
      radiusBottom,
      height,
      position,
      material,
      segments = 12
    ) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(
          radiusTop,
          radiusBottom,
          height,
          segments
        ),
        material
      );

      mesh.name = name;
      mesh.position.set(position[0], position[1], position[2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addIcosahedron(parent, name, radius, position, material, scale) {
      const mesh = new THREE.Mesh(
        new THREE.IcosahedronGeometry(radius, 0),
        material
      );

      mesh.name = name;
      mesh.position.set(position[0], position[1], position[2]);
      mesh.scale.copy(scale);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function makeCanvasTexture(width, height, draw) {
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;

      const context = canvas.getContext("2d");
      draw(context, width, height);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = Math.min(
        8,
        renderer.capabilities.getMaxAnisotropy()
      );
      texture.needsUpdate = true;
      return texture;
    }

    function makeLabelTexture({
      width = 1024,
      height = 512,
      bg = "#f4e8c9",
      fg = "#183f3a",
      title = "NEIGHBORHOOD SERVICES",
      subtitle = ""
    }) {
      return makeCanvasTexture(width, height, (ctx, w, h) => {
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = fg;
        ctx.font = "700 54px Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(title, w / 2, h * 0.43);

        if (subtitle) {
          ctx.font = "600 28px Arial, sans-serif";
          ctx.fillText(subtitle, w / 2, h * 0.76);
        }
      });
    }

    function makeNoticeTexture() {
      return makeCanvasTexture(768, 1024, (ctx, w, h) => {
        ctx.fillStyle = "#e9d6a6";
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = "#174b49";
        ctx.fillRect(0, 0, w, 112);

        ctx.fillStyle = "#f2e8c9";
        ctx.font = "700 42px Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("COMMUNITY", w / 2, 58);

        ctx.fillStyle = "#174b49";
        ctx.font = "700 33px Arial, sans-serif";
        ctx.fillText("LOCAL HELP", w / 2, 150);

        ctx.strokeStyle = "#b87542";
        ctx.lineWidth = 4;
        ctx.strokeRect(7, 17, w - 14, h - 34);

        const routeColors = ["#e7b74f", "#357aa8", "#6e8f50"];
        const routeXs = [120, 270, 420];

        routeXs.forEach((x, index) => {
          ctx.fillStyle = routeColors[index];
          ctx.beginPath();
          ctx.arc(x, 235, 42, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "#ffffff";
          ctx.font = "700 31px Arial, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(
            ["NORTH", "RIVERSIDE", "CENTRE"][index],
            x,
            305
          );
        });

        ctx.fillStyle = "#203a38";
        ctx.font = "700 36px Arial, sans-serif";
        ctx.fillText("MEETING", w / 2, 660);

        ctx.fillStyle = "#65746d";
        ctx.font = "600 26px Arial, sans-serif";
        ctx.fillText(
          "Tuesday evening, 7:30 PM",
          w / 2,
          700
        );

        ctx.fillStyle = "#e7b74f";
        ctx.font = "700 26px Arial, sans-serif";
        ctx.fillText("Bring spare gloves or supplies.", w / 2, 765);

        ctx.strokeStyle = "#8a6a42";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(70, 820);
        ctx.lineTo(w - 70, 820);
        ctx.stroke();
      });
    }

    function makeBusStopTexture() {
      return makeCanvasTexture(512, 512, (ctx, w, h) => {
        ctx.fillStyle = "#177b72";
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = "#f6df72";
        ctx.beginPath();
        ctx.arc(w / 2, h / 2, 65, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.font = "700 76px Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("BUS", w / 2, 210);

        ctx.fillStyle = "#e9f9f7";
        ctx.font = "700 65px Arial, sans-serif";
        ctx.fillText("STOP", w / 2, 370);

        ctx.fillStyle = "#203a38";
        ctx.font = "700 34px Arial, sans-serif";
        ctx.fillText("14", w / 2, 468);
      });
    }

    function makeFasciaTexture() {
      return makeCanvasTexture(1024, 192, (ctx, w, h) => {
        ctx.fillStyle = "#f4e8c9";
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = "#177b72";
        ctx.fillRect(0, 0, 38, h);

        ctx.fillStyle = "#ffffff";
        ctx.font = "700 55px Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("NEIGHBORHOOD", w / 2, 80);

        ctx.fillStyle = "#177b72";
        ctx.fillRect(w - 38, 0, 38, h);
      });
    }

    // Platform and accessibility step.
    addBox(
      asset,
      "Concrete platform",
      [5.75, 0.22, 4.25],
      [0, 0.11, 0],
      materials.concrete
    );

    addBox(
      asset,
      "Shelter floor",
      [5.46, 0.12, 4.0],
      [0, 0.26, 0],
      materials.floor
    );

    addBox(
      asset,
      "Front step",
      [4.55, 0.14, 1.0],
      [0, 0.07, 2.55],
      materials.concrete
    );

    // Main structural posts.
    const postPositions = [
      [-2.25, -1.15],
      [2.25, -1.15],
      [-2.25, 1.15],
      [2.25, 1.15]
    ];

    postPositions.forEach(([x, z], index) => {
      addBox(
        asset,
        `Support post ${index + 1}`,
        [0.17, 3.05, 0.17],
        [x, 1.84, z],
        materials.dark
      );

      addBox(
        asset,
        `Post cap ${index + 1}`,
        [0.25, 0.12, 0.25],
        [x, 3.40, z],
        materials.metal
      );
    });

    // Lower wall panels.
    addBox(
      asset,
      "Rear lower panel",
      [4.46, 1.22, 0.08],
      [0, 0.95, -1.15],
      materials.tealDark
    );

    addBox(
      asset,
      "Right lower panel",
      [0.08, 1.22, 2.05],
      [2.25, 0.95, 0],
      materials.tealDark
    );

    // Glass enclosure panels.
    const backGlass = addBox(
      asset,
      "Rear glass panel",
      [4.36, 2.48, 0.035],
      [0, 2.18, -1.13],
      materials.glass
    );
    backGlass.castShadow = false;

    const leftGlass = addBox(
      asset,
      "Left glass panel",
      [0.035, 2.48, 2.04],
      [-2.25, 2.18, -0.02],
      materials.glass
    );
    leftGlass.castShadow = false;

    const rightGlass = addBox(
      asset,
      "Right glass panel",
      [0.035, 2.48, 2.04],
      [2.25, 2.18, 0],
      materials.glass
    );
    rightGlass.castShadow = false;

    // Upper beams.
    addBox(
      asset,
      "Front top beam",
      [4.8, 0.16, 0.17],
      [0, 3.39, 1.15],
      materials.tealDark
    );

    addBox(
      asset,
      "Rear top beam",
      [4.8, 0.16, 0.17],
      [0, 3.39, -1.15],
      materials.tealDark
    );

    [-2.25, 2.25].forEach((x) => {
      addBox(
        asset,
        "Side top beam",
        [0.17, 0.16, 2.3],
        [x, 3.39, 0],
        materials.tealDark
      );
    });

    // Roof fascia and roof slab.
    addBox(
      asset,
      "Roof fascia",
      [5.75, 0.43, 0.18],
      [0, 3.40, 1.25],
      materials.teal
    );

    addBox(
      asset,
      "Roof slab",
      [5.95, 0.22, 4.25],
      [0, 3.65, 0],
      materials.cream
    );

    addBox(
      asset,
      "Roof top trim",
      [5.74, 0.055, 4.04],
      [0, 3.785, 0],
      materials.tealDark
    );

    // Fascia label.
    const fasciaTexture = makeFasciaTexture();
    const fascia = new THREE.Mesh(
      new THREE.PlaneGeometry(3.95, 0.37),
      new THREE.MeshStandardMaterial({
        map: fasciaTexture,
        roughness: 0.78
      })
    );

    fascia.name = "Roof service label";
    fascia.position.set(0.05, 3.41, 1.348);
    fascia.castShadow = false;
    asset.add(fascia);

    // Bench frame and wooden slats.
    const bench = new THREE.Group();
    bench.name = "Accessible bench";
    asset.add(bench);

    [-0.23, 1.83].forEach((x) => {
      addBox(
        bench,
        "Bench front leg",
        [0.12, 0.58, 0.12],
        [x, 0.61, 0.25],
        materials.metal
      );

      addBox(
        bench,
        "Bench back leg",
        [0.12, 0.95, 0.12],
        [x, 1.22, -0.30],
        materials.metal
      );

      addBox(
        bench,
        "Bench seat leg",
        [0.12, 0.66, 0.58],
        [x, 0.61, -0.06],
        materials.metal
      );
    });

    [
      [-0.22, 0.89, -0.19],
      [0.80, 0.89, -0.01],
      [1.82, 0.89, 0.17]
    ].forEach((position, index) => {
      addBox(
        bench,
        `Seat slat ${index + 1}`,
        [2.12, 0.12, 0.17],
        position,
        index === 1 ? materials.woodLight : materials.wood
      );
    });

    [
      [0.80, 1.12, -0.32],
      [0.80, 1.32, -0.32],
      [0.80, 1.52, -0.32]
    ].forEach((position, index) => {
      addBox(
        bench,
        `Backrest slat ${index + 1}`,
        [2.12, 0.16, 0.12],
        position,
        index === 1 ? materials.woodLight : materials.wood
      );
    });

    // Solar panel on the roof.
    addBox(
      asset,
      "Solar panel frame",
      [2.38, 0.065, 1.48],
      [1.12, 3.82, -0.30],
      materials.dark
    );

    addBox(
      asset,
      "Solar panel",
      [2.22, 0.035, 1.32],
      [1.12, 3.865, -0.30],
      materials.solar
    );

    for (let row = 0; row < 2; row++) {
      for (let column = 0; column < 4; column++) {
        addBox(
          asset,
          "Solar cell",
          [0.53, 0.012, 0.63],
          [0.14 + column * 0.58, 3.89, -0.64 + row * 0.32],
          materials.solarGrid
        );
      }
    }

    // Low-profile roof vent.
    addBox(
      asset,
      "Roof vent housing",
      [0.66, 0.18, 0.66],
      [1.78, 3.88, 0.67],
      materials.vent
    );

    addBox(
      asset,
      "Roof vent cap",
      [0.76, 0.055, 0.76],
      [1.78, 3.99, 0.67],
      materials.metal
    );

    // Under-canopy light.
    addBox(
      asset,
      "Canopy light housing",
      [1.08, 0.11, 0.27],
      [0.78, 3.37, 0.48],
      materials.dark
    );

    addBox(
      asset,
      "Canopy light lens",
      [0.92, 0.055, 0.19],
      [0.78, 3.305, 0.48],
      materials.lamp
    );

    // Notice board.
    const noticeGroup = new THREE.Group();
    noticeGroup.name = "Notice board";
    asset.add(noticeGroup);

    addBox(
      noticeGroup,
      "Notice board frame",
      [1.36, 1.78, 0.08],
      [1.42, 1.72, 1.34],
      materials.dark
    );

    addBox(
      noticeGroup,
      "Notice cork",
      [1.24, 1.66, 0.035],
      [1.42, 1.72, 1.395],
      new THREE.MeshStandardMaterial({
        color: 0xe6cf91,
        roughness: 0.94
      })
    );

    const noticeTexture = makeNoticeTexture();
    const notice = new THREE.Mesh(
      new THREE.PlaneGeometry(1.19, 1.59),
      new THREE.MeshStandardMaterial({
        map: noticeTexture,
        roughness: 0.9
      })
    );

    notice.name = "Notice board content";
    notice.position.set(1.42, 1.72, 1.416);
    notice.castShadow = false;
    noticeGroup.add(notice);

    // Bus stop sign.
    const stopGroup = new THREE.Group();
    stopGroup.name = "Bus stop sign";
    asset.add(stopGroup);

    addCylinder(
      stopGroup,
      "Bus stop sign pole",
      0.065,
      0.075,
      3.35,
      [-2.78, 1.98, 1.68],
      materials.metal,
      12
    );

    addCylinder(
      stopGroup,
      "Bus stop sign base",
      0.19,
      0.19,
      0.10,
      [-2.78, 0.38, 1.68],
      materials.dark,
      16
    );

    addBox(
      stopGroup,
      "Square stop sign frame",
      [0.90, 0.90, 0.08],
      [-2.78, 2.88, 1.68],
      materials.blue
    );

    const stopTexture = makeBusStopTexture();
    const stopSign = new THREE.Mesh(
      new THREE.PlaneGeometry(0.82, 0.82),
      new THREE.MeshStandardMaterial({
        map: stopTexture,
        roughness: 0.65
      })
    );

    stopSign.name = "Bus stop sign graphic";
    stopSign.position.set(-2.78, 2.88, 1.727);
    stopSign.castShadow = false;
    stopGroup.add(stopSign);

    // Round stop sign.
    const roundSign = new THREE.Mesh(
      new THREE.CylinderGeometry(0.31, 0.31, 0.08, 24),
      materials.blue
    );

    roundSign.name = "Round stop sign";
    roundSign.position.set(-2.78, 2.18, 2.10);
    roundSign.rotation.x = Math.PI / 2;
    roundSign.castShadow = true;
    stopGroup.add(roundSign);

    const stopIcon = new THREE.Mesh(
      new THREE.PlaneGeometry(0.38, 0.38),
      new THREE.MeshStandardMaterial({
        map: stopTexture,
        roughness: 0.6
      })
    );

    stopIcon.name = "Round stop sign graphic";
    stopIcon.position.set(-2.78, 2.18, 2.146);
    stopIcon.castShadow = false;
    stopGroup.add(stopIcon);

    // Small planter and low-poly shrub.
    addBox(
      asset,
      "Planter box",
      [0.56, 0.46, 0.56],
      [-2.48, 0.57, 0.66],
      materials.planter
    );

    addBox(
      asset,
      "Planter soil",
      [0.48, 0.035, 0.48],
      [-2.48, 0.815, 0.66],
      materials.soil
    );

    addIcosahedron(
      asset,
      "Shrub trunk",
      0.29,
      [-2.48, 1.08, 0.66],
      materials.wood,
      new THREE.Vector3(1.25, 1.55, 1.25)
    );

    addIcosahedron(
      asset,
      "Shrub left",
      0.38,
      [-2.73, 1.29, 0.64],
      materials.leaf,
      new THREE.Vector3(1, 1.05, 1)
    );

    addIcosahedron(
      asset,
      "Shrub right",
      0.34,
      [-2.23, 1.24, 0.66],
      materials.leafLight,
      new THREE.Vector3(1, 1.05, 1)
    );

    // Tactile paving at the shelter entrance.
    const tactileGroup = new THREE.Group();
    tactileGroup.name = "Tactile paving";
    asset.add(tactileGroup);

    for (let column = 0; column < 16; column++) {
      for (let row = 0; row < 4; row++) {
        addBox(
          tactileGroup,
          "Tactile paving tile",
          [0.235, 0.035, 0.235],
          [
            -1.95 + column * 0.27,
            0.335,
            1.55 + row * 0.27
          ],
          materials.yellow
        );
      }
    }

    // Small utility detail at the rear.
    addBox(
      asset,
      "Utility box",
      [0.76, 0.60, 0.36],
      [1.98, 0.68, -0.91],
      materials.metal
    );

    addBox(
      asset,
      "Utility box lid",
      [0.82, 0.07, 0.40],
      [1.98, 0.99, -0.91],
      materials.dark
    );

    environment = new THREE.Group();
    environment.name = "Presentation only";
    scene.add(environment);

    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0xd3dad7,
      roughness: 1
    });

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(9, 64),
      groundMaterial
    );

    ground.name = "Display ground";
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.015;
    ground.receiveShadow = true;
    environment.add(ground);

    const groundRing = new THREE.Mesh(
      new THREE.RingGeometry(4.5, 4.55, 96),
      new THREE.MeshBasicMaterial({
        color: 0xc5d2cfa,
        transparent: true,
        opacity: 0.55,
        side: THREE.DoubleSide
      })
    );

    groundRing.name = "Display ring";
    groundRing.rotation.x = -Math.PI / 2;
    groundRing.position.y = 0.002;
    environment.add(groundRing);

    // Export only the shelter group.
    exportButton.addEventListener("click", () => {
      exportButton.disabled = true;
      status.textContent = "Preparing GLB…";

      asset.updateMatrixWorld(true);

      const exporter = new GLTFExporter();

      exporter.parse(
        asset,
        (result) => {
          let blob;

          if (result instanceof ArrayBuffer) {
            blob = new Blob([result], {
              type: "model/gltf-binary"
            });
          } else {
            blob = new Blob([JSON.stringify(result, null, 2)], {
              type: "model/gltf+json"
            });
          }

          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");

          link.href = url;
          link.download = "low_poly_bus_shelter.glb";
          document.body.appendChild(link);
          link.click();
          link.remove();

          setTimeout(() => {
            URL.revokeObjectURL(url);
          }, 1000);

          exportButton.disabled = false;
          status.textContent = "GLB exported successfully.";
        },
        (error) => {
          console.error(error);
          exportButton.disabled = false;
          status.textContent = "Export failed. See the browser console.";
        },
        {
          binary: true,
          onlyVisible: true,
          trs: false
        }
      );
    });

    resetButton.addEventListener("click", () => {
      camera.position.copy(initialCameraPosition);
      controls.target.copy(initialTarget);
      controls.update();
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
