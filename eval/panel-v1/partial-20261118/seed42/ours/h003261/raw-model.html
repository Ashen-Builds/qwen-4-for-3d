<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Low-Poly Rowing Exercise Machine</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #e8edf1;
    }

    #viewport {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .panel {
      position: fixed;
      top: 22px;
      left: 22px;
      z-index: 10;
      width: min(330px, calc(100vw - 44px));
      padding: 18px 18px 16px;
      color: #f7f9fb;
      background: rgba(20, 27, 34, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      box-shadow: 0 14px 40px rgba(15, 22, 29, 0.22);
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      margin-bottom: 7px;
      color: #86a6bd;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.17em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 21px;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .description {
      margin: 9px 0 15px;
      color: #bdc8d1;
      font-size: 12px;
      line-height: 1.55;
    }

    .actions {
      display: flex;
      gap: 9px;
    }

    button {
      min-height: 39px;
      padding: 0 15px;
      border: 0;
      border-radius: 10px;
      color: #14202a;
      background: #ffffff;
      font: inherit;
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease, opacity 120ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      background: #dce8f0;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
      transform: none;
    }

    #exportButton {
      flex: 1;
    }

    #resetButton {
      color: #edf3f7;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.13);
    }

    #status {
      min-height: 16px;
      margin-top: 11px;
      color: #8fa3b0;
      font-size: 11px;
    }

    .hint {
      position: fixed;
      right: 20px;
      bottom: 18px;
      z-index: 10;
      padding: 8px 11px;
      color: #34434f;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(31, 43, 53, 0.09);
      border-radius: 9px;
      font-size: 11px;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    @media (max-width: 560px) {
      .panel {
        top: 12px;
        left: 12px;
        width: calc(100vw - 24px);
      }

      .hint {
        display: none;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="viewport"></div>

  <section class="panel">
    <div class="eyebrow">Static Low-Poly Asset</div>
    <h1>Rowing Exercise Machine</h1>
    <p class="description">
      Long white floor rail, broad padded sliding seat, supported fan housing,
      and two independently connected side pull handles.
    </p>
    <div class="actions">
      <button id="exportButton" type="button">Export GLB</button>
      <button id="resetButton" type="button">Reset View</button>
    </div>
    <div id="status">Ready to export.</div>
  </section>

  <div class="hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";
    import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

    const viewport = document.getElementById("viewport");
    const exportButton = document.getElementById("exportButton");
    const resetButton = document.getElementById("resetButton");
    const status = document.getElementById("status");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe8edf1);
    scene.fog = new THREE.Fog(0xe8edf1, 13, 25);

    const camera = new THREE.PerspectiveCamera(
      36,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    const initialCameraPosition = new THREE.Vector3(6.7, 4.3, 6.9);
    const initialTarget = new THREE.Vector3(0, 0.55, 0.1);
    camera.position.copy(initialCameraPosition);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      preserveDrawingBuffer: false
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    viewport.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(initialTarget);
    controls.enableDamping = true;
    controls.dampingFactor = 0.075;
    controls.minDistance = 4.2;
    controls.maxDistance = 16;
    controls.maxPolarAngle = Math.PI * 0.49;

    const hemiLight = new THREE.HemisphereLight(0xf4f8ff, 0x78828b, 2.15);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 3.3);
    keyLight.position.set(4.5, 8, 5.5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -7;
    keyLight.shadow.camera.right = 7;
    keyLight.shadow.camera.top = 7;
    keyLight.shadow.camera.bottom = -7;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 24;
    keyLight.shadow.bias = -0.0003;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xdcecff, 1.3);
    fillLight.position.set(-5, 3.5, -4);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffffff, 1.6);
    rimLight.position.set(0, 5, -7);
    scene.add(rimLight);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      new THREE.MeshStandardMaterial({
        color: 0xd9e0e5,
        roughness: 0.94,
        metalness: 0.0
      })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.012;
    ground.receiveShadow = true;
    scene.add(ground);

    const asset = new THREE.Group();
    asset.name = "RowingExerciseMachine";
    scene.add(asset);

    const materials = {
      white: new THREE.MeshStandardMaterial({
        color: 0xf5f7f7,
        roughness: 0.43,
        metalness: 0.08
      }),
      whiteEdge: new THREE.MeshStandardMaterial({
        color: 0xdce4e8,
        roughness: 0.52,
        metalness: 0.08
      }),
      rubber: new THREE.MeshStandardMaterial({
        color: 0x172128,
        roughness: 0.86,
        metalness: 0.02
      }),
      darkMetal: new THREE.MeshStandardMaterial({
        color: 0x35434d,
        roughness: 0.38,
        metalness: 0.65
      }),
      brushedMetal: new THREE.MeshStandardMaterial({
        color: 0x9aa9b3,
        roughness: 0.31,
        metalness: 0.78
      }),
      cushion: new THREE.MeshStandardMaterial({
        color: 0x165f91,
        roughness: 0.69,
        metalness: 0.01
      }),
      cushionInset: new THREE.MeshStandardMaterial({
        color: 0x0c3e62,
        roughness: 0.78,
        metalness: 0.0
      }),
      grille: new THREE.MeshStandardMaterial({
        color: 0x26323b,
        roughness: 0.5,
        metalness: 0.38
      }),
      blade: new THREE.MeshStandardMaterial({
        color: 0x348fc2,
        roughness: 0.52,
        metalness: 0.12
      })
    };

    function roundedBox(
      width,
      height,
      depth,
      radius,
      material,
      position,
      rotation = [0, 0, 0],
      parent = asset,
      segments = 3
    ) {
      const geometry = new RoundedBoxGeometry(
        width,
        height,
        depth,
        segments,
        radius
      );
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(...position);
      mesh.rotation.set(...rotation);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function box(width, height, depth, material, position, rotation = [0, 0, 0], parent = asset) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(width, height, depth),
        material
      );
      mesh.position.set(...position);
      mesh.rotation.set(...rotation);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function cylinder(
      radius,
      length,
      material,
      position,
      rotation = [0, 0, 0],
      radialSegments = 24,
      parent = asset
    ) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, length, radialSegments),
        material
      );
      mesh.position.set(...position);
      mesh.rotation.set(...rotation);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function cylinderBetween(start, end, radius, material, radialSegments = 20, parent = asset) {
      const a = new THREE.Vector3(...start);
      const b = new THREE.Vector3(...end);
      const direction = b.clone().sub(a);
      const length = direction.length();

      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, length, radialSegments),
        material
      );
      mesh.position.copy(a).add(b).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function torus(
      radius,
      tube,
      material,
      position,
      rotation = [0, 0, 0],
      parent = asset
    ) {
      const mesh = new THREE.Mesh(
        new THREE.TorusGeometry(radius, tube, 12, 28),
        material
      );
      mesh.position.set(...position);
      mesh.rotation.set(...rotation);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    // Main long white floor rail.
    roundedBox(
      0.18,
      0.16,
      6.4,
      0.045,
      materials.white,
      [0, 0.24, 0],
      [0, 0, 0],
      asset,
      3
    );

    // Slim dark underside gives the rail more depth without obscuring it.
    roundedBox(
      0.09,
      0.035,
      6.08,
      0.012,
      materials.darkMetal,
      [0, 0.148, 0],
      [0, 0, 0],
      asset,
      2
    );

    // White end caps and black rubber floor feet.
    for (const z of [-3.02, 3.02]) {
      roundedBox(
        0.23,
        0.21,
        0.18,
        0.045,
        materials.whiteEdge,
        [0, 0.24, z],
        [0, 0, 0],
        asset,
        2
      );

      for (const x of [-0.52, 0.52]) {
        roundedBox(
          0.24,
          0.07,
          0.34,
          0.025,
          materials.rubber,
          [x, 0.055, z],
          [0, 0, 0],
          asset,
          2
        );
      }
    }

    // Small rail attachment collars.
    for (const z of [-2.45, 2.45]) {
      for (const x of [-0.13, 0.13]) {
        roundedBox(
          0.055,
          0.09,
          0.22,
          0.015,
          materials.brushedMetal,
          [x, 0.24, z],
          [0, 0, 0],
          asset,
          2
        );
      }
    }

    // Broad padded seat assembly.
    roundedBox(
      1.18,
      0.18,
      1.52,
      0.07,
      materials.darkMetal,
      [0, 0.43, 0.1],
      [0, 0, 0],
      asset,
      2
    );

    roundedBox(
      1.06,
      0.22,
      1.24,
      0.13,
      materials.cushion,
      [0, 0.61, 0.12],
      [0, 0, 0],
      asset,
      3
    );

    // Slightly inset top pad.
    roundedBox(
      0.86,
      0.055,
      0.91,
      0.09,
      materials.cushionInset,
      [0, 0.735, 0.12],
      [0, 0, 0],
      asset,
      2
    );

    // Subtle padded seam strips.
    for (const z of [-0.15, 0.12, 0.39]) {
      roundedBox(
        0.78,
        0.012,
        0.018,
        0.006,
        materials.white,
        [0, 0.769, z],
        [0, 0, 0],
        asset,
        1
      );
    }

    // Narrow backrest behind the seat.
    roundedBox(
      0.92,
      0.43,
      0.18,
      0.085,
      materials.cushion,
      [0, 0.81, -0.43],
      [-0.12, 0, 0],
      asset,
      3
    );

    roundedBox(
      0.69,
      0.10,
      0.025,
      0.04,
      materials.white,
      [0, 0.91, -0.322],
      [-0.12, 0, 0],
      asset,
      2
    );

    // Seat adjustment hardware.
    for (const x of [-0.48, 0.48]) {
      cylinder(
        0.045,
        0.08,
        materials.brushedMetal,
        [x, 0.55, -0.43],
        [0, 0, 0],
        16
      );
    }

    // Side pull handles with their own mounting brackets and pivot connections.
    for (const side of [-1, 1]) {
      const sideName = side < 0 ? "Left" : "Right";

      // Bracket and diagonal load arm.
      roundedBox(
        0.22,
        0.18,
        0.28,
        0.045,
        materials.white,
        [side * 0.76, 0.37, -1.55],
        [0, 0, 0],
        asset,
        2
      );

      cylinderBetween(
        [side * 0.76, 0.39, -1.55],
        [side * 1.14, 0.94, -1.55],
        0.055,
        materials.darkMetal,
        20
      );

      cylinder(
        0.095,
        0.28,
        materials.brushedMetal,
        [side * 1.14, 0.94, -1.55],
        [0, 0, Math.PI / 2],
        20
      );

      // U-shaped side pull handle.
      roundedBox(
        0.13,
        0.13,
        1.28,
        0.045,
        materials.white,
        [side * 1.27, 0.94, -1.23],
        [0, 0, 0],
        asset,
        3
      );

      roundedBox(
        0.16,
        0.16,
        0.67,
        0.045,
        materials.rubber,
        [side * 1.27, 0.94, -1.23],
        [0, 0, 0],
        asset,
        3
      );

      // Small end caps.
      for (const z of [-1.88, -0.58]) {
        roundedBox(
          0.16,
          0.16,
          0.08,
          0.035,
          materials.darkMetal,
          [side * 1.27, 0.94, z],
          [0, 0, 0],
          asset,
          2
        );
      }
    }

    // Front fan housing.
    roundedBox(
      0.98,
      0.78,
      0.76,
      0.12,
      materials.white,
      [0, 1.15, 2.46],
      [0, 0, 0],
      asset,
      3
    );

    // Fan recessed front face.
    cylinder(
      0.36,
      0.045,
      materials.grille,
      [0, 1.16, 2.865],
      [Math.PI / 2, 0, 0],
      28
    );

    // Fan ring.
    torus(
      0.365,
      0.037,
      materials.darkMetal,
      [0, 1.16, 2.89],
      [0, 0, 0]
    );

    // Four low-poly fan blades.
    for (let i = 0; i < 4; i++) {
      const angle = (i / 4) * Math.PI * 2;
      const blade = roundedBox(
        0.39,
        0.105,
        0.035,
        0.035,
        materials.blade,
        [
          Math.cos(angle) * 0.145,
          1.16 + Math.sin(angle) * 0.145,
          2.89
        ],
        [0, 0, angle],
        asset,
        2
      );
      blade.castShadow = true;
    }

    cylinder(
      0.075,
      0.10,
      materials.darkMetal,
      [0, 1.16, 2.91],
      [Math.PI / 2, 0, 0],
      20
    );

    // Grille bars.
    box(
      0.57,
      0.018,
      0.018,
      materials.darkMetal,
      [0, 1.16, 2.91]
    );
    box(
      0.018,
      0.57,
      0.018,
      materials.darkMetal,
      [0, 1.16, 2.91]
    );

    // Housing-to-rail support: two short angled struts and a vertical spine.
    cylinderBetween(
      [-0.28, 0.31, 2.08],
      [-0.28, 0.84, 2.36],
      0.055,
      materials.darkMetal,
      18
    );
    cylinderBetween(
      [0.28, 0.31, 2.08],
      [0.28, 0.84, 2.36],
      0.055,
      materials.darkMetal,
      18
    );
    roundedBox(
      0.48,
      0.09,
      0.42,
      0.035,
      materials.darkMetal,
      [0, 0.82, 2.42],
      [0, 0, 0],
      asset,
      2
    );

    // Rear stabilizer feet.
    for (const z of [-2.72, 2.72]) {
      for (const x of [-0.42, 0.42]) {
        roundedBox(
          0.22,
          0.07,
          0.32,
          0.025,
          materials.rubber,
          [x, 0.05, z],
          [0, 0, 0],
          asset,
          2
        );
      }
    }

    // Add a small utility logo plate for a polished product look.
    roundedBox(
      0.27,
      0.018,
      0.12,
      0.008,
      materials.whiteEdge,
      [0, 0.335, -2.25],
      [0, 0, 0],
      asset,
      1
    );

    // Ensure all asset parts are visible and cast shadows.
    asset.traverse((object) => {
      if (object.isMesh) {
        object.castShadow = true;
        object.receiveShadow = true;
      }
    });

    function resetView() {
      camera.position.copy(initialCameraPosition);
      controls.target.copy(initialTarget);
      controls.update();
    }

    resetButton.addEventListener("click", resetView);

    exportButton.addEventListener("click", () => {
      exportButton.disabled = true;
      status.textContent = "Preparing GLB…";

      const exporter = new GLTFExporter();
      exporter.parse(
        asset,
        (result) => {
          const blob = new Blob([result], {
            type: "model/gltf-binary"
          });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "low-poly-rowing-exercise-machine.glb";
          document.body.appendChild(link);
          link.click();
          link.remove();

          setTimeout(() => URL.revokeObjectURL(url), 1500);
          status.textContent = "GLB exported successfully.";
          exportButton.disabled = false;
        },
        (error) => {
          console.error(error);
          status.textContent = "Export failed. See the browser console for details.";
          exportButton.disabled = false;
        },
        {
          binary: true,
          onlyVisible: true,
          trs: false,
          includeCustomExtensions: false
        }
      );
    });

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    }

    window.addEventListener("resize", onResize);

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
