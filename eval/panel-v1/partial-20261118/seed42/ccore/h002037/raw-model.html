<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neighborhood Services Shop — Three.js</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% 35%, #ffffff 0%, #e8eee9 58%, #dce5df 100%);
      color: #173b40;
    }

    #scene {
      position: fixed;
      inset: 0;
    }

    #scene canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    .title-card {
      position: fixed;
      top: 22px;
      left: 22px;
      z-index: 10;
      max-width: min(360px, calc(100vw - 44px));
      padding: 15px 18px;
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 12px 35px rgba(31, 67, 66, 0.12);
      backdrop-filter: blur(12px);
      pointer-events: none;
    }

    .eyebrow {
      margin-bottom: 4px;
      color: #267975;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(19px, 3vw, 27px);
      line-height: 1.08;
      letter-spacing: -0.035em;
    }

    .subtitle {
      margin-top: 7px;
      color: #617572;
      font-size: 12px;
      line-height: 1.45;
    }

    .export-panel {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 12px 35px rgba(31, 67, 66, 0.16);
      backdrop-filter: blur(12px);
    }

    #exportButton {
      appearance: none;
      border: 0;
      border-radius: 11px;
      padding: 13px 18px;
      background: #237d78;
      color: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(35, 125, 120, 0.25);
      transition:
        transform 150ms ease,
        background 150ms ease,
        opacity 150ms ease;
    }

    #exportButton:hover {
      background: #1b6d68;
      transform: translateY(-1px);
    }

    #exportButton:active {
      transform: translateY(0);
    }

    #exportButton:disabled {
      cursor: wait;
      opacity: 0.65;
      transform: none;
    }

    #status {
      width: 150px;
      color: #58706d;
      font-size: 11px;
      line-height: 1.35;
    }

    .hint {
      position: fixed;
      left: 50%;
      bottom: 25px;
      z-index: 5;
      transform: translateX(-50%);
      color: rgba(41, 74, 77, 0.65);
      font-size: 11px;
      pointer-events: none;
      white-space: nowrap;
    }

    @media (max-width: 620px) {
      .title-card {
        top: 12px;
        left: 12px;
        padding: 12px 14px;
      }

      .subtitle {
        display: none;
      }

      .export-panel {
        right: 12px;
        bottom: 12px;
        left: 12px;
        justify-content: space-between;
      }

      .hint {
        display: none;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div id="scene"></div>

  <div class="title-card">
    <div class="eyebrow">Low-poly environment asset</div>
    <h1>Neighborhood Services Shop</h1>
    <div class="subtitle">
      A welcoming local service station with a striped awning, client bench,
      planter, and stylized architectural details.
    </div>
  </div>

  <div class="export-panel">
    <button id="exportButton" type="button">Export GLB</button>
    <div id="status">Ready to export</div>
  </div>

  <div class="hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";
    import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

    const sceneContainer = document.getElementById("scene");
    const exportButton = document.getElementById("exportButton");
    const status = document.getElementById("status");

    // ---------------------------------------------------------------------
    // Renderer, camera, and controls
    // ---------------------------------------------------------------------

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    sceneContainer.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe8eee9);
    scene.fog = new THREE.Fog(0xe8eee9, 13, 25);

    const camera = new THREE.PerspectiveCamera(
      36,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(7.2, 5.2, 8.4);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.45, 0.15);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.minDistance = 5.5;
    controls.maxDistance = 17;
    controls.maxPolarAngle = Math.PI * 0.48;

    // ---------------------------------------------------------------------
    // Lighting
    // ---------------------------------------------------------------------

    const hemisphere = new THREE.HemisphereLight(0xf8fff9, 0x66776f, 2.15);
    scene.add(hemisphere);

    const sun = new THREE.DirectionalLight(0xfff2d7, 3.25);
    sun.position.set(5.5, 9, 6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -7;
    sun.shadow.camera.right = 7;
    sun.shadow.camera.top = 7;
    sun.shadow.camera.bottom = -7;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 22;
    sun.shadow.bias = -0.00035;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0xb8e5e4, 1.1);
    fill.position.set(-6, 4, -5);
    scene.add(fill);

    // Preview-only ground. It is not included in the exported GLB.
    const previewGround = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      new THREE.MeshStandardMaterial({
        color: 0xdce5df,
        roughness: 1,
        metalness: 0
      })
    );
    previewGround.rotation.x = -Math.PI / 2;
    previewGround.position.y = -0.025;
    previewGround.receiveShadow = true;
    scene.add(previewGround);

    // ---------------------------------------------------------------------
    // Model root: only this group is exported.
    // ---------------------------------------------------------------------

    const shop = new THREE.Group();
    shop.name = "NeighborhoodServicesShop";
    scene.add(shop);

    // ---------------------------------------------------------------------
    // Materials
    // ---------------------------------------------------------------------

    const material = (color, options = {}) =>
      new THREE.MeshStandardMaterial({
        color,
        roughness: 0.78,
        metalness: 0,
        flatShading: true,
        ...options
      });

    const M = {
      wall: material(0xf1eadb, { roughness: 0.88 }),
      wallShade: material(0xd9d3c5, { roughness: 0.9 }),
      teal: material(0x247c78, { roughness: 0.68 }),
      tealDark: material(0x174f52, { roughness: 0.72 }),
      tealLight: material(0x55aaa2, { roughness: 0.68 }),
      cream: material(0xfff8e8, { roughness: 0.8 }),
      roof: material(0xcbd6d1, { roughness: 0.78 }),
      roofDark: material(0x406b68, { roughness: 0.75 }),
      concrete: material(0xbfc5bd, { roughness: 0.95 }),
      concreteDark: material(0x919b93, { roughness: 0.95 }),
      wood: material(0xb87848, { roughness: 0.84 }),
      woodLight: material(0xd19a64, { roughness: 0.82 }),
      woodDark: material(0x765039, { roughness: 0.88 }),
      metal: material(0x405451, { roughness: 0.42, metalness: 0.48 }),
      brass: material(0xc89b4d, { roughness: 0.34, metalness: 0.72 }),
      glass: material(0x9dcbd0, {
        roughness: 0.18,
        metalness: 0.08,
        transparent: true,
        opacity: 0.72,
        depthWrite: false,
        side: THREE.DoubleSide
      }),
      blueGlass: material(0x5a9ca5, {
        roughness: 0.24,
        metalness: 0.12,
        transparent: true,
        opacity: 0.82,
        depthWrite: false,
        side: THREE.DoubleSide
      }),
      soil: material(0x4b3c2f, { roughness: 1 }),
      leaf: material(0x4f8b58, { roughness: 0.92 }),
      leafLight: material(0x73a961, { roughness: 0.92 }),
      bulb: material(0xffe8a5, {
        emissive: 0xffbf55,
        emissiveIntensity: 1.6,
        roughness: 0.35
      })
    };

    // ---------------------------------------------------------------------
    // Geometry helpers
    // ---------------------------------------------------------------------

    function addMesh(parent, geometry, mat, position = [0, 0, 0], rotation = [0, 0, 0]) {
      const mesh = new THREE.Mesh(geometry, mat);
      mesh.position.set(...position);
      mesh.rotation.set(...rotation);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function box(parent, size, position, mat, radius = 0.045) {
      const safeRadius = Math.max(
        0.001,
        Math.min(radius, Math.min(...size) * 0.48)
      );
      const geometry = new RoundedBoxGeometry(
        size[0],
        size[1],
        size[2],
        2,
        safeRadius
      );
      return addMesh(parent, geometry, mat, position);
    }

    function cylinder(
      parent,
      radiusTop,
      radiusBottom,
      height,
      position,
      mat,
      radialSegments = 8,
      rotation = [0, 0, 0]
    ) {
      const geometry = new THREE.CylinderGeometry(
        radiusTop,
        radiusBottom,
        height,
        radialSegments,
        1,
        false
      );
      return addMesh(parent, geometry, mat, position, rotation);
    }

    function ico(parent, radius, position, mat, scale = [1, 1, 1]) {
      const mesh = addMesh(
        parent,
        new THREE.IcosahedronGeometry(radius, 1),
        mat,
        position
      );
      mesh.scale.set(...scale);
      return mesh;
    }

    // ---------------------------------------------------------------------
    // Foundation and building shell
    // ---------------------------------------------------------------------

    box(shop, [4.9, 0.22, 3.15], [0, 0.11, 0], M.concrete, 0.075);
    box(shop, [4.56, 0.13, 2.82], [0, 0.255, 0], M.concreteDark, 0.04);
    box(shop, [4.4, 2.95, 2.65], [0, 1.69, 0], M.wall, 0.09);

    // A slightly narrower lower wall band adds architectural depth.
    box(shop, [4.24, 0.42, 2.49], [0, 0.53, 0], M.wallShade, 0.045);

    // Front wainscot.
    box(shop, [4.12, 0.73, 0.11], [0, 0.71, 1.365], M.teal, 0.04);
    box(shop, [4.03, 0.09, 0.055], [0, 0.98, 1.435], M.tealLight, 0.02);

    // Side wainscot.
    box(shop, [0.11, 0.73, 2.28], [2.225, 0.71, 0], M.teal, 0.04);
    box(shop, [0.055, 0.09, 2.18], [2.295, 0.98, 0], M.tealLight, 0.018);

    // Roof and roof lip.
    box(shop, [4.68, 0.15, 2.92], [0, 3.225, 0], M.roofDark, 0.055);
    box(shop, [4.58, 0.1, 2.82], [0, 3.335, 0], M.roof, 0.04);

    // Front fascia below the roof.
    box(shop, [4.43, 0.22, 0.1], [0, 3.12, 1.385], M.tealDark, 0.035);

    // ---------------------------------------------------------------------
    // Front windows
    // ---------------------------------------------------------------------

    function makeFrontWindow(x, width, y, name) {
      box(shop, [width + 0.18, 1.7 + 0.18, 0.11], [x, y, 1.37], M.cream, 0.055);
      box(shop, [width, 1.5, 0.06], [x, y, 1.435], M.blueGlass, 0.025);
      box(shop, [0.055, 1.5, 0.045], [x, y, 1.477], M.cream, 0.018);
      box(shop, [width, 0.055, 0.045], [x, y, 1.477], M.cream, 0.018);
      box(shop, [width * 0.28, 0.035, 0.018], [x, y + 0.48, 1.47], M.tealLight, 0.008);
    }

    makeFrontWindow(-1.22, 1.48, 1.83, "FrontLeftWindow");
    makeFrontWindow(1.45, 0.7, 1.83, "FrontRightWindow");

    // ---------------------------------------------------------------------
    // Front door
    // ---------------------------------------------------------------------

    box(shop, [1.38, 2.28, 0.13], [0.25, 1.39, 1.39], M.cream, 0.065);
    box(shop, [1.17, 0.94, 0.09], [0.25, 0.94, 1.48], M.teal, 0.05);
    box(shop, [1.02, 1.18, 0.045], [0.25, 1.99, 1.49], M.glass, 0.02);

    // Door handle.
    cylinder(shop, 0.035, 0.035, 0.31, [0.76, 1.25, 1.56], M.brass, 8);
    cylinder(shop, 0.055, 0.055, 0.055, [0.76, 1.42, 1.525], M.brass, 8, [Math.PI / 2, 0, 0]);
    cylinder(shop, 0.055, 0.055, 0.055, [0.76, 1.08, 1.525], M.brass, 8, [Math.PI / 2, 0, 0]);

    // Hinges.
    box(shop, [0.07, 0.19, 0.055], [-0.34, 1.05, 1.525], M.metal, 0.018);
    box(shop, [0.07, 0.19, 0.055], [-0.34, 1.65, 1.525], M.metal, 0.018);

    // ---------------------------------------------------------------------
    // Striped awning
    // ---------------------------------------------------------------------

    const awning = new THREE.Group();
    awning.name = "StripedAwning";
    awning.position.set(0, 2.73, 1.72);
    awning.rotation.x = -0.045;
    shop.add(awning);

    const stripeCount = 8;
    const stripeWidth = 3.75 / stripeCount;

    for (let i = 0; i < stripeCount; i++) {
      const x = -3.75 / 2 + stripeWidth * (i + 0.5);
      box(
        awning,
        [stripeWidth, 0.1, 0.92],
        [x, 0, 0],
        i % 2 === 0 ? M.teal : M.cream,
        0.032
      );
      box(
        awning,
        [stripeWidth, 0.17, 0.07],
        [x, -0.09, 0.48],
        i % 2 === 0 ? M.tealDark : M.teal,
        0.022
      );
    }

    // ---------------------------------------------------------------------
    // Sign with an embedded canvas texture
    // ---------------------------------------------------------------------

    function createSignTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 1024;
      canvas.height = 192;

      const context = canvas.getContext("2d");
      context.fillStyle = "#f7f1df";
      context.fillRect(0, 0, canvas.width, canvas.height);

      context.fillStyle = "#247c78";
      context.fillRect(0, 0, canvas.width, 18);

      context.fillStyle = "#c99b4d";
      context.beginPath();
      context.arc(145, 91, 48, 0, Math.PI * 2);
      context.fill();

      // Small house symbol.
      context.fillStyle = "#247c78";
      context.beginPath();
      context.moveTo(121, 61);
      context.lineTo(151, 47);
      context.lineTo(181, 61);
      context.lineTo(151, 88);
      context.lineTo(121, 73);
      context.closePath();
      context.fill();

      context.fillStyle = "#8f6c43";
      context.fillRect(116, 93, 22, 14);
      context.fillRect(139, 93, 22, 14);

      context.fillStyle = "#1b4e50";
      context.textAlign = "left";
      context.textBaseline = "middle";
      context.font = "800 58px Arial, sans-serif";
      context.fillText("NEIGHBORHOOD", 245, 84);

      context.fillStyle = "#247c78";
      context.font = "700 35px Arial, sans-serif";
      context.fillText("SERVICES", 249, 130);

      context.fillStyle = "#52706c";
      context.font = "500 20px Arial, sans-serif";
      context.fillText("LOCAL • DAILY • BELNeIGHTH", 250, 164);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      return texture;
    }

    const signMaterial = new THREE.MeshStandardMaterial({
      map: createSignTexture(),
      roughness: 0.88,
      metalness: 0
    });

    const sign = addMesh(
      shop,
      new THREE.PlaneGeometry(3.0, 0.57),
      signMaterial,
      [0, 3.115, 1.452]
    );
    sign.name = "NeighborhoodServicesSign";

    // ---------------------------------------------------------------------
    // Right-side window and ventilation grille
    // ---------------------------------------------------------------------

    box(shop, [0.11, 1.58, 1.38], [2.225, 1.86, -0.16], M.cream, 0.055);
    box(shop, [0.06, 1.35, 1.16], [2.29, 1.86, -0.16], M.blueGlass, 0.025);
    box(shop, [0.045, 1.35, 0.055], [2.33, 1.86, -0.16], M.cream, 0.016);
    box(shop, [0.045, 0.055, 1.16], [2.33, 1.86, -0.16], M.cream, 0.016);

    box(shop, [0.055, 0.58, 0.73], [2.235, 2.94, -0.67], M.tealDark, 0.025);

    for (let i = 0; i < 5; i++) {
      box(
        shop,
        [0.045, 0.045, 0.65],
        [2.285, 2.75 + i * 0.11, -0.67],
        M.metal,
        0.012
      );
    }

    // ---------------------------------------------------------------------
    // Service counter
    // ---------------------------------------------------------------------

    const counter = new THREE.Group();
    counter.name = "ServiceCounter";
    counter.position.set(1.47, 0, 1.72);
    shop.add(counter);

    box(counter, [1.25, 0.73, 0.64], [0, 0.64, 0], M.woodDark, 0.055);
    box(counter, [1.36, 0.1, 0.74], [0, 1.055, 0], M.cream, 0.035);
    box(counter, [1.05, 0.43, 0.035], [0, 0.67, 0.337], M.teal, 0.025);
    box(counter, [0.72, 0.07, 0.025], [0, 0.68, 0.362], M.cream, 0.012);

    // Clipboard.
    box(counter, [0.38, 0.035, 0.29], [-0.27, 1.125, 0.03], M.wood, 0.015);
    box(counter, [0.29, 0.012, 0.21], [-0.27, 1.147, 0.03], M.white, 0.006);
    box(counter, [0.09, 0.018, 0.07], [-0.27, 1.157, 0.03], M.tealLight, 0.008);

    // Small cash register.
    box(counter, [0.29, 0.17, 0.24], [0.31, 1.185, -0.03], M.metal, 0.035);
    box(counter, [0.21, 0.018, 0.15], [0.31, 1.282, -0.03], M.tealDark, 0.012);

    for (let i = 0; i < 3; i++) {
      box(
        counter,
        [0.06, 0.015, 0.045],
        [0.24 + i * 0.07, 1.294, -0.03],
        M.cream,
        0.005
      );
    }

    // ---------------------------------------------------------------------
    // Exterior bench
    // ---------------------------------------------------------------------

    const bench = new THREE.Group();
    bench.name = "ExteriorBench";
    bench.position.set(2.86, 0, 0.42);
    shop.add(bench);

    // Seat slats.
    for (let i = 0; i < 4; i++) {
      box(
        bench,
        [1.72, 0.09, 0.17],
        [0, 0.63, -0.18 + i * 0.16],
        i % 2 === 0 ? M.wood : M.woodLight,
        0.032
      );
    }

    // Backrest slats.
    for (let i = 0; i < 3; i++) {
      box(
        bench,
        [1.72, 0.13, 0.08],
        [0, 0.84 + i * 0.19, -0.31],
        i % 2 === 0 ? M.wood : M.woodLight,
        0.025
      );
    }

    // Legs and feet.
    for (const x of [-0.67, 0.67]) {
      box(bench, [0.11, 0.57, 0.48], [x, 0.3, 0], M.woodDark, 0.03);
      box(bench, [0.25, 0.08, 0.56], [x, 0.08, 0], M.woodDark, 0.025);
    }

    // Armrests.
    for (const x of [-0.83, 0.83]) {
      box(bench, [0.09, 0.09, 0.56], [x, 0.83, 0.02], M.woodDark, 0.025);
      box(bench, [0.075, 0.43, 0.075], [x, 0.61, -0.22], M.woodDark, 0.02);
    }

    // ---------------------------------------------------------------------
    // Planter and low-poly shrub
    // ---------------------------------------------------------------------

    const planter = new THREE.Group();
    planter.name = "Planter";
    planter.position.set(-2.48, 0, 1.13);
    shop.add(planter);

    cylinder(planter, 0.43, 0.35, 0.55, [0, 0.48, 0], M.teal, 8);
    cylinder(planter, 0.385, 0.385, 0.035, [0, 0.765, 0], M.soil, 8);

    ico(planter, 0.48, [0, 1.03, 0], M.leaf, [1, 1.12, 1]);
    ico(planter, 0.31, [0.24, 1.16, 0.05], M.leafLight, [1, 1.15, 1]);
    ico(planter, 0.27, [-0.22, 1.14, 0.08], M.leaf, [1, 1.1, 1]);
    ico(planter, 0.2, [0.1, 1.38, -0.04], M.leafLight, [1, 1.25, 1]);

    // ---------------------------------------------------------------------
    // Entry walkway and pavers
    // ---------------------------------------------------------------------

    box(shop, [5.15, 0.12, 1.02], [0, 0.06, 2.18], M.concreteDark, 0.055);

    for (let i = 0; i < 6; i++) {
      const x = -1.38 + i * 0.75;
      box(
        shop,
        [0.7, 0.055, 0.36],
        [x, 0.145, 2.37],
        i % 2 === 0 ? M.concrete : M.concreteDark,
        0.018
      );
    }

    // ---------------------------------------------------------------------
    // Roof ventilation slots
    // ---------------------------------------------------------------------

    box(shop, [0.58, 0.04, 0.78], [0.42, 3.405, -0.33], M.roofDark, 0.035);

    for (let i = 0; i < 5; i++) {
      box(
        shop,
        [0.055, 0.025, 0.66],
        [0.16 + i * 0.11, 3.435, -0.33],
        M.metal,
        0.008
      );
    }

    // ---------------------------------------------------------------------
    // Awning light fixtures
    // ---------------------------------------------------------------------

    for (const x of [-1.22, 1.22]) {
      box(shop, [0.32, 0.12, 0.2], [x, 2.62, 1.93], M.tealDark, 0.035);
      ico(shop, 0.09, [x, 2.53, 1.94], M.bulb, [1, 1.2, 1]);
    }

    // Small downspout at the right front corner.
    cylinder(shop, 0.042, 0.042, 2.2, [2.13, 1.88, 1.43], M.metal, 8);
    box(shop, [0.16, 0.055, 0.08], [2.13, 0.77, 1.43], M.metal, 0.018);

    // ---------------------------------------------------------------------
    // Final model setup
    // ---------------------------------------------------------------------

    shop.traverse((object) => {
      if (object.isMesh) {
        object.castShadow = true;
        object.receiveShadow = true;
      }
    });

    shop.updateMatrixWorld(true);

    // ---------------------------------------------------------------------
    // GLB export
    // ---------------------------------------------------------------------

    exportButton.addEventListener("click", () => {
      exportButton.disabled = true;
      status.textContent = "Preparing GLB…";

      const exporter = new GLTFExporter();

      exporter.parse(
        shop,
        (result) => {
          const blob = new Blob([result], {
            type: "model/gltf-binary"
          });

          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "neighborhood-services-shop.glb";
          document.body.appendChild(link);
          link.click();
          link.remove();

          setTimeout(() => URL.revokeObjectURL(url), 1500);

          exportButton.disabled = false;
          status.textContent = "GLB downloaded";
        },
        (error) => {
          console.error(error);
          exportButton.disabled = false;
          status.textContent = "Export failed — see console";
        },
        {
          binary: true,
          embedImages: true,
          onlyVisible: true,
          trs: false,
          maxTextureSize: 2048
        }
      );
    });

    // ---------------------------------------------------------------------
    // Resize and render loop
    // ---------------------------------------------------------------------

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
