<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcane Key — Three.js Asset Creator</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, rgba(45, 154, 190, 0.22), transparent 36%),
        radial-gradient(circle at 20% 75%, rgba(190, 91, 160, 0.15), transparent 34%),
        linear-gradient(145deg, #081322 0%, #0b1728 48%, #050912 100%);
    }

    #viewport {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    .panel {
      position: fixed;
      z-index: 10;
      top: 24px;
      left: 24px;
      max-width: min(360px, calc(100vw - 48px));
      padding: 18px 20px;
      border: 1px solid rgba(151, 220, 255, 0.18);
      border-radius: 16px;
      background: rgba(7, 15, 28, 0.68);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      pointer-events: none;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #70e6ff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #f5d48a;
      font-size: clamp(24px, 4vw, 36px);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .description {
      margin: 10px 0 0;
      color: #9eb4c8;
      font-size: 13px;
      line-height: 1.55;
    }

    .hint {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 13px;
      color: #6f8ba6;
      font-size: 11px;
    }

    .hint::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #68e7ff;
      box-shadow: 0 0 12px #68e7ff;
      content: "";
    }

    #export-button {
      position: fixed;
      z-index: 20;
      right: 24px;
      bottom: 24px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 0 18px;
      border: 1px solid rgba(255, 220, 147, 0.42);
      border-radius: 12px;
      color: #251504;
      background: linear-gradient(135deg, #ffe2a0, #d99b35);
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 0.55);
      font: inherit;
      font-size: 13px;
      font-weight: 850;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: transform 160ms ease, filter 160ms ease, opacity 160ms ease;
    }

    #export-button:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    #export-button:active {
      transform: translateY(0);
    }

    #export-button:disabled {
      opacity: 0.65;
      cursor: wait;
      transform: none;
    }

    #export-button svg {
      width: 18px;
      height: 18px;
    }

    #status {
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: 28px;
      padding: 10px 15px;
      border: 1px solid rgba(128, 225, 255, 0.2);
      border-radius: 999px;
      color: #bdefff;
      background: rgba(5, 13, 24, 0.82);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      font-size: 12px;
      opacity: 0;
      transform: translate(-50%, 12px);
      transition: opacity 180ms ease, transform 180ms ease;
      pointer-events: none;
    }

    #status.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 650px) {
      .panel {
        top: 14px;
        left: 14px;
        padding: 14px 16px;
      }

      .description {
        max-width: 240px;
      }

      #export-button {
        right: 14px;
        bottom: 14px;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div id="viewport"></div>

  <section class="panel">
    <p class="eyebrow">Three.js Asset Creator</p>
    <h1>Arcane Key</h1>
    <p class="description">
      A stylized low-poly golden key with a glowing crystal core, enchanted
      rim, runic shaft, and sculpted locking teeth.
    </p>
    <div class="hint">Drag to orbit · Scroll to zoom</div>
  </section>

  <button id="export-button" type="button">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v3h14v-3"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    <span>Export GLB</span>
  </button>

  <div id="status" role="status" aria-live="polite"></div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

    const viewport = document.getElementById("viewport");
    const exportButton = document.getElementById("export-button");
    const status = document.getElementById("status");

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setClearColor(0x000000, 0);
    viewport.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x081322, 9, 18);

    const camera = new THREE.PerspectiveCamera(
      35,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(4.8, 2.35, 8.8);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.25, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 4.5;
    controls.maxDistance = 13;
    controls.maxPolarAngle = Math.PI * 0.88;
    controls.minPolarAngle = Math.PI * 0.12;
    controls.update();

    // Lighting
    scene.add(new THREE.HemisphereLight(0xa5e9ff, 0x1b1026, 1.7));

    const keyLight = new THREE.DirectionalLight(0xffdf9c, 3.4);
    keyLight.position.set(4, 6, 6);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 20;
    keyLight.shadow.camera.left = -5;
    keyLight.shadow.camera.right = 5;
    keyLight.shadow.camera.top = 6;
    keyLight.shadow.camera.bottom = -6;
    scene.add(keyLight);

    const cyanRim = new THREE.PointLight(0x36dfff, 22, 12, 2);
    cyanRim.position.set(-3.2, 2.6, 2.8);
    scene.add(cyanRim);

    const pinkRim = new THREE.PointLight(0xff74d8, 16, 11, 2);
    pinkRim.position.set(3.5, -0.8, 2.5);
    scene.add(pinkRim);

    const backLight = new THREE.PointLight(0x6b8cff, 14, 10, 2);
    backLight.position.set(0, 1.5, -3);
    scene.add(backLight);

    // Asset materials
    const materials = {
      gold: new THREE.MeshStandardMaterial({
        color: 0xd7a33e,
        metalness: 0.82,
        roughness: 0.27,
        flatShading: true
      }),
      brightGold: new THREE.MeshStandardMaterial({
        color: 0xf2c45b,
        metalness: 0.76,
        roughness: 0.22,
        flatShading: true
      }),
      darkGold: new THREE.MeshStandardMaterial({
        color: 0x815326,
        metalness: 0.72,
        roughness: 0.4,
        flatShading: true
      }),
      bronze: new THREE.MeshStandardMaterial({
        color: 0x4b2d1c,
        metalness: 0.68,
        roughness: 0.46,
        flatShading: true
      }),
      steel: new THREE.MeshStandardMaterial({
        color: 0x7b8b98,
        metalness: 0.9,
        roughness: 0.28,
        flatShading: true
      }),
      inset: new THREE.MeshStandardMaterial({
        color: 0x102b3d,
        metalness: 0.38,
        roughness: 0.38,
        flatShading: true
      }),
      crystal: new THREE.MeshStandardMaterial({
        color: 0x75ebff,
        emissive: 0x1594b4,
        emissiveIntensity: 1.35,
        metalness: 0.22,
        roughness: 0.14,
        flatShading: true
      }),
      violetCrystal: new THREE.MeshStandardMaterial({
        color: 0xc997ff,
        emissive: 0x7036b5,
        emissiveIntensity: 1.1,
        metalness: 0.15,
        roughness: 0.18,
        flatShading: true
      }),
      cyanRing: new THREE.MeshStandardMaterial({
        color: 0x5eeaff,
        emissive: 0x137f9b,
        emissiveIntensity: 0.9,
        metalness: 0.35,
        roughness: 0.25,
        flatShading: true
      })
    };

    const asset = new THREE.Group();
    asset.name = "ArcaneKey";
    scene.add(asset);

    function addMesh(geometry, material, name, position, rotation, parent = asset) {
      const object = new THREE.Mesh(geometry, material);
      object.name = name;
      object.castShadow = true;
      object.receiveShadow = true;

      if (position) object.position.set(...position);
      if (rotation) object.rotation.set(...rotation);

      parent.add(object);
      return object;
    }

    // Main bow
    const bow = addMesh(
      new THREE.TorusGeometry(0.72, 0.135, 8, 28),
      materials.gold,
      "EnchantedBow",
      [0, 2.28, 0]
    );
    bow.scale.z = 0.78;

    const innerRim = addMesh(
      new THREE.TorusGeometry(0.585, 0.045, 6, 24),
      materials.bronze,
      "InnerBowRim",
      [0, 2.28, 0.025]
    );
    innerRim.scale.z = 0.8;

    // Four structural spokes
    for (let i = 0; i < 4; i++) {
      const angle = (i * Math.PI) / 2 + Math.PI * 0.25;
      const spoke = addMesh(
        new THREE.BoxGeometry(0.59, 0.105, 0.17),
        materials.darkGold,
        `BowSpoke_${i + 1}`,
        [
          Math.cos(angle) * 0.305,
          2.28 + Math.sin(angle) * 0.305,
          0
        ],
        [0, 0, angle]
      );
      spoke.castShadow = true;
    }

    // Central hub and collars
    addMesh(
      new THREE.CylinderGeometry(0.235, 0.235, 0.34, 8),
      materials.gold,
      "CentralHub",
      [0, 2.28, 0],
      [Math.PI / 2, 0, 0]
    );

    addMesh(
      new THREE.CylinderGeometry(0.285, 0.285, 0.09, 8),
      materials.brightGold,
      "FrontHubCollar",
      [0, 2.28, 0.18],
      [Math.PI / 2, 0, 0]
    );

    addMesh(
      new THREE.CylinderGeometry(0.255, 0.255, 0.075, 8),
      materials.darkGold,
      "RearHubCollar",
      [0, 2.28, -0.18],
      [Math.PI / 2, 0, 0]
    );

    // Crystal core
    const crystal = addMesh(
      new THREE.OctahedronGeometry(0.3, 0),
      materials.crystal,
      "ArcaneCrystal",
      [0, 2.28, 0.285]
    );
    crystal.scale.set(0.82, 1.12, 0.62);
    crystal.rotation.z = Math.PI * 0.25;

    const crystalSocket = addMesh(
      new THREE.TorusGeometry(0.285, 0.035, 6, 18),
      materials.brightGold,
      "CrystalSocket",
      [0, 2.28, 0.235]
    );
    crystalSocket.scale.z = 0.75;

    const coreGlow = addMesh(
      new THREE.IcosahedronGeometry(0.115, 0),
      materials.cyanRing,
      "CoreGlow",
      [0, 2.28, 0.43]
    );
    coreGlow.scale.z = 0.55;

    // Crown-like crest above the bow
    addMesh(
      new THREE.ConeGeometry(0.14, 0.42, 4),
      materials.brightGold,
      "CrownPoint",
      [0, 3.08, 0],
      [0, Math.PI / 4, 0]
    );

    addMesh(
      new THREE.OctahedronGeometry(0.09, 0),
      materials.crystal,
      "CrownGem",
      [0, 3.18, 0.06]
    );

    // Shaft
    addMesh(
      new THREE.CylinderGeometry(0.145, 0.145, 3.25, 8),
      materials.gold,
      "KeyShaft",
      [0, 0.03, 0]
    );

    // Decorative shaft bands
    addMesh(
      new THREE.TorusGeometry(0.165, 0.035, 6, 16),
      materials.brightGold,
      "UpperShaftBand",
      [0, 1.32, 0],
      [Math.PI / 2, 0, 0]
    );

    addMesh(
      new THREE.TorusGeometry(0.165, 0.035, 6, 16),
      materials.bronze,
      "LowerShaftBand",
      [0, -1.27, 0],
      [Math.PI / 2, 0, 0]
    );

    // Runic inset on the front of the shaft
    addMesh(
      new THREE.BoxGeometry(0.19, 1.58, 0.065),
      materials.inset,
      "RunicInset",
      [0, 0.04, 0.15]
    );

    addMesh(
      new THREE.BoxGeometry(0.035, 1.42, 0.025),
      materials.darkGold,
      "RuneBorderLeft",
      [-0.095, 0.04, 0.192]
    );

    addMesh(
      new THREE.BoxGeometry(0.035, 1.42, 0.025),
      materials.darkGold,
      "RuneBorderRight",
      [0.095, 0.04, 0.192]
    );

    // Glowing rune diamonds
    const runePositions = [
      [0, 0.57, 0.205],
      [-0.055, 0.08, 0.205],
      [0.055, -0.41, 0.205]
    ];

    runePositions.forEach((position, index) => {
      const rune = addMesh(
        new THREE.OctahedronGeometry(0.075, 0),
        index === 1 ? materials.violetCrystal : materials.crystal,
        `ShaftRune_${index + 1}`,
        position
      );
      rune.scale.z = 0.45;
    });

    // Upper collar
    addMesh(
      new THREE.CylinderGeometry(0.23, 0.23, 0.18, 8),
      materials.brightGold,
      "UpperCollar",
      [0, 1.5, 0]
    );

    addMesh(
      new THREE.TorusGeometry(0.225, 0.035, 6, 18),
      materials.gold,
      "UpperCollarRim",
      [0, 1.59, 0],
      [Math.PI / 2, 0, 0]
    );

    // Lower collar
    addMesh(
      new THREE.CylinderGeometry(0.205, 0.205, 0.16, 8),
      materials.darkGold,
      "LowerCollar",
      [0, -1.48, 0]
    );

    // Sculpted key bit
    addMesh(
      new THREE.BoxGeometry(0.72, 0.76, 0.24),
      materials.steel,
      "KeyBlade",
      [0, -2.02, 0]
    );

    addMesh(
      new THREE.BoxGeometry(0.57, 0.27, 0.29),
      materials.gold,
      "UpperBladeJaw",
      [0, -1.61, 0]
    );

    addMesh(
      new THREE.BoxGeometry(0.57, 0.2, 0.27),
      materials.darkGold,
      "LowerBladeJaw",
      [0, -2.46, 0]
    );

    // Four downward cutting teeth
    [-0.255, -0.085, 0.085, 0.255].forEach((x, index) => {
      addMesh(
        new THREE.BoxGeometry(0.105, 0.25, 0.3),
        materials.steel,
        ` CuttingTooth_${index + 1}`,
        [x, -2.34, 0]
      );
    });

    // Small decorative pins on the bit
    [-0.25, 0.25].forEach((x, index) => {
      const pin = addMesh(
        new THREE.CylinderGeometry(0.055, 0.055, 0.045, 8),
        materials.brightGold,
        `BitPin_${index + 1}`,
        [x, -2.05, 0.14],
        [Math.PI / 2, 0, 0]
      );
      pin.scale.z = 0.7;
    });

    // Magical rings surrounding the bow
    const frontRing = addMesh(
      new THREE.TorusGeometry(0.94, 0.022, 4, 36),
      materials.cyanRing,
      "FrontMagicRing",
      [0, 2.25, 0.11]
    );
    frontRing.scale.z = 0.55;

    const rearRing = addMesh(
      new THREE.TorusGeometry(0.94, 0.018, 4, 36),
      materials.violetCrystal,
      "RearMagicRing",
      [0, 2.25, -0.11]
    );
    rearRing.scale.z = 0.55;
    rearRing.rotation.y = Math.PI;

    // Static magical shards around the key
    const sparkleData = [
      [-1.02, 2.62, 0.22, 0.12, "violetCrystal"],
      [1.05, 2.42, 0.1, 0.1, "crystal"],
      [-0.92, 0.9, 0.25, 0.09, "crystal"],
      [1.08, 0.45, -0.05, 0.11, "violetCrystal"],
      [-0.62, -1.18, 0.2, 0.08, "crystal"],
      [0.75, -1.65, 0.15, 0.09, "violetCrystal"],
      [-0.35, 3.22, 0.05, 0.075, "crystal"],
      [0.42, 3.34, -0.03, 0.065, "violetCrystal"]
    ];

    sparkleData.forEach((data, index) => {
      const [x, y, z, size, materialName] = data;

      const sparkle = addMesh(
        new THREE.OctahedronGeometry(size, 0),
        materials[materialName],
        `MagicSparkle_${index + 1}`,
        [x, y, z]
      );

      sparkle.rotation.set(
        index * 0.43,
        index * 0.61,
        index * 0.37
      );
      sparkle.scale.z = 0.62;
    });

    // Export only the asset group, excluding preview lights and background.
    const exporter = new GLTFExporter();

    function showStatus(message, duration = 2200) {
      status.textContent = message;
      status.classList.add("visible");

      window.clearTimeout(showStatus.timeout);
      showStatus.timeout = window.setTimeout(() => {
        status.classList.remove("visible");
      }, duration);
    }

    exportButton.addEventListener("click", () => {
      exportButton.disabled = true;
      exportButton.querySelector("span").textContent = "Exporting...";

      exporter.parse(
        asset,
        (result) => {
          try {
            const blob = new Blob([result], {
              type: "model/gltf-binary"
            });

            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = "arcane-key.glb";
            document.body.appendChild(link);
            link.click();
            link.remove();

            window.setTimeout(() => URL.revokeObjectURL(url), 1000);

            showStatus("Arcane key exported successfully.");
          } catch (error) {
            console.error(error);
            showStatus("Export failed. Check the browser console.");
          } finally {
            exportButton.disabled = false;
            exportButton.querySelector("span").textContent = "Export GLB";
          }
        },
        (error) => {
          console.error(error);
          exportButton.disabled = false;
          exportButton.querySelector("span").textContent = "Export GLB";
          showStatus("Export failed. Check the browser console.");
        },
        {
          binary: true,
          onlyVisible: true,
          trs: false,
          maxTextureSize: 4096
        }
      );
    });

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", resize);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
