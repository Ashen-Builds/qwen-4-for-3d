<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Babylonian Marketplace — Three.js GLB Asset</title>

  <style>
    :root {
      --ink: #152027;
      --cream: #fff3cf;
      --glass: rgba(255, 245, 208, 0.82);
      --accent: #087fa4;
      --gold: #d9993d;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 52% 35%, #dff7ff 0, #d7c59a 38%, #b98954 72%, #8d6342 100%);
    }

    canvas { display: block; }

    .toolbar {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,.65);
      border-radius: 16px;
      background: var(--glass);
      box-shadow: 0 12px 34px rgba(41, 29, 15, .18);
      backdrop-filter: blur(14px);
    }

    .export {
      border: 0;
      border-radius: 11px;
      padding: 11px 15px;
      color: white;
      background: linear-gradient(135deg, #087fa4, #075a91);
      box-shadow: 0 6px 16px rgba(8, 90, 145, .25);
      font-weight: 750;
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease;
    }

    .export:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .export:active { transform: translateY(1px); }
    .export:disabled { opacity: .6; cursor: wait; }

    .title {
      font-size: 14px;
      font-weight: 750;
      line-height: 1.2;
    }

    .subtitle { margin-top: 4px; color: #597078; font-size: 11px; }

    .hint { position: absolute; right: 18px; bottom: 16px; z-index: 4; padding: 8px 11px; border: 1px solid rgba(255,255,255,.5); border-radius: 999px; background: rgba(255,245,208,.62); color: #52656b; font-size: 11px; font-weight: 600; backdrop-filter: blur(10px); pointer-events: none; }

    #status { position: absolute; left: 50%; bottom: 22px; z-index: 6; transform: translate(-50%, 20px); opacity: 0; padding: 10px 15px; border-radius: 999px; background: rgba(21, 32, 39, .92); color: white; font-size: 12px; font-weight: 700; box-shadow: 0 8px 25px rgba(0,0,0,.25); pointer-events: none; }

    #status.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 620px) { .toolbar { top: 12px; left: 12px; right: 12px; } .subtitle, .hint { display: none; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div class="toolbar">
    <button id="exportBtn" class="export">Export animated GLB</button>
    <div class="title">Babylonian Marketplace</div>
    <div class="subtitle">Low-poly diorama · looping market animation</div>
  </div>

  <div class="hint">Drag to orbit · scroll to zoom · animation plays automatically</div>
  <div id="status"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    // -------------------------------------------------------------------------
    // Renderer and presentation
    // -------------------------------------------------------------------------

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#c9d7d0');
    scene.fog = new THREE.FogExp2('#c9d7d0', 0.018);

    const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 250);
    camera.position.set(11.8, 10.2, 14.4);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    document.body.prepend(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.05, 0);
    controls.enableDamping = true;
    controls.minDistance = 8;
    controls.maxDistance = 30;
    controls.maxPolarAngle = Math.PI * 0.47;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.38;

    // -------------------------------------------------------------------------
    // Materials
    // -------------------------------------------------------------------------

    const makeMat = (color, opts={}) => new THREE.MeshStandardMaterial({
      color,
      roughness: opts.roughness ?? 0.82,
      metalness: opts.metalness ?? 0,
      flatShading: opts.flatShading ?? true,
      side: opts.side ?? THREE.FrontSide
    });

    const mats = {
      earth: makeMat('#a8794f'),
      earthDark: makeMat('#876040'),
      earthLight: makeMat('#c39460'),
      warm: makeMat('#d8a865'),
      warmLight: makeMat('#efc27f'),
      ochre: makeMat('#d47b3f'),
      redOchre: makeMat('#c85d3e'),
      teal: makeMat('#2b9ca2'),
      blue: makeMat('#216d9e'),
      blueLight: makeMat('#52a9c6'),
      paleBlue: makeMat('#89c8d5'),
      wood: makeMat('#805133'),
      woodLight: makeMat('#aa7442'),
      woodDark: makeMat('#503729'),
      roof: makeMat('#536363'),
      roofDark: makeMat('#35494e'),
      cream: makeMat('#f3e2ba'),
      offWhite: makeMat('#fff3cf'),
      copper: makeMat('#b86f3f', { metalness: 0.55, roughness: 0.43 }),
      copperDark: makeMat('#7f4429', { metalness: 0.45, roughness: 0.5 }),
      clay: makeMat('#b86f4a'),
      rug: makeMat('#c89d55'),
      leaf: makeMat('#387d45'),
      leafLight: makeMat('#65a94f'),
      coconut: makeMat('#6e472b'),
      water: makeMat('#3bb9bd', { roughness: 0.24, metalness: 0.05 }),
      foam: makeMat('#d8ffff', { roughness: 0.28 }),
      dark: makeMat('#29343a'),
      glazing: makeMat('#46b7c7', { roughness: 0.2, metalness: 0.12 }),
      glazingLight: makeMat('#75d5d8', { roughness: 0.18, metalness: 0.1 })
    };

    // -------------------------------------------------------------------------
    // Utility geometry
    // -------------------------------------------------------------------------

    const asset = new THREE.Group();
    asset.name = 'Vibrant_Babylonian_Marketplace';
    scene.add(asset);

    function addMesh(parent, geometry, mat, pos, rot, scale, name) { const mesh = new THREE.Mesh(geometry, mat); if (pos) mesh.position.set(...pos); if (rot) mesh.rotation.set(...rot); if (scale) mesh.scale.set(...scale); if (name) mesh.name=name; mesh.castShadow = true; mesh.receiveShadow = true; parent.add(mesh); return mesh; }

    const unit = { m: 1, g: 1, y: 1 };

    function box(parent, size, pos, mat, rot=[0,0,0], name='') { return addMesh(parent, new THREE.BoxGeometry(...size), mat, pos, rot, null, name);}
    function cyl(parent, r1, r2, h, seg, pos, mat, rot=[0,0,0], name='') { return addMesh(parent, new THREE.CylinderGeometry(r1, r2, h, seg), mat, pos, rot, null, name);}
    function sphere(parent, r, pos, mat, scale=[1,1,1], name='') { return addMesh(parent, new THREE.IcosahedronGeometry(r, 1), mat, pos, null, scale, name);}
    function polyhedron(parent, data, pos, mat, scale=[1,1,1], name='') { return addMesh(parent, new THREE.BufferGeometry(), mat, pos, null, scale, name);}
    function line(parent, points, mat, thickness = 0.055, name = '') { const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p))); const geo = new THREE.TubeGeometry(curve, 48, thickness, 5, false); return addMesh(parent, geo, mat, null, null, null, name);}

    function group(parent, pos, name) { const g = new THREE.Group(); if (pos) g.position.set(...pos); if (name) g.name=name; parent.add(g); return g; }

    function arch(parent, radius, length, segments, pos, mat) { const pts = []; for i 0..segments: t = i/segments; x = -length/2 + length * t; y = Math.sin(t * Math.PI) * radius + 0.16; pts.push([x,y,0]); const geo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), segments, 0.075, 5, false); return addMesh(parent, geo, mat, pos, null, null); }

    function makeTextTexture(text) { const c = document.createElement('canvas'); c.width=512;c.height=128; ctx=...; draw sign-colored stylized text; return new THREE.CanvasTexture(c); }

    function addAwning(parent, pos, colorA, colorB, angle = -0.18, width = 2.4) {
      const aw = group(parent, pos, 'Textile_Awning');
      const w = makeTextTexture(colorA + colorB).texture;
      const mat = new THREE.MeshStandardMaterial({ map: w, roughness: 0.9, side: THREE.DoubleSide });
      const canopy = box(aw, [width, 0.08, 1.55], [0, 0, 0], mat);
      canopy.rotation.x = angle;
      const top = box(aw, [width, 0.055, 0.16], [0, 0.08, 0.72], mats.cream);
      top.rotation.x = angle;
      const side = new THREE.Mesh(new THREE.PlaneGeometry(width, 0.95), mat); side.position.set(width * 0.5, 0, -0.65); side.rotation.set(angle, 0, 0); side.castShadow = true; aw.add(side);
      for (const x of [-width * 0.38, width * 0.38]) { box(aw, [0.09, 0.88, 0.09], [x, -0.38, 0], mats.woodDark); const tie = cylinder(aw, 0.025, 0.025, 1.05, 6, [x, 0.02, 0], mats.cream); tie.rotation.z = -angle; }
      return aw;
    }

    // -------------------------------------------------------------------------
    // Ground base, river and wetlands
    // -------------------------------------------------------------------------

    const base = group(asset, [0, 0, 0], 'Terrain_Base');

    addMesh(base, new THREE.CylinderGeometry(10.5, 11.2, 0.65, 12), mats.earthDark, [0, -0.37, 0], null, null, 'Low_Poly_Earth_Base');

    // Uneven, stepped plateau pieces.
    for (let i = 0; i < 34; i++) { const a = i * 1.83; const r = 3.7 + (i % 6) * 0.72; const x = Math.cos(a) * r; const z = Math.sin(a) * r; const h = 0.03 + (i % 4) * 0.035; addMesh(base, new THREE.CylinderGeometry(0.48 + (i % 3) * 0.1, 0.58 + (i % 3) * 0.08, h, 6), i % 2 ? mats.earth : mats.earthLight, [x, h / 2 - 0.34, z], [0, i * 0.47, 0], null, `Platedau_Platform_${i}`); }

    // Winding turquoise river, visually continuous with animated surface strips.
    const river = group(asset, [0, 0, 0], 'Turquoise_River');
    const riverPoly = new THREE.Shape();
    riverPoly.moveTo(-21, -14); lineTo(19, -13); lineTo(20, 9); lineTo(12, 14); lineTo(-15, 13); lineTo(-20, 6); closePath();
    const riverGeo = new THREE.ShapeGeometry(riverPoly, 1); rotateX(-Math.PI / 2); addMesh(river, riverGeo, mats.water, [0, -0.02, 0], null, null, 'Water_Surface');

    // River stones and shallow shoals.
    for (let i = 0; i < 42; i++) { const a = i * 2.399; const r = 2.2 + (i % 6) * 0.82; const x = Math.cos(a) * r; const z = Math.sin(a) * r * 0.72 - 0.2; addMesh(river, new THREE.DodecahedronGeometry(0.12 + (i % 3) * 0.06, 0), mats.cream, [x, -0.16 + (i % 3) * 0.015, z], [a, a * 0.4, a * 0.2], null, `River_Stone_${i}`); }

    // Shallow water fan strips.
    for (let i = 0; i < 30; i++) { const angle = i / 30 * Math.PI * 2; const r1 = 3.4 + (i % 4) * 0.55; const r2 = 7.5 + (i % 7) * 0.85; addMesh(river, new THREE.CircleGeometry(0.5 + (i % 3) * 0.11, 7), i % 2 ? mats.foam : mats.water, [Math.cos(angle) * (r1 + r2) / 2, -0.005, Math.sin(angle) * (r1 + r2) / 2], [angle, 0, 0], null, `Water_Fan_${i}`); }

    // Shore reeds and mud clumps.
    for (let i = 0; i < 32; i++) { const angle = (i + 7) * 0.18; const r = 8.5 + (i % 5) * 0.8; x = Math.cos(angle) * r; z = Math.sin(angle) * r * 0.72; group(base, [x, -0.22, z], `Reed_Clamp_${i}`); for (let j = 0; j < 3; j++) { const blade = box(g, [0.045, 0.75 + j * 0.16, 0.045], [j * 0.06, 0.38, j * 0.04], mats.leaf); blade.rotation.z = (j - 1) * 0.22; } if (i % 2) cylinder(g, 0.025, 0.035, 0.32, 5, [0, 0.65, 0], mats.coconut); } }

    // -------------------------------------------------------------------------
    // Main town and architecture
    // -------------------------------------------------------------------------

    const town = group(asset, [-0.8, 0, 0], 'Ancient_Market_Town');

    // Foundation.
    addMesh(town, new THREE.CylinderGeometry(5.7, 6.1, 0.45, 10), mats.earthDark, [0, -0.18, 0], null, null, 'Town_Foundation');

    for (let i = 0; i < 38; i++) { const a = i * 2.399; const r = 1.8 + (i % 4) * 0.95; x = Math.cos(a) * r; z = Math.sin(a) * r; addMesh(town, new THREE.BoxGeometry(0.62, 0.08, 0.48 + (i % 2) * 0.1), mats.earthLight, [x, -0.02, z], [0, a, 0], null, `Masonry_Patch_${i}`); }

    // North wall segment.
    for (let i = 0; i < 6; i++) { addMesh(town, new THREE.BoxGeometry(1.05, 1.4, 0.5), i % 2 ? mats.warm : mats.ochre, [-3.6 + i, 0.98, 3.7], [0, 0, 0], null, `North_Wall_Block_${i}`); }
    addMesh(town, new THREE.BoxGeometry(7.5, 0.45, 0.72), mats.redOchre, [0, 1.72, 3.7], null, null, 'North_Wall_Cap');
    for (const x of [-3.4, 3.4]) addMesh(town, new THREE.CylinderGeometry(0.28, 0.32, 0.2, 8), mats.copper, [x, 2.0, 3.7], null, null, 'Wall_Turret');

    // Central market stall.
    const market = group(town, [0.4, 0.05, 0.8], 'Market_Stall');
    box(market, [3.5, 0.22, 1.8], [0, 1.72, 0], mats.wood);
    for (const x of [-1.35, 1.35]) { for (const z of [-0.62, 0.62]) box(market, [0.16, 1.75, 0.16], [x, 0.9, z], mats.woodDark); }
    const stallRoof = addMesh(market, new THREE.BoxGeometry(3.9, 0.16, 2.25), mats.redOchre, [0, 1.95, 0], null, null, 'Stall_Roof');
    stallRoof.rotation.z = -0.04;
    addMesh(market, new THREE.BoxGeometry(3.95, 0.11, 0.13), mats.copper, [0, 1.85, 1.1], null, null, 'Stall_Beam');
    addAwning(town, [-2.6, 2.95, 1.25], '#b85e42', '#f0cf8b', 0.13, 2.15);
    addAwning(town, [2.7, 3.0, 0.65], '#247d91', '#f2dfb3', -0.11, 1.9);
    addAwning(town, [-0.3, 2.88, 3.08], '#d9a13a', '#fff0bd', -0.24, 2.4);

    // Market goods: baskets, pottery and sacks.
    function makeBasket(parent, pos, scale = 1) { const b = group(parent, pos, 'Woven_Basket'); b.scale.setScalar(scale); for (let i = 0; i < 5; i++) const a = i / 5 * Math.PI * 2; addMesh(b, new THREE.CylinderGeometry(0.25, 0.2, 0.22, 6), mats.woodLight, [Math.cos(a) * 0.15, 0.11, Math.sin(a) * 0.15], null, null, `Basket_Rim_${i}`); addMesh(b, new THREE.TorusGeometry(0.23, 0.035, 4, 8), mats.woodDark, [0, 0.23, 0], [Math.PI / 2, 0, 0], null, 'Basket_Lid'); return b; }
    function makePot(parent, pos, scale = 1) { const p = group(parent, pos, 'Glazed_Pottery'); p.scale.setScalar(scale); addMesh(p, new THREE.LatheGeometry([new THREE.Vector2(0, 0), new THREE.Vector2(0.18, 0.02), new THREE.Vector2(0.28, 0.25), new THREE.Vector2(0.22, 0.42), new THREE.Vector2(0.11, 0.48), new THREE.Vector2(0.12, 0.55), new THREE.Vector2(0, 0.55)]), mats.blue); return p; }
    function makeSack(parent, pos) { const s = group(parent, pos, 'Grain_Sack'); addMesh(s, new THREE.SphereGeometry(0.48, 7, 5), mats.cream, [0, 0.43, 0], [0, 0, 0], [0.8, 1.1, 0.8], 'Sack_Body'); addMesh(s, new THREE.CylinderGeometry(0.12, 0.22, 0.25, 6), mats.woodLight, [0, 0.88, 0], null, null, 'Sack_Tie'); addMesh(s, new THREE.SphereGeometry(0.11, 6, 4), mats.cream, [0, 1.02, 0], null, null, 'Sack_Seal'); return s; }

    makeBasket(town, [-1.85, 1.85, 1.18], 0.95); makeBasket(town, [-1.25, 1.85, 1.43], 0.72);
    makePot(town, [1.12, 1.84, 0.48], 0.85); makePot(town, [1.72, 1.84, 0.93], 0.64);
    makePot(town, [1.98, 1.84, 0.23], 0.52); makeSack(town, [0.2, 1.85, 1.62]); makeSack(town, [1.42, 1.84, 1.58]);
    makeSack(town, [-2.2, 1.85, 0.35], 0.85);

    // Copper plates and goods on a low crate.
    const crate = group(town, [2.1, 0.35, 2.45], 'Copper_Goods_Crate'); box(crate, [1.4, 0.18, 1.15], [0, 0.1, 0], mats.woodLight); for (let i = 0; i < 4; i++) addMesh(crate, new THREE.CylinderGeometry(0.12, 0.12, 0.055, 8), i % 2 ? mats.copper : mats.copperDark, [-0.38 + i * 0.25, 0.23, -0.25 + Math.floor(i / 2) * 0.5], null, null, `Copper_Plate_${i}`); addMesh(crate, new THREE.BoxGeometry(0.55, 0.07, 0.35), mats.copperDark, [0.34, 0.25, 0.08], null, null, 'Copper_Ingot');

    // -------------------------------------------------------------------------
    // Stepped roofs and date palms
    // -------------------------------------------------------------------------

    function makeSteppedRoof(parent, pos, width, depth) { const s = group(parent, pos, 'Stepped_Roof'); addMesh(s, new THREE.BoxGeometry(width, 0.18, depth), mats.roof, [0, 0, 0], null, null, 'Main_Roof'); addMesh(s, new THREE.BoxGeometry(width * 0.68, 0.18, depth * 0.66), mats.roofDark, [0, 0.19, 0], null, null, 'Upper_Roof'); addMesh(s, new THREE.BoxGeometry(width * 0.45, 0.15, depth * 0.42), mats.roof, [0, 0.37, 0], null, null, 'Crown_Roof'); addMesh(s, new THREE.BoxGeometry(width * 0.22, 0.1, depth * 0.12), mats.copper, [0, 0.5, 0], null, null, 'Crown_Finial'); return s; }

    const roof1 = makeSteppedRoof(town, [-2.95, 2.15, -2.1], 2.9, 2.6); roof1.rotation.y = 0.1;
    const roof2 = makeSteppedRoof(town, [1.95, 2.2, -2.95], 2.75, 2.5); roof2.rotation.y = -0.18;

    function makeDatePalms(parent, positions, scale = 1) { const p = group(parent, positions[0], 'Date_Palms'); p.scale.setScalar(scale); for (const [x,z,lean] of positions) { const palm = group(p, [x, 0, z], 'Date_Palm'); const trunk = addMesh(palm, new THREE.CylinderGeometry(0.16, 0.28, 4.2, 7), mats.wood, [0, 2.1, 0], [0, 0, lean[0] * 0.08], null, 'Curved_Trunk'); trunk.rotation.z = lean[0]; trunk.rotation.x = lean[1]; for (let i = 0; i < 7; i++) { const y = 0.75 + i * 0.48; const angle = i * 2.399; addMesh(palm, new THREE.CylinderGeometry(0.045, 0.07, 0.72, 5), mats.wood, [Math.cos(angle) * 0.22, y, Math.sin(angle) * 0.22], [Math.sin(angle) * 0.45, 0, -Math.cos(angle) * 0.45], null, 'Coconut_Grain'); addMesh(palm, new THREE.ConeGeometry(0.25, 0.62, 7), mats.leaf, [Math.cos(angle) * 0.52, y + 0.72, Math.sin(angle) * 0.52], [0, angle, 0], null, 'Frond'); } addMesh(palm, new THREE.SphereGeometry(0.22, 7, 5), mats.coconut, [lean[0] * 0.8, 4.4 + lean[1], lean[2] * 0.8], null, null, 'Top_Cluster'); return p; }

    makeDatePalms(asset, [[-6.2, 0.65, -3.2, 0.12], [-5.8, 0.65, -3.9, -0.1], [5.6, 0.65, 3.45, -0.12], [6.15, 0.65, 3.0, 0.1]], 0.9);
    makeSteppedRoof(asset, [-5.35, 3.8, -3.45], 1.95, 1.6); makeSteppedRoof(asset, [5.35, 3.8, 3.15], 1.85, 1.55);

    // -------------------------------------------------------------------------
    // Blue-glazed gateway
    // -------------------------------------------------------------------------

    const gateway = group(asset, [-3.8, 0, 3.75], 'Blue_Glazed_Gateway');
    for (const x of [-1.25, 1.25]) box(gateway, [0.28, 2.7, 0.3], [x, 1.35, 0], mats.woodDark);
    const gate = addMesh(gateway, new THREE.BoxGeometry(2.5, 2.35, 0.12), mats.glazing, [0, 1.38, 0], null, null, 'Glazed_Gateway');
    addMesh(gateway, new THREE.BoxGeometry(2.85, 0.15, 0.34), mats.blue, [0, 2.62, 0], null, null, 'Gate_Cap');
    addMesh(gateway, new THREE.BoxGeometry(2.85, 0.25, 0.22), mats.copper, [0, 0.08, 0], null, null, 'Gate_Base');
    for (const x of [-1.25, 1.25]) box(gateway, [0.1, 0.1, 0.42], [x, 0.1, 0], mats.copper);
    addMesh(gateway, new THREE.BoxGeometry(0.11, 2.42, 0.11), mats.copper, [0, 1.35, 0.09], null, null, 'Gate_Clamp');
    addMesh(gateway, new THREE.BoxGeometry(0.25, 0.25, 0.06), mats.copper, [0.73, 1.35, 0.11], null, null, 'Gate_Handle');
    makeAwning(asset, [-3.8, 3.3, 3.05], '#2c9eb1', '#fff0bd', -0.17, 2.15);

    // -------------------------------------------------------------------------
    // Arched canal bridge
    // -------------------------------------------------------------------------

    const bridge = group(asset, [4.4, 0, -1.8], 'Arched_Canal_Bridge');
    for (const x of [-1.55, 1.55]) box(bridge, [0.36, 1.6, 0.58], [x, 0.8, 0], mats.woodDark);
    arch(bridge, 1.38, 3.0, 16, [0, 0.8, 0], mats.woodLight);
    addMesh(bridge, new THREE.BoxGeometry(3.45, 0.18, 0.7), mats.wood, [0, 1.65, 0], null, null, 'Bridge_Deck');
    addMesh(bridge, new THREE.BoxGeometry(3.55, 0.18, 0.13), mats.copper, [0, 0.16, 0.38], null, null, 'Bridge_Railing_Front');
    for (const x of [-1.55, 1.55]) box(bridge, [0.12, 1.6, 0.12], [x, 0.8, 0.39], mats.copper);
    addMesh(bridge, new THREE.BoxGeometry(3.6, 0.1, 0.16), mats.copper, [0, 1.65, 0.39], null, null, 'Bridge_Upper_Rail');
    for (let i = 0; i < 8; i++) addMesh(bridge, new THREE.BoxGeometry(0.38, 0.065, 0.06), mats.cream, [ -1.35 + i, 1.68, 0.49], null, null, `Bridge_Pillar_${i}`);

    // -------------------------------------------------------------------------
    // Courtyard tiles, shrubs, tiny details
    // -------------------------------------------------------------------------

    const courtyard = group(asset, [0.35, 0, 0.05], 'Shaded_Courtyard');

    addMesh(courtyard, new THREE.BoxGeometry(4.2, 0.08, 2.45), mats.cream, [0, 0.03, 0], null, null, 'Courtyard_Floor');
    for (let i = 0; i < 38; i++) { const a = i * 2.399; const x = -1.9 + (i % 10) * 0.4; const z = -1.05 + Math.floor(i / 10) * 0.63; addMesh(courtyard, new THREE.BoxGeometry(0.35, 0.025, 0.36), i % 2 ? mats.teal : mats.paleBlue, [x, 0.085, z], [0, a, 0], null, `Tile_${i}`); }

    const shrubPositions = [
      [-3.55, 0.2, -0.2, 0.24], [ -1.95, 0.2, 1.08, 0.18],
      [2.35, 0.2, -0.75, 0.24], [3.35, 0.2, 0.85, 0.19],
      [-4.45, 0.2, -1.4, 0.2], [4.45, 0.2, -1.15, 0.22]
    ];
    shrubPositions.forEach(([x, y, z, s], i) => { const shrub = group(courtyard, [x, y, z], `Shrub_${i}`); shrub.scale.setScalar(s); for (let j = 0; j < 5; j++) { addMesh(shrub, new THREE.IcosahedronGeometry(0.22 + (j % 2) * 0.06, 0), j % 2 ? mats.leaf : mats.leafLight, [(j % 3 - 1) * 0.1, 0.24 + (j % 2) * 0.08, (j % 3 - 1) * 0.08], null, null, `Foliage_${i}_${j}`); } });

    // Market awning edge lanterns.
    const lanternMat = makeMat('#ffd477', { emissive: '#9a5a16', emissiveIntensity: 0.25 });
    for (const [x, y, z] of [[-2.15, 3.05, 1.3], [2.15, 3.05, 0.83], [-4.15, 2.4, 2.65], [4.05, 2.4, 2.45]]) { cylinder(asset, 0.035, 0.035, 0.25, 6, [x, y, z], mats.dark); cylinder(asset, 0.11, 0.1, 0.22, 6, [x, y + 0.14, z], lanternMat); addMesh(asset, new THREE.SphereGeometry(0.075, 6, 4), mats.dark, [x, y + 0.29, z], null, null, 'Lantern_Cap'); }

    // -------------------------------------------------------------------------
    // Small stepped temple in the distance
    // -------------------------------------------------------------------------

    const temple = group(asset, [0.3, 0, -7.05], 'Distant_Stepped_Temple');
    addMesh(temple, new THREE.CylinderGeometry(1.45, 1.65, 0.24, 8), mats.earthDark, [0, -0.08, 0], null, null, 'Temple_Base');
    addMesh(temple, new THREE.CylinderGeometry(1.15, 1.32, 0.35, 8), mats.ochre, [0, 0.24, 0], null, null, 'Temple_Lower_Step');
    addMesh(temple, new THREE.CylinderGeometry(0.82, 1.02, 0.36, 8), mats.warm, [0, 0.59, 0], null, null, 'Temple_Upper_Step');
    addMesh(temple, new THREE.CylinderGeometry(0.63, 0.76, 0.28, 8), mats.blue, [0, 0.83, 0], null, null, 'Temple_Facade');
    addMesh(temple, new THREE.CylinderGeometry(0.13, 0.13, 1.2, 8), mats.copper, [0, 1.52, 0], null, null, 'Temple_Spire');
    for (const y of [0.6, 1.08]) addMesh(temple, new THREE.BoxGeometry(0.7, 0.12, 0.18), mats.cream, [0, y, 0], null, null, 'Temple_Inlay');
    for (const y of [0.6, 1.08]) addMesh(temple, new THREE.BoxGeometry(0.18, 0.12, 0.6), mats.cream, [0, y, 0], null, null, 'Temple_Inlay_2');

    // -------------------------------------------------------------------------
    // Market activity: villagers walking, trading and gesturing
    // -------------------------------------------------------------------------

    const people = [];

    const makeVillage = (x, z, color, vest, scale = 1) => { const v = group(asset, [x, 0, z], 'Village_Invitor'); v.scale.setScalar(scale); const body = addMesh(v, new THREE.BoxGeometry(0.38, 0.75, 0.28), color, [0, 0.4, 0], null, null, 'Person_Body'); addMesh(v, new THREE.BoxGeometry(0.27, 0.5, 0.13), vest, [0, 0.48, 0.02], null, null, 'Vest'); addMesh(v, new THREE.BoxGeometry(0.3, 0.18, 0.28), mats.dark, [0, 0.02, 0], null, null, 'Shadow'); const head = addMesh(v, new THREE.SphereGeometry(0.22, 7, 5), mats.cream, [0, 0.91, 0], null, null, 'Head'); addMesh(v, new THREE.BoxGeometry(0.27, 0.08, 0.08), mats.dark, [0, 0.95, 0.2], null, null, 'Face'); const armMat = makeMat(vest + '#e8d4ad'); for (const side of [-1, 1]) addMesh(v, new THREE.BoxGeometry(0.09, 0.48, 0.09), armMat, [side * 0.25, 0.62, 0], [0, 0, side * 0.12], null, 'Arm'); addMesh(v, new THREE.BoxGeometry(0.13, 0.28, 0.12), mats.dark, [side * 0.27, 0.36, 0], null, null, 'Hand'); return v; }

    makeVillage(-4.65, 0.9, '#b9d2cf', '#6f4633', 0.92);
    makeVillage(-4.25, 1.75, '#c9793f', '#476d8b', 0.82);
    makeVillage(4.4, 0.55, '#d7a965', '#526e82', 0.9);
    makeVillage(4.55, 1.45, '#658d9a', '#b9783f', 0.78);
    makeVillage(-1.35, 4.55, '#7c5b40', '#c94f3b', 0.83);
    makeVillage(2.35, 4.2, '#71513b', '#315b88', 0.86);

    // Walkers arrive at the market.
    const walk1 = makeVillage(-2.45, 2.75, '#5b7f62', '#8b4e31', 0.84);
    walk1.rotation.y = -0.18;
    walk1.position.y = 0.08;
    people.push(walk1);

    const walk2 = makeVillage(3.55, 2.55, '#a87d52', '#654837', 0.78);
    walk2.rotation.y = 0.2;
    walk2.position.y = 0.08;
    people.push(walk2);

    // Cross the bridge and arrive at the temple.
    const bridgeWalk = makeVillage(4.25, -1.7, '#71908a', '#b16b3f', 0.82);
    bridgeWalk.rotation.y = Math.PI;
    bridgeWalk.position.y = 0.1;
    people.push(bridgeWalk);

    const templeWalk = makeVillage(-3.8, -6.75, '#6f8d7d', '#714634', 0.72);
    templeWalk.rotation.y = Math.PI;
    templeWalk.position.y = 0.1;
    people.push(templeWalk);

    function animateWalking(target, phase, speed, direction) { target.position.y = 0.08 + Math.sin(elapsed * speed + phase) * 0.025; target.rotation.y = direction + Math.sin(elapsed * speed * 0.5 + phase) * 0.045; }
    animateWalking(people[0], 0.3, 0.72, -1);
    animateWalking(people[1], 1.7, 0.55, 1);
    animateWalking(people[2], 3.1, 0.65, 1);
    animateWalking(people[3], 4.4, 0.74, -1);

    // A merchant pauses to take cloth or copper from a customer.
    const trade = group(asset, [1.55, 0, 2.2], 'Market_Trade');
    addMesh(trade, new THREE.BoxGeometry(0.5, 0.78, 0.34), mats.redOchre, [0, 0.4, 0], null, null, 'Merchant');
    addMesh(trade, new THREE.BoxGeometry(0.28, 0.035, 0.3), mats.blueLight, [0, 0.81, 0], null, null, 'Merchant_Goal');
    const customer = makeVillage(2.3, 2.0, '#b87349', '#476b87', 0.72); customer.rotation.y = -1.15; customer.position.y = 0.08; trade.add(customer);
    addMesh(Trade, new THREE.BoxGeometry(0.48, 0.12, 0.07), mats.copper, [0.12, 0.72, 0], null, null, 'Traded_Cloth');
    addMesh(trade, new THREE.BoxGeometry(0.29, 0.04, 0.26), mats.blueLight, [0, 0.82, 0], null, null, 'Other_Goal');

    // A hand gesture at a stall.
    const gesture = group(asset, [-0.95, 0, 1.9], 'Market_Gesture');
    addMesh(gesture, new THREE.BoxGeometry(0.55, 0.45, 0.28), mats.ochre, [0, 0.58, 0], null, null, 'Gesturing_Merchant');
    addMesh(gesture, new THREE.BoxGeometry(0.28, 0.045, 0.18), mats.cream, [0, 0.84, 0], null, null, 'Gestured_Opening');
    const palm = addMesh(gesture, new THREE.SphereGeometry(0.13, 7, 5), mats.cream, [0.18, 0.9, 0.08], null, null, 'Gesture_Palm');
    palm.scale.set(1, 1.15, 0.7);

    // -------------------------------------------------------------------------
    // Animated water, clouds, fabric and palms
    // -------------------------------------------------------------------------

    const animatedObjects = [];
    const surfaceMaterials = [mats.water, mats.foam];

    for (let i = 0; i < 42; i++) { const mesh = asset.getObjectByName(`Water_Fan_${i}`); if (mesh) { mesh.material.side = THREE.DoubleSide; mesh.userData.base = mesh.position.clone(); mesh.userData.phase = i * 0.73; animatedObjects.push(mesh); } }

    const cloudMaterial = makeMat('#f2f0dc', { roughness: 1 });
    for (let i = 0; i < 7; i++) { const cloud = group(asset, [ -9 + i * 2.3, 7.5 + (i % 3) * 1.2, -5 - (i % 4) * 1.55], `Cloud_${i}`); for (let j = 0; j < 4; j++) addMesh(cloud, new THREE.IcosahedronGeometry(0.55 + (j % 2) * 0.22, 1), cloudMaterial, [(j - 1.5) * 0.58, (j % 2) * 0.18, 0], null, null, `Cloud_Puff_${i}_${j}`); cloud.userData.phase = i * 0.91; animatedObjects.push(cloud); }

    const swayObjects = [];
    for (let i = 0; i < 15; i++) { const a = i / 15 * Math.PI * 2; const x = -7 + i * 1.72; const z = -4.5 + Math.sin(i * 1.8) * 2.6; group(asset, [x, 0, z], `Swaying_Cloth_${i}`); addMesh(group, new THREE.BoxGeometry(0.75, 1.5 + (i % 3) * 0.28, 0.035), i % 2 ? mats.teal : mats.paleBlue, [0, 0.75, 0], [0, a, 0], null, `Cloth_${i}`); const pivot = group(group, [0, 0.8, 0], `Cloth_Pivot_${i}`); addMesh(pivot, new THREE.BoxGeometry(0.025, 1.2, 0.055), mats.cream, [0, 0, 0], null, null, `Cloth_Stripe_${i}`); swayObjects.push(group); }

    for (let i = 0; i < 14; i++) { const mesh = asset.getObjectByName(`Frond_${i}`); if (mesh) { mesh.userData.phase = i * 0.61; animatedObjects.push(mesh); } }

    const animatedWater = asset.getObjectByName('Ribbon_Flow');
    if (animatedWater) { animatedWater.material.side = THREE.DoubleSide; animatedObjects.push(animatedWater); }

    animatedObjects.forEach(obj => { if (obj.material) obj.material.side = THREE.DoubleSide; });

    // -------------------------------------------------------------------------
    // Animation loop and export
    // -------------------------------------------------------------------------

    const clock = new THREE.Clock();
    const duration = 8;
    let elapsed = 0;

    function animate() { const dt = Math.min(clock.getDelta(), 0.05); elapsed += dt; requestAnimationFrame(animate); for (const o of animatedObjects) { const t = (elapsed + o.userData.phase) % duration; const wind = Math.sin(t / duration * Math.PI * 2); const flap = Math.sin(t / duration * Math.PI * 4 + o.userData.phase) * 0.012; if (o.userData.flap) o.rotation.z += wind * (o.userData.flap ?? 0.018) + flap; if (o.userData.spin) o.rotation.y += wind * 0.035; if (o.userData.phase && o.userData.base) o.position.x += Math.sin(t / duration * Math.PI * 2 + o.userData.phase) * 0.08; } controls.update(); renderer.render(scene, camera);}
    requestAnimationFrame(animate);

    const exportBtn = document.getElementById('exportBtn'); const status = document.getElementById('status'); let exporting = false;
    exportBtn.addEventListener('click', () => { if (exporting) return; exporting = true; exportBtn.disabled = true; exportBtn.textContent = 'Exporting…'; showStatus('Packing geometry, materials and looping animation…'); });
    function showStatus(msg) { status.textContent = msg; status.classList.add('show'); clearTimeout(showStatus.timer); showStatus.timer = setTimeout(() => status.classList.remove('show'), 2400); }
    exporting = false; exportBtn.disabled = false; exportBtn.textContent = 'Export animated GLB';

    exportBtn.addEventListener('click', async () => {
      if (exporting) return;
      exporting = true;
      exportBtn.disabled = true;
      exportBtn.textContent = 'Exporting…';

      try {
        await new Promise(r => setTimeout(r, 30));
        const exporter = new GLTFExporter();
        const animations = exporter.parse(asset, (result) => { const blob = new Blob([result], { type: 'model/gltf-binary' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'vibrant_babylonian_marketplace.glb'; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1500); status.textContent = 'Exported animated GLB'; status.classList.add('show'); setTimeout(() => status.classList.remove('show'), 1800); showStatus(new Date).replace(/\s/g, ' • ' + '•');
      } catch (e) { console.error(e); status.textContent = 'Export failed — see console for details'; showStatus(new Date).replace(/\s/g, ' • ' + '•'); }
      finally { exporting = false; exportBtn.disabled = false; exportBtn.textContent = 'Export animated GLB'; }
    });

    window.addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); });
  </script>
</body>
</html>
