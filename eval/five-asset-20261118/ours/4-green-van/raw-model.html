<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Low-Poly Green Van</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #d9e1dc;
    }

    #viewport {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .panel {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      width: min(360px, calc(100vw - 40px));
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      color: #f7faf8;
      background: rgba(17, 28, 24, 0.84);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 5px;
      font-size: 19px;
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 0 0 15px;
      color: #bdc9c2;
      font-size: 13px;
      line-height: 1.45;
    }

    button {
      width: 100%;
      padding: 11px 14px;
      border: 0;
      border-radius: 9px;
      color: #102014;
      background: #68d36d;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease;
    }

    button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      cursor: wait;
      filter: grayscale(0.5);
    }

    #status {
      min-height: 18px;
      margin-top: 10px;
      color: #b9c8bf;
      font-size: 12px;
    }

    .hint {
      position: fixed;
      right: 18px;
      bottom: 16px;
      z-index: 10;
      padding: 8px 11px;
      border-radius: 8px;
      color: #34443d;
      background: rgba(255, 255, 255, 0.68);
      font-size: 12px;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div id="viewport"></div>

  <section class="panel">
    <h1>Green Van</h1>
    <p class="subtitle">
      Static low-poly vehicle with cargo panels, windows, mirrors, bumpers,
      grille, and detailed wheels.
    </p>
    <button id="exportButton" type="button">Export GLB</button>
    <div id="status">Ready to export.</div>
  </section>

  <div class="hint">Drag to orbit · Scroll to zoom</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

    const viewport = document.getElementById("viewport");
    const exportButton = document.getElementById("exportButton");
    const status = document.getElementById("status");

    // -------------------------------------------------------------------------
    // Renderer, scene, and camera
    // -------------------------------------------------------------------------

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd9e1dc);

    const camera = new THREE.PerspectiveCamera(
      35,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(4.8, 3.25, 5.7);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    viewport.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.25, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 3.5;
    controls.maxDistance = 12;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.update();

    // -------------------------------------------------------------------------
    // Lighting
    // -------------------------------------------------------------------------

    scene.add(new THREE.HemisphereLight(0xf5fff8, 0x65716b, 2.0));

    const keyLight = new THREE.DirectionalLight(0xfff6dc, 3.1);
    keyLight.position.set(4, 7, 5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -5;
    keyLight.shadow.camera.right = 5;
    keyLight.shadow.camera.top = 5;
    keyLight.shadow.camera.bottom = -5;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 20;
    keyLight.shadow.bias = -0.0004;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xb9d8ff, 1.25);
    fillLight.position.set(-5, 3, 2);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xe8ffd0, 1.0);
    rimLight.position.set(0, 4, -5);
    scene.add(rimLight);

    // Presentation ground is intentionally not included in the exported asset.
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({
        color: 0xc9d2cb,
        roughness: 0.95,
        metalness: 0
      })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.02;
    ground.receiveShadow = true;
    scene.add(ground);

    // -------------------------------------------------------------------------
    // Asset materials
    // -------------------------------------------------------------------------

    const materials = {
      green: new THREE.MeshStandardMaterial({
        name: "Van_Green_Paint",
        color: 0x2f963f,
        roughness: 0.46,
        metalness: 0.18,
        flatShading: true
      }),
      greenLight: new THREE.MeshStandardMaterial({
        name: "Van_Green_Panel",
        color: 0x3b9d45,
        roughness: 0.5,
        metalness: 0.12,
        flatShading: true
      }),
      greenDark: new THREE.MeshStandardMaterial({
        name: "Van_Green_Trim",
        color: 0x20662b,
        roughness: 0.58,
        metalness: 0.16,
        flatShading: true
      }),
      rubber: new THREE.MeshStandardMaterial({
        name: "Wheel_Rubber",
        color: 0x171b19,
        roughness: 0.94,
        metalness: 0.02,
        flatShading: true
      }),
      rubberEdge: new THREE.MeshStandardMaterial({
        name: "Wheel_Rubber_Edge",
        color: 0x252a27,
        roughness: 0.88,
        metalness: 0.02,
        flatShading: true
      }),
      darkMetal: new THREE.MeshStandardMaterial({
        name: "Dark_Metal",
        color: 0x29312f,
        roughness: 0.48,
        metalness: 0.62,
        flatShading: true
      }),
      silver: new THREE.MeshStandardMaterial({
        name: "Wheel_Metal",
        color: 0x9ba7a2,
        roughness: 0.32,
        metalness: 0.72,
        flatShading: true
      }),
      glass: new THREE.MeshStandardMaterial({
        name: "Windshield_Glass",
        color: 0x183c4a,
        roughness: 0.22,
        metalness: 0.34,
        emissive: 0x071820,
        emissiveIntensity: 0.25,
        side: THREE.DoubleSide
      }),
      headlight: new THREE.MeshStandardMaterial({
        name: "Headlight",
        color: 0xffe8a8,
        emissive: 0xffcf70,
        emissiveIntensity: 0.25,
        roughness: 0.3,
        metalness: 0.12
      }),
      amber: new THREE.MeshStandardMaterial({
        name: "Amber_Indicator",
        color: 0xffb42f,
        emissive: 0x7a3c00,
        emissiveIntensity: 0.25,
        roughness: 0.35,
        metalness: 0.1
      }),
      tailLight: new THREE.MeshStandardMaterial({
        name: "Tail_Light",
        color: 0xb8232b,
        emissive: 0x5e0506,
        emissiveIntensity: 0.3,
        roughness: 0.38,
        metalness: 0.1
      }),
      plate: new THREE.MeshStandardMaterial({
        name: "License_Plate",
        color: 0xe5e9df,
        roughness: 0.6,
        metalness: 0.05,
        flatShading: true
      })
    };

    // -------------------------------------------------------------------------
    // Model construction helpers
    // Front of the van faces positive Z.
    // -------------------------------------------------------------------------

    const model = new THREE.Group();
    model.name = "GreenVan_Asset";
    scene.add(model);

    function addMesh(geometry, material, position = [0, 0, 0], parent = model) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(...position);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addBox(name, size, position, material, parent = model) {
      const mesh = addMesh(
        new THREE.BoxGeometry(size[0], size[1], size[2]),
        material,
        position,
        parent
      );
      mesh.name = name;
      return mesh;
    }

    function addCylinder(
      name,
      radius,
      length,
      position,
      material,
      radialSegments = 12,
      rotation = [0, 0, 0],
      parent = model
    ) {
      const mesh = addMesh(
        new THREE.CylinderGeometry(radius, radius, length, radialSegments),
        material,
        position,
        parent
      );
      mesh.rotation.set(...rotation);
      mesh.name = name;
      return mesh;
    }

    function addBeamBetween(
      name,
      start,
      end,
      width,
      depth,
      material,
      parent = model
    ) {
      const a = new THREE.Vector3(...start);
      const b = new THREE.Vector3(...end);
      const direction = b.clone().sub(a);
      const length = direction.length();

      const mesh = addMesh(
        new THREE.BoxGeometry(width, length, depth),
        material,
        a.clone().add(b).multiplyScalar(0.5).toArray(),
        parent
      );
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      mesh.name = name;
      return mesh;
    }

    // -------------------------------------------------------------------------
    // Main cargo box
    // -------------------------------------------------------------------------

    addBox(
      "Cargo_Box",
      [1.56, 1.75, 1.55],
      [0, 1.55, -0.52],
      materials.green
    );

    addBox(
      "Cargo_Roof",
      [1.64, 0.14, 1.68],
      [0, 2.47, -0.52],
      materials.greenLight
    );

    addBox(
      "Cargo_Roof_Front_Edge",
      [1.64, 0.12, 0.16],
      [0, 2.48, 0.29],
      materials.greenDark
    );

    // Side cargo doors, panel seams, handles, and steps.
    for (const side of [-1, 1]) {
      const sideName = side < 0 ? "Left" : "Right";

      addBox(
        `${sideName}_Cargo_Door_Panel`,
        [0.025, 1.52, 1.35],
        [side * 0.794, 1.56, -0.54],
        materials.greenLight
      );

      addBox(
        `${sideName}_Cargo_Door_Seam`,
        [0.014, 1.54, 0.026],
        [side * 0.815, 1.56, -0.04],
        materials.greenDark
      );

      addBox(
        `${sideName}_Cargo_Door_Horizontal_Seam`,
        [0.016, 0.026, 1.34],
        [side * 0.815, 1.56, -0.54],
        materials.greenDark
      );

      addBox(
        `${sideName}_Cargo_Door_Handle`,
        [0.045, 0.075, 0.26],
        [side * 0.84, 1.34, -0.05],
        materials.darkMetal
      );

      addBox(
        `${sideName}_Cargo_Door_Lower_Handle`,
        [0.045, 0.055, 0.18],
        [side * 0.84, 1.08, -0.08],
        materials.darkMetal
      );

      addBox(
        `${sideName}_Cargo_Step`,
        [0.1, 0.11, 0.48],
        [side * 0.86, 0.43, -0.62],
        materials.darkMetal
      );

      addBox(
        `${sideName}_Cargo_Step_Lip`,
        [0.12, 0.045, 0.49],
        [side * 0.86, 0.49, -0.62],
        materials.greenDark
      );
    }

    // -------------------------------------------------------------------------
    // Rear cargo doors, bumper, and lights
    // -------------------------------------------------------------------------

    addBox(
      "Rear_Cargo_Door_Panel",
      [1.47, 1.55, 0.025],
      [0, 1.55, -1.308],
      materials.greenLight
    );

    addBox(
      "Rear_Cargo_Door_Center_Seam",
      [0.025, 1.56, 0.025],
      [0, 1.55, -1.333],
      materials.greenDark
    );

    addBox(
      "Rear_Cargo_Door_Horizontal_Seam",
      [1.46, 0.025, 0.025],
      [0, 1.56, -1.333],
      materials.greenDark
    );

    addBox(
      "Rear_Cargo_Door_Handle",
      [0.28, 0.06, 0.045],
      [0, 1.42, -1.36],
      materials.darkMetal
    );

    addBox(
      "Rear_Bumper",
      [1.78, 0.18, 0.19],
      [0, 0.52, -1.43],
      materials.darkMetal
    );

    for (const side of [-1, 1]) {
      addBox(
        `${side < 0 ? "Left" : "Right"}_Tail_Light`,
        [0.22, 0.13, 0.07],
        [side * 0.65, 1.12, -1.36],
        materials.tailLight
      );
    }

    addBox(
      "Rear_License_Plate",
      [0.48, 0.17, 0.025],
      [0, 0.73, -1.38],
      materials.plate
    );

    // -------------------------------------------------------------------------
    // Cab and front body
    // -------------------------------------------------------------------------

    addBox(
      "Cab_Lower_Body",
      [1.55, 1.13, 1.16],
      [0, 1.13, 0.88],
      materials.greenDark
    );

    addBox(
      "Cab_Hood",
      [1.57, 0.38, 1.12],
      [0, 0.91, 0.94],
      materials.green
    );

    addBox(
      "Cab_Roof",
      [1.6, 0.14, 1.22],
      [0, 2.47, 0.92],
      materials.greenLight
    );

    addBox(
      "Cab_Roof_Rear_Edge",
      [1.6, 0.12, 0.15],
      [0, 2.48, 0.34],
      materials.greenDark
    );

    addBox(
      "Cab_Front_Lower_Trim",
      [1.59, 0.12, 0.12],
      [0, 1.11, 1.46],
      materials.greenDark
    );

    // Sloped front windshield.
    const windshieldGeometry = new THREE.BufferGeometry();
    windshieldGeometry.setAttribute(
      "position",
      new THREE.Float32BufferAttribute(
        [
          -0.79, 1.08, 1.47,
           0.79, 1.08, 1.47,
           0.79, 2.38, 0.52,
          -0.79, 2.38, 0.52
        ],
        3
      )
    );
    windshieldGeometry.setIndex([0, 1, 2, 0, 2, 3]);
    windshieldGeometry.computeVertexNormals();

    const windshield = addMesh(
      windshieldGeometry,
      materials.glass,
      [0, 0, 0]
    );
    windshield.name = "Front_Windshield";

    // Windshield frame.
    addBeamBetween(
      "Windshield_Lower_Crossbar",
      [-0.79, 1.08, 1.47],
      [0.79, 1.08, 1.47],
      0.075,
      0.085,
      materials.greenDark
    );

    addBeamBetween(
      "Windshield_Upper_Crossbar",
      [-0.79, 2.38, 0.52],
      [0.79, 2.38, 0.52],
      0.075,
      0.085,
      materials.greenDark
    );

    addBeamBetween(
      "Windshield_Left_Frame",
      [-0.79, 1.08, 1.47],
      [-0.79, 2.38, 0.52],
      0.075,
      0.085,
      materials.greenDark
    );

    addBeamBetween(
      "Windshield_Right_Frame",
      [0.79, 1.08, 1.47],
      [0.79, 2.38, 0.52],
      0.075,
      0.085,
      materials.greenDark
    );

    // Side windows.
    for (const side of [-1, 1]) {
      addBox(
        `${side < 0 ? "Left" : "Right"}_Cab_Side_Window`,
        [0.035, 1.16, 0.77],
        [side * 0.795, 1.73, 0.82],
        materials.glass
      );

      addBox(
        `${side < 0 ? "Left" : "Right"}_Cab_Door_Seam`,
        [0.018, 1.08, 0.025],
        [side * 0.81, 1.68, 0.31],
        materials.greenDark
      );

      addBox(
        `${side < 0 ? "Left" : "Right"}_Cab_Door_Handle`,
        [0.045, 0.07, 0.26],
        [side * 0.84, 1.42, 0.63],
        materials.darkMetal
      );

      // Mirror stalk and housing.
      addBeamBetween(
        `${side < 0 ? "Left" : "Right"}_Mirror_Stalk`,
        [side * 0.76, 1.82, 1.08],
        [side * 1.02, 1.84, 1.08],
        0.035,
        0.035,
        materials.darkMetal
      );

      addBox(
        `${side < 0 ? "Left" : "Right"}_Mirror_Housing`,
        [0.23, 0.3, 0.17],
        [side * 1.05, 1.84, 1.08],
        materials.darkMetal
      );

      addBox(
        `${side < 0 ? "Left" : "Right"}_Mirror_Glass`,
        [0.02, 0.235, 0.12],
        [side * 1.172, 1.84, 1.08],
        materials.glass
      );

      // Small side running board.
      addBox(
        `${side < 0 ? "Left" : "Right"}_Cab_Running_Board`,
        [0.075, 0.1, 0.42],
        [side * 0.84, 0.39, 0.62],
        materials.darkMetal
      );
    }

    // -------------------------------------------------------------------------
    // Hood grille, headlights, and front bumper
    // -------------------------------------------------------------------------

    addBox(
      "Front_Grille_Recess",
      [1.08, 0.29, 0.055],
      [0, 0.91, 1.515],
      materials.darkMetal
    );

    for (let i = 0; i < 6; i++) {
      addBox(
        `Grille_Vertical_Slat_${i + 1}`,
        [0.035, 0.25, 0.035],
        [-0.42 + i * 0.168, 0.91, 1.552],
        materials.silver
      );
    }

    for (const side of [-1, 1]) {
      addBox(
        `${side < 0 ? "Left" : "Right"}_Headlight`,
        [0.28, 0.18, 0.085],
        [side * 0.56, 1.05, 1.535],
        materials.headlight
      );

      addBox(
        `${side < 0 ? "Left" : "Right"}_Amber_Indicator`,
        [0.12, 0.095, 0.07],
        [side * 0.73, 1.08, 1.535],
        materials.amber
      );
    }

    addBox(
      "Front_Bumper",
      [1.78, 0.18, 0.19],
      [0, 0.53, 1.64],
      materials.darkMetal
    );

    for (const side of [-1, 1]) {
      addBox(
        `${side < 0 ? "Left" : "Right"}_Front_Bumper_Corner`,
        [0.2, 0.22, 0.22],
        [side * 0.76, 0.54, 1.65],
        materials.darkMetal
      );
    }

    // Windshield wipers.
    addBeamBetween(
      "Wiper_Left",
      [-0.28, 1.13, 1.485],
      [-0.17, 1.82, 0.72],
      0.025,
      0.025,
      materials.darkMetal
    );

    addBeamBetween(
      "Wiper_Right",
      [0.28, 1.13, 1.485],
      [0.18, 1.8, 0.74],
      0.025,
      0.025,
      materials.darkMetal
    );

    // -------------------------------------------------------------------------
    // Wheels, hubs, and tread blocks
    // -------------------------------------------------------------------------

    function addWheel(side, z, wheelName) {
      const x = side * 0.92;
      const y = 0.63;

      addCylinder(
        `${wheelName}_Tire`,
        0.57,
        0.38,
        [x, y, z],
        materials.rubber,
        12,
        [0, 0, Math.PI / 2]
      );

      addCylinder(
        `${wheelName}_Rim`,
        0.31,
        0.405,
        [x, y, z],
        materials.darkMetal,
        12,
        [0, 0, Math.PI / 2]
      );

      addCylinder(
        `${wheelName}_Hub`,
        0.115,
        0.055,
        [x + side * 0.225, y, z],
        materials.silver,
        10,
        [0, 0, Math.PI / 2]
      );

      // Outer hub cap.
      addCylinder(
        `${wheelName}_Hub_Cap`,
        0.075,
        0.025,
        [x + side * 0.262, y, z],
        materials.darkMetal,
        10,
        [0, 0, Math.PI / 2]
      );

      // Twelve tread blocks around the low-poly tire.
      for (let i = 0; i < 12; i++) {
        const angle = (i / 12) * Math.PI * 2;

        const lug = addBox(
          `${wheelName}_Tread_${i + 1}`,
          [0.39, 0.085, 0.115],
          [
            x,
            y + Math.sin(angle) * 0.565,
            z + Math.cos(angle) * 0.565
          ],
          materials.rubberEdge
        );

        lug.rotation.x = Math.PI / 2 - angle;
      }

      // Upper wheel arch.
      const arch = addMesh(
        new THREE.TorusGeometry(0.65, 0.075, 6, 14, Math.PI),
        materials.greenDark,
        [x, y, z]
      );
      arch.rotation.y = Math.PI / 2;
      arch.name = `${wheelName}_Fender_Arch`;
    }

    for (const side of [-1, 1]) {
      addWheel(side, 0.96, `${side < 0 ? "Left" : "Right"}_Front_Wheel`);
      addWheel(side, -0.96, `${side < 0 ? "Left" : "Right"}_Rear_Wheel`);
    }

    // -------------------------------------------------------------------------
    // Roof rails and roof accessories
    // -------------------------------------------------------------------------

    for (const side of [-1, 1]) {
      addBeamBetween(
        `${side < 0 ? "Left" : "Right"}_Roof_Rail`,
        [side * 0.58, 2.61, -1.22],
        [side * 0.58, 2.61, 0.17],
        0.055,
        0.055,
        materials.darkMetal
      );

      for (const z of [-1.15, 0.08]) {
        addBox(
          `${side < 0 ? "Left" : "Right"}_Roof_Rail_Post_${z}`,
          [0.055, 0.15, 0.055],
          [side * 0.58, 2.56, z],
          materials.darkMetal
        );
      }
    }

    // Small rear cargo light.
    addBox(
      "Rear_Cargo_Light",
      [0.24, 0.11, 0.07],
      [0, 2.38, -1.38],
      materials.tailLight
    );

    // -------------------------------------------------------------------------
    // Export
    // -------------------------------------------------------------------------

    exportButton.addEventListener("click", () => {
      exportButton.disabled = true;
      status.textContent = "Building GLB…";

      const exporter = new GLTFExporter();

      exporter.parse(
        model,
        (result) => {
          const blob = new Blob([result], {
            type: "model/gltf-binary"
          });

          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "green_van.glb";
          document.body.appendChild(link);
          link.click();
          link.remove();

          setTimeout(() => URL.revokeObjectURL(url), 1000);

          status.textContent = "green_van.glb exported successfully.";
          exportButton.disabled = false;
        },
        (error) => {
          console.error(error);
          status.textContent = "Export failed. See the browser console.";
          exportButton.disabled = false;
        },
        {
          binary: true,
          onlyVisible: true,
          trs: false
        }
      );
    });

    // -------------------------------------------------------------------------
    // Resize and render loop
    // -------------------------------------------------------------------------

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
