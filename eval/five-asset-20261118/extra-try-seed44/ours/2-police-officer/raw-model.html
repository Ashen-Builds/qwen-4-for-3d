<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Low Poly Cop</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d141c;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hud {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 10;
      pointer-events: none;
      user-select: none;
    }

    .hud h1 {
      margin: 0 0 5px;
      color: #f2f7ff;
      font-size: 20px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .hud p {
      margin: 0;
      color: #9eb2c7;
      font-size: 12px;
    }

    .actions {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 17px;
      color: #071018;
      background: #f2b74b;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3);
      transition: background 160ms ease, transform 160ms ease;
    }

    button:hover {
      background: #ffd16f;
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
      transform: none;
    }

    #status {
      min-width: 110px;
      color: #b8c9dc;
      font-size: 12px;
      text-align: right;
    }

    @media (max-width: 600px) {
      .hud {
        top: 12px;
        left: 12px;
      }

      .actions {
        right: 12px;
        bottom: 12px;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div id="app"></div>

  <div class="hud">
    <h1>Low Poly Cop</h1>
    <p>Procedural character with shoulder radio</p>
  </div>

  <div class="actions">
    <span id="status">Ready to export</span>
    <button id="exportButton" type="button">Export GLB</button>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

    // -------------------------------------------------------------------------
    // Renderer, scene, camera, and lighting
    // -------------------------------------------------------------------------

    const app = document.getElementById("app");
    const status = document.getElementById("status");
    const exportButton = document.getElementById("exportButton");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d141c);
    scene.fog = new THREE.Fog(0x0d141c, 11, 22);

    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(5.4, 3.6, 7.4);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    app.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.9, 0);
    controls.enableDamping = true;
    controls.minDistance = 4;
    controls.maxDistance = 12;
    controls.maxPolarAngle = Math.PI * 0.52;

    scene.add(new THREE.HemisphereLight(0xb9d8ff, 0x17202a, 2.0));

    const keyLight = new THREE.DirectionalLight(0xffffff, 3.5);
    keyLight.position.set(4, 8, 6);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -5;
    keyLight.shadow.camera.right = 5;
    keyLight.shadow.camera.top = 7;
    keyLight.shadow.camera.bottom = -2;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x558cff, 2.0);
    rimLight.position.set(-5, 4, -4);
    scene.add(rimLight);

    const fillLight = new THREE.PointLight(0xffd69b, 1.3, 12);
    fillLight.position.set(3, 2.5, 4);
    scene.add(fillLight);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({
        color: 0x111b25,
        roughness: 0.95,
        metalness: 0.0
      })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.01;
    ground.receiveShadow = true;
    scene.add(ground);

    // -------------------------------------------------------------------------
    // Materials
    // -------------------------------------------------------------------------

    function makeMaterial(color, options = {}) {
      return new THREE.MeshStandardMaterial({
        color,
        roughness: 0.82,
        metalness: 0.04,
        flatShading: true,
        ...options
      });
    }

    const materials = {
      skin: makeMaterial(0xd79a72),
      skinDark: makeMaterial(0xb97758),
      hair: makeMaterial(0x241916),
      navy: makeMaterial(0x18344b),
      navyDark: makeMaterial(0x10293a),
      shirt: makeMaterial(0x205873),
      shirtDark: makeMaterial(0x173b51),
      pants: makeMaterial(0x172f43),
      leather: makeMaterial(0x20252a),
      boot: makeMaterial(0x11171b),
      sole: makeMaterial(0x0b0f12),
      black: makeMaterial(0x101418),
      radio: makeMaterial(0x252b31),
      gold: makeMaterial(0xe4b34d, {
        metalness: 0.45,
        roughness: 0.42
      }),
      cyan: makeMaterial(0x3dd9ff, {
        emissive: 0x0c7793,
        emissiveIntensity: 1.4,
        roughness: 0.35,
        metalness: 0.15
      }),
      white: makeMaterial(0xe8f3f7, {
        roughness: 0.55
      })
    };

    // -------------------------------------------------------------------------
    // Asset root: this group is the only object exported to GLB
    // -------------------------------------------------------------------------

    const cop = new THREE.Group();
    cop.name = "LowPolyCop";
    scene.add(cop);

    function addMesh(
      geometry,
      material,
      position = [0, 0, 0],
      rotation = [0, 0, 0],
      scale = [1, 1, 1],
      parent = cop
    ) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(...position);
      mesh.rotation.set(...rotation);
      mesh.scale.set(...scale);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addBox(
      width,
      height,
      depth,
      material,
      position = [0, 0, 0],
      rotation = [0, 0, 0],
      parent = cop
    ) {
      return addMesh(
        new THREE.BoxGeometry(width, height, depth),
        material,
        position,
        rotation,
        [1, 1, 1],
        parent
      );
    }

    function addCylinder(
      radiusTop,
      radiusBottom,
      height,
      material,
      position = [0, 0, 0],
      rotation = [0, 0, 0],
      parent = cop,
      segments = 8
    ) {
      return addMesh(
        new THREE.CylinderGeometry(
          radiusTop,
          radiusBottom,
          height,
          segments
        ),
        material,
        position,
        rotation,
        [1, 1, 1],
        parent
      );
    }

    function cylinderBetween(
      start,
      end,
      radiusStart,
      radiusEnd,
      material,
      parent = cop,
      segments = 6
    ) {
      const a = new THREE.Vector3(...start);
      const b = new THREE.Vector3(...end);
      const direction = b.clone().sub(a);
      const length = direction.length();

      const mesh = addMesh(
        new THREE.CylinderGeometry(
          radiusEnd,
          radiusStart,
          length,
          segments
        ),
        material,
        a.clone().add(b).multiplyScalar(0.5).toArray(),
        [0, 0, 0],
        [1, 1, 1],
        parent
      );

      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );

      return mesh;
    }

    // -------------------------------------------------------------------------
    // Head and face
    // -------------------------------------------------------------------------

    addMesh(
      new THREE.CylinderGeometry(0.22, 0.24, 0.28, 8),
      materials.skinDark,
      [0, 3.13, 0]
    );

    addMesh(
      new THREE.SphereGeometry(0.36, 8, 6),
      materials.skin,
      [0, 3.49, 0],
      [0, 0, 0],
      [1, 1.08, 0.9]
    );

    // Low-poly hair cap.
    addMesh(
      new THREE.SphereGeometry(
        0.385,
        8,
        4,
        0,
        Math.PI * 2,
        0,
        1.48
      ),
      materials.hair,
      [0, 3.5, 0]
    );

    addBox(0.12, 0.27, 0.16, materials.hair, [-0.32, 3.43, 0.02]);
    addBox(0.12, 0.27, 0.16, materials.hair, [0.32, 3.43, 0.02]);

    // Ears.
    addMesh(
      new THREE.SphereGeometry(0.095, 6, 4),
      materials.skinDark,
      [-0.35, 3.47, 0],
      [0, 0, 0],
      [0.65, 1, 0.55]
    );
    addMesh(
      new THREE.SphereGeometry(0.095, 6, 4),
      materials.skinDark,
      [0.35, 3.47, 0],
      [0, 0, 0],
      [0.65, 1, 0.55]
    );

    // Eyes.
    for (const x of [-0.12, 0.12]) {
      addMesh(
        new THREE.SphereGeometry(0.034, 6, 4),
        materials.black,
        [x, 3.54, 0.305]
      );
    }

    // Eyebrows.
    addBox(0.105, 0.025, 0.025, materials.hair, [-0.12, 3.61, 0.307]);
    addBox(0.105, 0.025, 0.025, materials.hair, [0.12, 3.61, 0.307]);

    // Nose and mouth.
    addBox(0.075, 0.13, 0.09, materials.skin, [0, 3.47, 0.335]);
    addBox(0.17, 0.027, 0.025, materials.skinDark, [0, 3.37, 0.317]);

    // Hair and cap.
    addMesh(
      new THREE.CylinderGeometry(0.405, 0.43, 0.22, 8),
      materials.navyDark,
      [0, 3.89, 0]
    );

    addMesh(
      new THREE.CylinderGeometry(0.53, 0.53, 0.065, 8),
      materials.navy,
      [0, 3.78, 0]
    );

    addMesh(
      new THREE.CylinderGeometry(0.43, 0.43, 0.045, 8),
      materials.navyDark,
      [0, 3.78, 0]
    );

    addMesh(
      new THREE.CylinderGeometry(0.105, 0.105, 0.025, 8),
      materials.gold,
      [0, 3.89, 0.415],
      [Math.PI / 2, 0, 0]
    );

    // -------------------------------------------------------------------------
    // Torso, belt, pockets, and uniform details
    // -------------------------------------------------------------------------

    addBox(0.88, 0.43, 0.56, materials.pants, [0, 2.22, 0]);
    addBox(0.94, 0.68, 0.58, materials.shirt, [0, 2.81, 0]);

    // Shoulder cap and hem.
    addBox(0.92, 0.12, 0.60, materials.shirtDark, [0, 3.08, 0]);
    addBox(0.86, 0.10, 0.59, materials.shirtDark, [0, 2.43, 0]);

    // Chest pockets.
    for (const x of [-0.26, 0.26]) {
      addBox(0.22, 0.25, 0.055, materials.shirtDark, [x, 2.76, 0.31]);
      addBox(0.19, 0.025, 0.025, materials.gold, [x, 2.79, 0.345]);
    }

    // Radio badge.
    addMesh(
      new THREE.CylinderGeometry(0.105, 0.105, 0.035, 8),
      materials.gold,
      [-0.26, 2.94, 0.34],
      [Math.PI / 2, 0, 0]
    );

    addMesh(
      new THREE.TorusGeometry(0.073, 0.014, 5, 12),
      materials.navyDark,
      [-0.26, 2.94, 0.363]
    );

    // Belt and buckle.
    addBox(0.96, 0.13, 0.61, materials.leather, [0, 2.13, 0]);
    addBox(0.19, 0.17, 0.065, materials.gold, [0, 2.13, 0.33]);
    addBox(0.08, 0.09, 0.025, materials.navyDark, [0, 2.13, 0.373]);

    // Small utility pouch on the belt.
    addBox(0.23, 0.28, 0.17, materials.leather, [-0.47, 1.99, 0.12]);
    addBox(0.25, 0.06, 0.19, materials.navyDark, [-0.47, 2.09, 0.12]);

    // -------------------------------------------------------------------------
    // Legs and boots
    // -------------------------------------------------------------------------

    for (const x of [-0.22, 0.22]) {
      addBox(0.43, 0.82, 0.48, materials.pants, [x, 1.52, 0]);
      addBox(0.27, 0.23, 0.055, materials.navyDark, [x, 1.5, 0.255]);
      addBox(0.25, 0.035, 0.02, materials.gold, [x, 1.5, 0.29]);

      addBox(0.52, 0.28, 0.72, materials.boot, [x, 0.3, 0.12]);
      addBox(0.45, 0.12, 0.66, materials.sole, [x, 0.12, 0.13]);

      // Boot cuff.
      addBox(0.49, 0.08, 0.48, materials.leather, [x, 0.47, 0.04]);
    }

    // -------------------------------------------------------------------------
    // Arms and hands
    // -------------------------------------------------------------------------

    const armData = [
      {
        side: -1,
        shoulder: [-0.48, 3.04, 0],
        elbow: [-0.72, 2.54, 0.02],
        wrist: [-0.82, 2.02, 0.08]
      },
      {
        side: 1,
        shoulder: [0.48, 3.04, 0],
        elbow: [0.72, 2.54, 0.02],
        wrist: [0.82, 2.02, 0.08]
      }
    ];

    for (const arm of armData) {
      cylinderBetween(
        arm.shoulder,
        arm.elbow,
        0.17,
        0.145,
        materials.shirt
      );

      cylinderBetween(
        arm.elbow,
        arm.wrist,
        0.145,
        0.12,
        materials.shirt
      );

      addMesh(
        new THREE.SphereGeometry(0.165, 7, 5),
        materials.shirt,
        arm.shoulder,
        [0, 0, 0],
        [1, 1, 1]
      );

      addMesh(
        new THREE.SphereGeometry(0.135, 7, 5),
        materials.skin,
        arm.wrist,
        [0, 0, 0],
        [0.82, 1.05, 0.72]
      );

      // Small thumb.
      addMesh(
        new THREE.SphereGeometry(0.045, 5, 3),
        materials.skin,
        [
          arm.wrist[0] + arm.side * 0.07,
          arm.wrist[1] + 0.03,
          arm.wrist[2] + 0.035
        ]
      );
    }

    // -------------------------------------------------------------------------
    // Radio and shoulder attachment
    // -------------------------------------------------------------------------

    const radio = new THREE.Group();
    radio.name = "AttachedRadio";
    radio.position.set(0.58, 3.25, 0.29);
    cop.add(radio);

    // Main radio body.
    addBox(0.31, 0.43, 0.18, materials.radio, [0, 0, 0], [0, 0, 0], radio);

    // Speaker grille.
    for (let i = 0; i < 3; i++) {
      addBox(
        0.20,
        0.025,
        0.025,
        materials.black,
        [0, -0.10 + i * 0.055, 0.102],
        [0, 0, 0],
        radio
      );
    }

    // Display and status light.
    addBox(0.18, 0.075, 0.025, materials.black, [0, 0.145, 0.103], [0, 0, 0], radio);
    addBox(0.13, 0.045, 0.018, materials.cyan, [0, 0.145, 0.119], [0, 0, 0], radio);

    // Antenna.
    cylinderBetween(
      [0.03, 0.21, -0.02],
      [0.13, 0.54, -0.02],
      0.018,
      0.012,
      materials.black,
      radio,
      6
    );

    addMesh(
      new THREE.SphereGeometry(0.022, 6, 4),
      materials.black,
      [0.13, 0.55, -0.02],
      [0, 0, 0],
      [1, 1, 1],
      radio
    );

    // Radio power button.
    addMesh(
      new THREE.SphereGeometry(0.026, 6, 4),
      materials.cyan,
      [0.10, 0.145, 0.105],
      [0, 0, 0],
      [1, 1, 0.5],
      radio
    );

    // Shoulder strap and attachment plate.
    addBox(0.07, 0.32, 0.035, materials.leather, [0.57, 3.23, 0.225], [0, 0, 0], radio);

    // Cord from the radio to the shoulder.
    cylinderBetween(
      [0.58, 3.46, 0.29],
      [0.55, 3.05, 0.25],
      0.014,
      0.014,
      materials.black,
      radio,
      5
    );

    // Small shoulder pad.
    addBox(0.18, 0.18, 0.12, materials.navyDark, [0.54, 3.10, 0.22], [0, 0, 0], radio);

    // -------------------------------------------------------------------------
    // Export GLB
    // -------------------------------------------------------------------------

    const exporter = new GLTFExporter();

    exportButton.addEventListener("click", () => {
      exportButton.disabled = true;
      status.textContent = "Building GLB…";

      cop.updateMatrixWorld(true);

      exporter.parse(
        cop,
        (result) => {
          const blob = new Blob([result], {
            type: "model/gltf-binary"
          });

          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "low_poly_cop.glb";
          document.body.appendChild(link);
          link.click();
          link.remove();

          setTimeout(() => URL.revokeObjectURL(url), 1000);

          exportButton.disabled = false;
          status.textContent = "GLB downloaded";
        },
        (error) => {
          console.error(error);
          exportButton.disabled = false;
          status.textContent = "Export failed";
        },
        {
          binary: true,
          onlyVisible: true,
          truncateDrawRange: true
        }
      );
    });

    // -------------------------------------------------------------------------
    // Render loop and resizing
    // -------------------------------------------------------------------------

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
